# Tests automatiques : lancés sur chaque pull request et sur chaque envoi vers main ou la branche de réparation.
# Ils n'ont besoin d'aucun secret : le front est testé avec un faux serveur, le back avec une base Postgres embarquée.
# Les tests de bout en bout contre le vrai back (projet « e2e ») ne tournent que sur demande, en local.
# Les actions sont épinglées sur un commit précis (et non une étiquette, qui peut être déplacée).
name: tests

on:
  pull_request:
  push:
    branches: [main, 'fix/**']

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Anti-cache à jour
        run: node tools/version.mjs --verifier
      - name: Navigateur de test
        run: npx playwright install --with-deps chromium
      - name: Tests (SQL, bureau, mobile)
        run: npx playwright test
        env:
          CI: 'true'
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resultats-des-tests
          path: test-results/
          retention-days: 7
