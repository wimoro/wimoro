function mostCited(){const c={};for(const x of room('general').msgs){const mm=(x.text||'').match(/#([a-z0-9-]+)/g);if(mm)mm.forEach(t=>{const id=t.slice(1);if(MK[id])c[id]=(c[id]||0)+1;});if(x.bet)c[x.bet.m]=(c[x.bet.m]||0)+1;}let best='btc150k',bv=0;for(const k in c)if(c[k]>bv){bv=c[k];best=k;}return MK[best];}
function tribHead(rid){const r=room(rid);let title=esc(roomLabel(rid)),sub='';if(r.kind==='global'){title='# Général';sub=`Salon ouvert à tous. <span data-online>${F.int(S.online)}</span> connectés.`;}else if(r.kind==='market'){const m=MK[rid.slice(2)];title='# '+m.id;sub=`Chat du marché « ${esc(m.short)} ». <a class="link" href="#marche-${m.id}">Ouvrir le marché</a>`;}else if(r.kind==='dm'){sub='Conversation privée.';}else if(r.kind==='league'){sub=`Live chat de la ligue. <a class="link" href="#ligue-${rid.slice(6)}">Voir le classement de la ligue</a>`;}else if(r.kind==='vip'){title='# Salon VIP';sub='Le salon des Ascendant, Immortel et Radiant.';}
 return `<div class="chat-h" style="padding-bottom:14px"><div class="tt"><div><h2>${title}</h2><div class="sub">${sub}</div></div>${r.kind==='market'?`<div class="seg"><button class="${S.ui.mtab==='live'?'on':''}" data-a="mtab" data-v="live">En direct</button><button class="${S.ui.mtab==='top'?'on':''}" data-a="mtab" data-v="top">Les plus utiles</button></div>`:''}</div></div>`;}
function vipH(){const L=conds(6),miss=L.filter(c=>!c.ok);const fake=[['satoshi','Je sors de #btc150k à 64, merci pour le voyage.'],['lea','Gros flux sur #clasico, je vous partage ma lecture.'],['kaizen','La BCE va surprendre, je reste sur #bce.'],['maxou','Qui est sur la manche éclair de 22 h ?']];
 return `<section class="pn chat trib" style="position:relative"><div class="chat-h" style="padding-bottom:14px"><div class="tt"><div><h2># Salon VIP</h2><div class="sub">Le salon des Ascendant, Immortel et Radiant. 38 joueurs y discutent en ce moment.</div></div></div></div><div class="vipprev"><div class="blur">${fake.map(([u,t])=>msgH(mkMsg({u,k:'msg',text:t,r:{'🔥':Math.round(5+R()*30)}}))).join('')}</div><div class="over"><div>${emb(6,0,'xl')}<b style="font-size:18px">Réservé au rang Ascendant</b><p class="muted" style="font-size:14px">Il te manque : ${miss.map(c=>c.label.toLowerCase()).join(', ')}.</p><button class="btn b-ink full" data-a="lock" data-g="vip">Voir ce qu’il me manque</button><a class="btn b-ghost full" href="#rang">Mon rang</a></div></div></div></section>`;}
function vChat(){const rid=S.ui.room;room(rid).unread=0;const lg=myLeagues(),dms=Object.keys(S.rooms).filter(k=>k.startsWith('dm:'));const rb=(id,label,right)=>`<button class="room${rid===id?' on':''}" data-a="troom" data-room="${id}"><span class="nm">${label}</span>${right!==undefined?right:`<span data-unread="${id}">${unr(id)}</span>`}</button>`;
 const left=`<aside class="pn rooms t-rooms"><div class="rh"><span><i class="rdot" aria-hidden="true"></i>Live chat</span></div>${rb('general',`${ic('chat',15)} Général`,`<span class="cnt"><span data-online>${F.int(S.online)}</span></span>`)}${rb('vip',`${ic(can('vip')?'crown':'lock',15)} Salon VIP`,can('vip')?undefined:`<span class="lk">Ascendant</span>`)}${lg.map(L=>rb('ligue:'+L.id,`${ic('league',15)} ${esc(L.name)}`)).join('')}<a class="room" href="#ligues"><span class="nm">${ic('plus',15)} Ligues</span></a>
 <div class="rh"><span>Chats des marchés</span></div>${MARKETS.map(m=>rb('m:'+m.id,'#'+m.id,`<span style="display:flex;gap:6px;align-items:center"><span data-unread="m:${m.id}">${unr('m:'+m.id)}</span><span class="cnt" data-monline="${m.id}">${F.int(m.online)}</span></span>`)).join('')}
 <div class="rh"><span>Messages privés</span></div>${dms.length?dms.map(d=>rb(d,`${avH(d.slice(3),22,'span')} ${esc(USERS[d.slice(3)].n)}`)).join(''):'<p class="sub" style="padding:2px 10px 8px">Ouvre le profil d’un joueur pour lui écrire.</p>'}</aside>`;
 const chips=['general','vip',...lg.map(l=>'ligue:'+l.id),...MARKETS.slice(0,6).map(m=>'m:'+m.id),...dms].map(id=>`<button class="${rid===id?'on':''}" data-a="troom" data-room="${id}">${id==='vip'&&!can('vip')?ic('lock',13):''}${esc(roomLabel(id))}</button>`).join('')+`<a class="chipl" href="#ligues">${ic('league',13)} Ligues</a>`;
 const center=rid==='vip'&&!can('vip')?vipH():chatH(rid,'trib',tribHead(rid));const m=mostCited();
 const right=`<aside class="col t-right"><section class="pn pad"><div class="sub" style="margin:0 0 8px">Le marché le plus cité dans le chat</div><a class="h2" href="#marche-${m.id}" style="display:block;line-height:1.3">${esc(m.q)}</a><div style="display:flex;align-items:baseline;gap:10px;margin:12px 0"><b class="num up" style="font-size:44px" data-mp="${m.id}">${F.pct(m.p)}</b><span class="delta ${m.p>=m.d0?'up':'dn'}" data-md="${m.id}">${F.pts(m.p-m.d0)}</span></div><div class="trail" data-trail="${m.id}"></div><div class="hbtns" style="margin-top:14px"><button class="btn b-oui" style="flex:1;min-width:0" data-a="bet" data-m="${m.id}" data-s="oui">Oui <span data-mc="${m.id}">${F.c(m.p)}</span></button><button class="btn b-non" style="flex:1;min-width:0" data-a="bet" data-m="${m.id}" data-s="non">Non <span data-mcn="${m.id}">${F.c(100-m.p)}</span></button></div></section>
 <section class="pn pad"><div class="h2">En ligne</div><div class="sub" style="margin-bottom:6px"><span data-online>${F.int(S.online)}</span> personnes</div>${['satoshi','lea','maxou','karim','ines','sofia'].map(u=>`<a class="prow" href="#joueur-${u}"><span class="pl">${avH(u,32,'span')}<span class="nm">${esc(USERS[u].n)}</span></span>${rk(USERS[u].t,USERS[u].d)}</a>`).join('')}</section>
 <section class="pn pad"><div class="h2" style="display:flex;gap:8px;align-items:center">${ic('shield',18)} Règles du chat</div><p class="sub" style="font-size:13px;margin-top:10px;line-height:1.5">Les mises partagées sont vérifiées : impossible d’annoncer une mise que tu n’as pas faite.</p><p class="sub" style="font-size:13px;margin-top:8px;line-height:1.5">Pas de liens d’affiliation ni de conseils payants.</p></section></aside>`;
 return `<div class="wrap"><div class="g-trib">${left}<div class="col" style="gap:12px"><div class="mobrooms">${chips}</div>${center}</div>${right}</div></div>`;}

/* ===================== Classement ===================== */
const lbPos=P=>({Semaine:Math.max(1,Math.round(S.me.pos*.24)),Mois:Math.max(1,Math.round(S.me.pos*.63)),Saison:S.me.pos})[P];
function lbRows(P){const k={Semaine:.08,Mois:.3,Saison:1,'Mes amis':1}[P];let ids=USER_IDS.slice();if(P==='Mes amis')ids=ids.filter(u=>friendsOf().includes(u));return ids.map(u=>{const U=USERS[u],r=rng(hash(u+P));return {u,profit:U.profit*k*(P==='Saison'||P==='Mes amis'?1:(.6+r()*.8)),acc:U.acc,bets:Math.round(U.bets*(P==='Saison'||P==='Mes amis'?1:k*1.5+.04))};}).sort((a,b)=>b.profit-a.profit);}
const lbRank=u=>lbRows('Saison').findIndex(x=>x.u===u)+1;
function lrH(x,pos){const me=x.u==='me',U=userOf(x.u);return `<div class="lr${me?' me':''}${pos<=3?' top':''}" data-href="${uHref(x.u)}"><span class="pos c-pos">${F.int(pos)}</span><span class="pl c-pl">${avH(x.u,32,'span')}<span class="nm">${esc(U.n)}${me?' (toi)':''}</span></span><span class="c-rk">${rk(U.t,U.d)}</span><span class="r c-pr"><b class="num ${plc(x.profit)}" style="font-size:20px">${x.profit>=0?'+':'−'}${F.usd0(Math.abs(x.profit))}</b></span><span class="r c-acc">${x.acc} %</span><span class="r c-bets">${F.int(x.bets)}</span><span class="r c-fol">${me?'<a class="btn b-ink sm" href="#rang">Mon rang</a>':followBtn(x.u)}</span></div>`;}
function vBoard(){const P=S.ui.lbp,rows=lbRows(P),r=myRank(),pf=portfolio(),pg=progress(),st=stats();const myP={Semaine:S.me.played?62:0,Mois:S.me.played?184:0,Saison:pf.profit,'Mes amis':pf.profit}[P];const meRow={u:'me',profit:myP,acc:st.acc,bets:S.me.played};
 let body;if(P==='Mes amis'){const all=[...rows,meRow].sort((a,b)=>b.profit-a.profit);body=all.map((x,i)=>lrH(x,i+1)).join('')+(rows.length?'':'<div class="empty">Suis des joueurs pour les retrouver ici.</div>');}else body=rows.slice(0,10).map((x,i)=>lrH(x,i+1)).join('')+'<div class="gap">…</div>'+lrH(meRow,lbPos(P));
 return `<div class="wrap"><div class="pagehead"><div><h1 class="ptitle">Classement</h1><p class="plead">Saison 3. Fin dans 12 jours. 23 000 $ répartis entre les 100 premiers, et le rang Radiant pour le top 100.</p></div><div class="hbtns lbh" style="align-items:center"><a class="btn b-white" href="#ligues">${ic('league',16)} Mes ligues</a><div class="seg">${['Semaine','Mois','Saison','Mes amis'].map(p=>`<button class="${P===p?'on':''}" data-a="lbp" data-v="${p}">${p}</button>`).join('')}</div></div></div>
 <div class="g-side"><section class="pn lb" style="overflow:hidden"><div class="lh"><span>#</span><span>Joueur</span><span>Rang</span><span class="r">Profit</span><span class="r">Précision</span><span class="r">Paris</span><span></span></div>${body}</section>
 <aside class="col"><a class="pn pad" href="#rang" style="display:block"><div class="h2">Ta saison</div><div style="display:flex;align-items:center;gap:16px;margin-top:14px">${emb(r.t,r.d,'lg')}<div><div class="num" style="font-size:40px;font-weight:800">${F.int(S.me.pos)}e</div><div class="sub">sur 38 900 joueurs, ${rankName(r.t,r.d)}</div></div></div><div class="xpbar sm" style="margin-top:16px"><i style="width:${pg.pct}%"></i></div><div class="xprow"><span>${pg.nx?`Plus que <b>${F.xp(pg.left)}</b> pour ${rankName(pg.nx.t,pg.nx.d)}`:'Rang maximal'}</span><span class="link">Voir ce qu’il me faut</span></div></a>

 <section class="pn pad"><div class="h2" style="margin-bottom:8px">Récompenses de la saison</div><div class="line"><span>1re place</span><b>5 000 $</b></div><div class="line"><span>De la 2e à la 10e place</span><b>1 000 $ chacun</b></div><div class="line"><span>De la 11e à la 100e place</span><b>100 $ chacun</b></div><p class="sub" style="margin-top:8px">Les gains sont versés en USDC sur ton solde à la fin de la saison.</p></section></aside></div></div>`;}

const EARN=[{l:'Placer un pari',s:'Sur n’importe quel marché, dès 1 $',xp:'+10',href:'#accueil',b:'Parier'},{l:'Gagner un pari éclair',s:'Un pari toutes les 30 secondes : +10 XP la mise, +40 XP si tu gagnes',xp:'+50',href:'#eclair',b:'Jouer'},{l:'Écrire dans le live chat',s:'Live chat global ou d’un marché, jusqu’à 20 XP par jour',xp:'+2',href:'#chat',b:'Discuter'},{l:'Partager une mise',s:'Puis +20 XP chaque fois que quelqu’un la suit',xp:'+5',href:'#chat',b:'Partager'},{l:'Suivre la mise d’un joueur',s:'Depuis une carte de mise dans un chat',xp:'+5',href:'#chat',b:'Voir les mises'},{l:'Créer un pari validé',s:'Quand la communauté valide ta proposition',xp:'+50',href:'#creer',b:'Créer'},{l:'Déposer des fonds',s:'Une fois par jour, en crypto',xp:'+100',href:'#depot',b:'Déposer'}];
function tierTile(i){const r=myRank();const cls=i===r.t?'cur':i<r.t?'past':'lockd';return `<button class="tier ${cls}" data-a="tier" data-t="${i}">${emb(i,i===r.t?r.d:(i<r.t?2:0))}<b>${TIERS[i].name}</b><small>${i===8?'Top 100':F.xp(DIV_XP[i][0])}</small></button>`;}
function missionsH(){return S.me.missions.map(m=>`<div class="mis"><div class="ml"><b>${m.label}</b><small>${m.have} sur ${m.goal}, +${m.xp} XP</small></div>${m.claimed?'<span class="xpc">Récupéré</span>':m.have>=m.goal?`<button class="btn b-oui sm" data-a="claim" data-id="${m.id}">Récupérer ${m.xp} XP</button>`:`<a class="btn b-ghost sm" href="${m.go}">Y aller</a>`}<div class="xpbar sm"><i style="width:${Math.min(100,m.have/m.goal*100)}%"></i></div></div>`).join('');}
function vRank(){const r=myRank(),pg=progress(),nt=r.t<8?r.t+1:null;const cur=TIERS[r.t];
 const blockedTxt=pg.blocked&&pg.nx?`Ton XP suffit pour ${rankName(pg.nx.t,0)}. Remplis les conditions ci-dessous pour monter.`:'';
 return `<div class="wrap"><div class="g-side"><div class="col">
 <section class="pn pad rk-hero">${emb(r.t,r.d,'xxl')}<div><div class="kick">Ton rang, saison 3</div><h1>${rankName(r.t,r.d)}</h1>${pg.blocked&&pg.nx?lastStepH(pg):`<div style="margin-top:18px"><div class="xpbar"><i style="width:${pg.pct}%"></i></div><div class="xprow"><span><b>${F.int(S.me.xp)}</b> / ${F.xp(pg.next)}</span><span>${pg.nx?`Plus que <b>${F.xp(pg.left)}</b> pour ${rankName(pg.nx.t,pg.nx.d)}`:'Rang maximal'}</span></div></div><div class="hbtns" style="margin-top:18px"><a class="btn b-oui" href="#eclair">${ic('bolt',16,'#fff')} <span>Gagner de l’XP<span class="lg-only"> vite</span></span></a><a class="btn b-white" href="#classement">Voir le classement</a></div>`}</div></section>
 ${nt!==null?`<section class="pn pad"><div class="ph"><div><div class="h2">Prochain palier : ${TIERS[nt].name} I</div><div class="sub">Pour changer de palier, il faut remplir toutes les conditions. Entre deux divisions, seule l’XP compte.</div></div>${emb(nt,0,'e44')}</div>${conds(nt).map(condH).join('')}</section>`:''}
 <section class="pn pad"><div class="ph" style="margin-bottom:4px"><div><div class="h2">Missions du jour</div><div class="sub">Renouvelées chaque jour à minuit.</div></div><span class="xpc">Jusqu’à +130 XP</span></div><div data-missions>${missionsH()}</div></section>

function searchRes(q){q=norm(q.trim());if(!q)return [];const out=[];for(const m of MARKETS)if(norm(m.q+' '+m.short+' '+m.cat).includes(q))out.push({href:'#marche-'+m.id,l:m.short,s:`${m.cat}, ${F.pct(m.p)}`});for(const u of USER_IDS)if(norm(USERS[u].n).includes(q))out.push({href:'#joueur-'+u,l:USERS[u].n,s:rankName(USERS[u].t,USERS[u].d)});if('eclair'.includes(q)||q.includes('eclair'))out.push({href:'#eclair',l:'Pari éclair',s:'Une manche toutes les 45 secondes'});for(const d of GAMES)if(norm(d.name+' '+d.code).includes(q))out.push({href:'#eclair',l:'Éclair : '+d.name,s:d.cat,go:d.id});return out.slice(0,7);}
function showSearch(inp){const box=inp.parentElement.querySelector('.sres');const L=searchRes(inp.value);box.innerHTML=L.length?L.map((x,i)=>`<a href="${x.href}" class="${i===0?'sel':''}"><span>${esc(x.l)}</span><small>${esc(x.s)}</small></a>`).join(''):(inp.value.trim()?'<div class="empty" style="padding:14px">Aucun résultat.</div>':'');box.classList.toggle('open',!!inp.value.trim());fixText(box);}

<script>

/* ===================== Ligues ===================== */
const PUBLIC_LEAGUES=[
 {id:'lg-crypto-soir',name:'Crypto du soir',owner:'satoshi',count:128,cat:'Crypto',pub:true,desc:'Les paris crypto du soir, entre habitués.',mem:['satoshi','maxou','ines','tomtom','jules','sofia']},

 {id:'lg-eclairs',name:'Les Éclairs',owner:'ines',count:212,cat:'Éclair',pub:true,desc:'Un pari toutes les 45 secondes, toute la soirée.',mem:['ines','maxou','orbital','nina','mehdi']},

];

function lgCode(id){const r=rng(hash(id));const al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return 'WMR-'+Array.from({length:4},()=>al[Math.floor(r()*al.length)]).join('');}
function lgRows(L){const ids=(L.mem||[]).slice();if(joined(L.id))ids.push('me');return ids.map(u=>{const r=rng(hash(L.id+u));const U=userOf(u);const profit=u==='me'?(S.me.played?Math.max(12,portfolio().profit*.05):0):Math.round(U.profit*.02*(.45+r()));return {u,profit,acc:u==='me'?stats().acc:U.acc,bets:u==='me'?Math.min(S.me.played,40):Math.round(8+r()*50)};}).sort((a,b)=>b.profit-a.profit);}
const mbr=n=>`${F.int(n)} membre${n>1?'s':''}`;
function lgCount(L){return (L.count||0)+(L.owner==='me'||L.priv?(L.mem||[]).length+1:0)+(joined(L.id)&&L.pub?1:0);}
function seedLeagueRoom(L){const r=room('ligue:'+L.id);if(r.msgs.length)return;const t=now();const owner=L.owner==='me'?null:L.owner;
 if(owner)r.msgs.push(mkMsg({u:owner,k:'msg',text:`Bienvenue dans ${L.name} ! Le défi de la semaine est lancé : le meilleur profit gagne 300 XP.`,at:t-36e5}));
 (L.mem||[]).filter(u=>u!==owner).slice(0,3).forEach((u,i)=>r.msgs.push(mkMsg({u,k:'msg',text:pick(['Je suis dedans cette semaine.','Qui joue l’éclair ce soir ?','J’ai pris Oui sur #btc150k, vous me suivez ?','Le Clásico va tout décider dans le classement.']),at:t-(30-i*8)*60000})));
 if(L.owner==='me')r.msgs.push(mkMsg({k:'evt',text:`Ligue « ${L.name} » créée. Partage le code ${lgCode(L.id)} pour inviter tes amis.`}));}
function lgCardMine(L){const rows=lgRows(L),pos=rows.findIndex(x=>x.u==='me')+1;return `<a class="lgrow" href="#ligue-${L.id}"><span class="lgic">${ic('league',18,'#2448FF')}</span><span class="lgt"><b>${esc(L.name)}</b><small>${mbr(lgCount(L))}, ${L.pub?'publique':'privée'}${L.owner==='me'?', tu es fondateur':''}</small></span><span class="lgp"><b class="num">${pos}<small>e</small></b><small>sur ${rows.length}</small></span>${ic('right',18,'#A3A8B2')}</a>`;}
function lgCardPub(L){const j=joined(L.id),U=USERS[L.owner];return `<div class="lgcard"><div class="lgh"><span class="lgic">${ic('league',18,'#2448FF')}</span><span class="tag2">${L.cat}</span></div><b>${esc(L.name)}</b><p>${esc(L.desc)}</p><div class="lgm"><span>${mbr(lgCount(L))}</span><span>Créée par ${esc(U.n)}</span></div>${j?`<a class="btn b-soft sm full" href="#ligue-${L.id}">Ouvrir</a>`:`<button class="btn b-ink sm full" data-a="lg-join" data-id="${L.id}">Rejoindre</button>`}</div>`;}
function vLeagues(){const mine=myLeagues();return `<div class="wrap"><div class="pagehead"><div><h1 class="ptitle">Ligues</h1><p class="plead">Un classement et un chat rien qu’à vous. Crée ta ligue, invite tes amis et affrontez-vous chaque semaine.</p></div><div class="hbtns">${gateBtn('league',ic('plus',16,'#fff')+' Créer une ligue','b-oui')}</div></div>
 <div class="g-side"><div class="col"><section class="pn pad"><div class="ph" style="margin-bottom:6px"><div><div class="h2">Mes ligues</div><div class="sub">${mine.length?`${mine.length} ligue${mine.length>1?'s':''}`:'Tu n’as encore rejoint aucune ligue.'}</div></div></div>${mine.length?mine.map(lgCardMine).join(''):`<div class="empty" style="padding:24px 0">Rejoins une ligue publique ci-dessous, ou crée la tienne.</div>`}</section>
 <section class="pn pad"><div class="h2">Ligues publiques</div><div class="sub">Ouvertes à tous : rejoins-en une pour te mesurer à d’autres joueurs.</div><div class="lgrid">${PUBLIC_LEAGUES.map(lgCardPub).join('')}</div></section></div>
 <aside class="col"><section class="pn pad"><div class="h2">Rejoindre avec un code</div><div class="sub">Un ami t’a envoyé un code d’invitation ?</div><form class="col" data-form="lgcode" style="gap:10px;margin-top:14px"><div class="field"><input name="code" placeholder="WMR-7K2Q" autocomplete="off" maxlength="8" style="text-transform:uppercase" aria-label="Code d’invitation"></div><button class="btn b-ink" type="submit">Rejoindre la ligue</button><p class="sub" data-lgerr style="color:var(--nonT)"></p></form></section>
 <section class="pn pad"><div class="h2" style="margin-bottom:14px">Comment ça marche</div><ol class="steps"><li>Crée une ligue publique ou privée. C’est possible dès le rang Or.</li><li>Partage le code d’invitation à tes amis.</li><li>Chaque semaine, le meilleur profit de la ligue gagne 300 XP.</li></ol></section></aside></div></div>`;}
function vLeague(id){const L=LG(id);if(!L)return vLeagues();const j=joined(id),rows=lgRows(L),code=lgCode(id),own=L.owner==='me';if(j)seedLeagueRoom(L);const me=rows.findIndex(x=>x.u==='me');const gap=me>0?rows[0].profit-rows[me].profit:0;
 const table=`<section class="pn lb" style="overflow:hidden"><div style="padding:18px 20px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px"><div><div class="h2">Classement de la semaine</div><div class="sub">Profit réalisé depuis lundi</div></div><span class="xpc">Fin dans 4 j 12 h</span></div><div class="lh"><span>#</span><span>Joueur</span><span>Rang</span><span class="r">Profit</span><span class="r">Précision</span><span class="r">Paris</span><span></span></div>${rows.map((x,i)=>lrH(x,i+1)).join('')}</section>`;
 const chat=j?chatH('ligue:'+id,'mkt',`<div class="chat-h" style="padding-bottom:14px"><div class="tt"><div><h2>Live chat de la ligue</h2><div class="sub">${mbr(rows.length)}</div></div></div></div>`):`<section class="pn pad" style="text-align:center"><div class="h2">Live chat de la ligue</div><p class="sub" style="margin:8px 0 14px">Rejoins la ligue pour lire et écrire dans son chat.</p><button class="btn b-ink" data-a="lg-join" data-id="${id}">Rejoindre la ligue</button></section>`;
 return `<div class="wrap"><nav class="crumbs"><a href="#ligues">Ligues</a><span>/</span><span>${esc(L.name)}</span></nav><div class="pagehead" style="margin-top:10px"><div><h1 class="ptitle">${esc(L.name)}</h1><p class="plead">${esc(L.desc||'')} ${mbr(lgCount(L))}, ligue ${L.pub?'publique':'privée'}.</p></div><div class="hbtns">${j?`<button class="btn b-white" data-a="copy" data-v="${code}">${ic('copy',16)} Code ${code}</button><button class="btn b-ink" data-a="lg-invite" data-id="${id}">${ic('share',16,'#fff')} Inviter des amis</button>`:`<button class="btn b-oui" data-a="lg-join" data-id="${id}">Rejoindre la ligue</button>`}</div></div>
 <div class="g-side"><div class="col">${table}<section class="pn pad"><div class="ph"><div><div class="h2">Défi de la semaine</div><div class="sub">Le meilleur profit de la semaine gagne 300 XP et le badge Champion de ligue.</div></div><span class="xpc">+300 XP</span></div>${j?(rows.length===1?`<p class="plead" style="font-size:15px;margin:0">Tu es seul pour l’instant. Invite des amis pour lancer le défi.</p><div class="hbtns" style="margin-top:14px"><button class="btn b-ink" data-a="lg-invite" data-id="${id}">${ic('share',16,'#fff')} Inviter des amis</button></div>`:me===0?`<p class="plead" style="font-size:15px;margin:0">Tu es en tête. Garde ta place jusqu’à dimanche.</p>`:`<p class="plead" style="font-size:15px;margin:0">Tu es ${me+1}e, à ${F.usd0(gap)} du premier.</p><div class="xpbar sm" style="margin-top:12px"><i style="width:${clamp(rows[me].profit/Math.max(1,rows[0].profit)*100,4,100)}%"></i></div><div class="hbtns" style="margin-top:14px"><a class="btn b-oui" href="#eclair">${ic('bolt',16,'#fff')} Jouer l’éclair</a><a class="btn b-white" href="#accueil">Voir les marchés</a></div>`):'<p class="sub">Rejoins la ligue pour participer.</p>'}</section></div>
 <aside class="col">${chat}${j?`<section class="pn pad"><div class="h2">${own?'Gérer la ligue':'Ta participation'}</div><p class="sub" style="margin:6px 0 12px">${own?'Tu es le fondateur de cette ligue.':'Tu peux quitter la ligue à tout moment.'}</p><button class="btn b-ghost full" data-a="lg-leave" data-id="${id}">${own?'Supprimer la ligue':'Quitter la ligue'}</button></section>`:''}</aside></div></div>`;}
function leagueModal(){openModal(`<div class="md"><div class="md-h"><div><h3>Créer une ligue</h3><p>Un classement et un chat rien que pour toi et tes amis.</p></div><button class="x" data-a="close" aria-label="Fermer">${ic('x')}</button></div><form class="col" style="gap:14px" data-form="lgcreate"><div class="field"><label for="lgn">Nom de la ligue</label><input id="lgn" name="n" maxlength="30" placeholder="Les pronos du jeudi" autofocus required></div><div class="field"><label>Thème</label><div class="chips">${['Crypto','Football','Éclair','Économie','Tout'].map((c,i)=>`<label class="chip"><input type="radio" name="cat" value="${c}"${i===0?' checked':''}><span>${c==='Tout'?'Un peu de tout':c}</span></label>`).join('')}</div></div><div class="field"><label>Visibilité</label><div class="chips"><label class="chip"><input type="radio" name="pub" value="0" checked><span>Privée, sur invitation</span></label><label class="chip"><input type="radio" name="pub" value="1"><span>Publique</span></label></div></div><button class="btn b-ink lg full" type="submit">Créer la ligue</button></form></div>`);}
FORMS.lgcreate=f=>{const n=f.n.value.trim();if(n.length<3){toast({tone:'amber',icon:'info',title:'Nom trop court',text:'Au moins 3 caractères.'});return;}const id='lg-'+norm(n).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,20)+'-'+(100+Math.floor(R()*899));const pub=f.pub.value==='1';
 const L={id,name:n,owner:'me',count:0,cat:f.cat.value,pub,desc:`Ligue créée par ${S.me.n}.`,mem:[]};S.me.ownLeagues.push(L);S.me.leagues.push(id);seedLeagueRoom(L);checkBadges();closeModal();toast({tone:'blue',icon:'league',title:'Ligue créée',text:`Code d’invitation : ${lgCode(id)}`});location.hash='#ligue-'+id;save();
 [0,1].forEach(i=>setTimeout(()=>{const u=pickUser();if(L.mem.includes(u))return;L.mem.push(u);addMsg('ligue:'+id,mkMsg({k:'evt',text:`${USERS[u].n} a rejoint la ligue`}));setTimeout(()=>addMsg('ligue:'+id,mkMsg({u,k:'msg',text:pick([`Salut ${S.me.n}, merci pour l’invitation !`,'Je suis dedans pour le défi de la semaine.','Prêt pour la prochaine manche éclair.'])})),2200);toast({icon:'league',title:`${USERS[u].n} a rejoint ${n}`,text:'Ta ligue grandit.',href:'#ligue-'+id});if((S.ui.route||'')==='ligue-'+id)render(false);save();},6000+i*7000));};
FORMS.lgcode=f=>{const c=f.code.value.trim().toUpperCase(),err=f.querySelector('[data-lgerr]');if(!/^WMR-[A-Z0-9]{4}$/.test(c)){err.textContent='Le code a la forme WMR-XXXX.';return;}const exist=[...PUBLIC_LEAGUES,...S.me.ownLeagues].find(l=>lgCode(l.id)===c);if(exist){if(!joined(exist.id))S.me.leagues.push(exist.id);location.hash='#ligue-'+exist.id;save();return;}
 const id='lg-amis-'+c.slice(4).toLowerCase();const L={id,name:'Les potes du jeudi',owner:'maxou',count:0,priv:true,cat:'Tout',pub:false,desc:'Ligue privée entre amis.',mem:['maxou','sofia','jules','mehdi']};S.me.ownLeagues.push(L);S.me.leagues.push(id);toast({tone:'blue',icon:'league',title:'Tu as rejoint « Les potes du jeudi »',text:'Invitation de maxou.'});location.hash='#ligue-'+id;save();};
Object.assign(ACT,{
 'lg-join':a=>{const id=a.dataset.id;if(!joined(id)){S.me.leagues.push(id);const L=LG(id);toast({tone:'blue',icon:'league',title:`Tu as rejoint ${L.name}`,text:'Bonne chance pour le défi de la semaine.'});}if((S.ui.route||'')==='ligue-'+id)render(false);else location.hash='#ligue-'+id;save();},
 'lg-leave':a=>{const id=a.dataset.id,L=LG(id);S.me.leagues=S.me.leagues.filter(x=>x!==id);if(L&&L.owner==='me')S.me.ownLeagues=S.me.ownLeagues.filter(x=>x.id!==id);toast({icon:'league',title:L&&L.owner==='me'?'Ligue supprimée':'Tu as quitté la ligue',text:L?L.name:''});location.hash='#ligues';save();},
 'lg-invite':a=>{const L=LG(a.dataset.id);copyText(`Rejoins ma ligue « ${L.name} » sur Wimoro avec le code ${lgCode(L.id)}`,'Invitation copiée');}
});

/* ===================== Créer un marché ===================== */
const COMM_PROPS=[{id:'pp-psg',q:'Le PSG sera-t-il champion de France 2027 ?',cat:'Football',by:'karim',for:38,against:9,need:50},{id:'pp-jeu',q:'Un jeu vidéo dépassera-t-il 50 millions de ventes en 2027 ?',cat:'Culture',by:'tomtom',for:21,against:6,need:50},{id:'pp-sol',q:'Le Solana dépassera-t-il 300 $ avant juin 2027 ?',cat:'Crypto',by:'maxou',for:44,against:12,need:50}];
const slugify=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,28);
const shortOf=q=>{let s=q.replace(/\s*\?$/,'');if(s.length>34){s=s.slice(0,34);s=s.slice(0,s.lastIndexOf(' '))+'…';}return s;};
const dateFr=(d,t)=>{const x=new Date(d+'T'+(t||'21:00'));return isNaN(x)?'':x.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})+' à '+(t||'21:00');};
function crChecks(dr){const q=dr.q.trim(),d=new Date(dr.date+'T'+(dr.time||'21:00'));return [{ok:q.length>=15,l:'Une question d’au moins 15 caractères'},{ok:/\?$/.test(q),l:'Elle se termine par un point d’interrogation'},{ok:!isNaN(d)&&d>new Date(),l:'Une date de clôture dans le futur'},{ok:dr.src.trim().length>=3,l:'Une source de résolution vérifiable'},{ok:dr.rules.trim().length>=30,l:'Des règles d’au moins 30 caractères'}];}
function crPreviewH(){const dr=S.ui.draft,p=+dr.p0,days=dr.date?Math.max(0,Math.round((new Date(dr.date+'T'+(dr.time||'21:00'))-new Date())/864e5)):null;return `<div class="prevcard"><div class="cat">${esc(dr.cat)}</div><div class="q">${dr.q.trim()?esc(dr.q.trim()):'<span class="muted">Ta question apparaîtra ici</span>'}</div><div class="prevrow"><div><b class="num">${p} %</b><small>chance Oui</small></div><div class="hbtns"><span class="btn b-ouis sm">Oui ${p} ¢</span><span class="btn b-nons sm">Non ${100-p} ¢</span></div></div><div class="sub">${days===null?'Choisis une date de clôture':days===0?'Clôture aujourd’hui':`Clôture dans ${days} j`}${dr.src.trim()?`, résolu selon ${esc(dr.src.trim())}`:''}</div></div>`;}
function crChecksH(){return crChecks(S.ui.draft).map(c=>`<div class="chk2${c.ok?' ok':''}"><span class="ck">${c.ok?ic('check',12,'#fff',3):''}</span>${c.l}</div>`).join('');}
function propRowH(pr,mine){const tot=pr.for+pr.against,pct=Math.round(pr.for/Math.max(1,pr.need)*100);const st=pr.status==='live'?`<a class="btn b-oui sm" href="#marche-${pr.mid}">Voir le marché</a>`:mine?`<span class="xpc" data-prs="${pr.id}">En vote</span>`:(S.me.voted[pr.id]?`<span class="xpc">Tu as voté ${S.me.voted[pr.id]==='for'?'pour':'contre'}</span>`:`<span class="hbtns"><button class="btn b-ouis sm" data-a="vote" data-id="${pr.id}" data-v="for">Pour</button><button class="btn b-nons sm" data-a="vote" data-id="${pr.id}" data-v="against">Contre</button></span>`);
 return `<div class="prop" data-prop="${pr.id}"><div class="pq"><span class="tag2">${pr.cat}</span><b>${esc(pr.q)}</b><small>${mine?'Ta proposition':'Proposée par '+esc(USERS[pr.by].n)}, <span data-prv="${pr.id}">${pr.for} pour, ${pr.against} contre</span>${pr.status==='live'?', validée':`, ${pr.need} votes pour la valider`}</small></div>${st}<div class="xpbar sm"><i data-prb="${pr.id}" style="width:${Math.min(100,pct)}%"></i></div></div>`;}
function vCreate(){const dr=S.ui.draft,tab=S.ui.crTab,mine=S.me.props||[];if(!dr.date){const d=new Date(Date.now()+30*864e5);dr.date=d.toISOString().slice(0,10);}const okAll=crChecks(dr).every(c=>c.ok)&&can('propose');
 const tabs=`<div class="seg">${[['form','Nouveau pari'],['mine',`Mes propositions${mine.length?' ('+mine.length+')':''}`],['vote','À voter']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="cr-tab" data-v="${k}">${l}</button>`).join('')}</div>`;
 let body='';
 if(tab==='form')body=`${can('propose')?'':`<button class="lockrow on-bg" data-a="lock" data-g="propose" style="width:100%;margin-bottom:20px"><span style="display:flex;gap:10px;align-items:center">${ic('lock',16,'#7A808C')}<span>Créer un pari se débloque au rang Or. Clique pour voir ce qu’il te manque.</span></span>${rk(3,0)}</button>`}<div class="g-dep"><form class="col" data-form="create" novalidate>
 <section class="pn pad step"><div class="step-h"><i>1</i><h3>La question</h3></div><div class="field"><label for="cq">Question, avec une réponse Oui ou Non</label><input id="cq" data-cr="q" maxlength="120" placeholder="Le PSG sera-t-il champion de France 2027 ?" value="${esc(dr.q)}" autocomplete="off"><span class="sub" data-crcount>${dr.q.length} / 120</span></div><div class="field"><label>Catégorie</label><div class="chips">${CATS.filter(c=>c!=='Tout').map(c=>`<button type="button" class="chip${dr.cat===c?' on':''}" data-a="cr-cat" data-v="${c}">${c}</button>`).join('')}</div></div></section>
 <section class="pn pad step"><div class="step-h"><i>2</i><h3>Clôture et résolution</h3></div><div class="row2"><div class="field"><label for="cd">Date de clôture</label><input id="cd" type="date" data-cr="date" value="${dr.date}" min="${today()}"></div><div class="field"><label for="ct">Heure</label><input id="ct" type="time" data-cr="time" value="${dr.time}"></div></div><div class="field"><label for="cs">Source de résolution</label><input id="cs" data-cr="src" placeholder="Site officiel de la Ligue 1" value="${esc(dr.src)}" autocomplete="off"></div><div class="field"><label for="crr">Règles de résolution</label><textarea id="crr" data-cr="rules" rows="4" placeholder="Ce marché se résout par Oui si…">${esc(dr.rules)}</textarea><button type="button" class="link" data-a="cr-rules" style="align-self:flex-start;font-size:13px">Rédiger les règles à partir de ma question</button></div></section>

 const pr={id:'pr'+Date.now(),q:dr.q.trim(),cat:dr.cat,date:dr.date,time:dr.time,src:dr.src.trim(),rules:dr.rules.trim(),p0:+dr.p0,status:'vote',for:1,against:0,need:25,at:now()};S.me.props.unshift(pr);

function createMarketFromProposal(pr,announce){const id='perso-'+slugify(pr.q)+'-'+(hash(pr.id)%1000);pr.mid=id;if(MK[id])return MK[id];const d=new Date(pr.date+'T'+(pr.time||'21:00'));const days=Math.max(0,Math.round((d-new Date())/864e5));
 const m={id,cat:pr.cat,q:pr.q,short:shortOf(pr.q),p:pr.p0,d0:pr.p0,vol:250,close:days<=0?'Aujourd’hui':'Dans '+days+' j',closeLong:dateFr(pr.date,pr.time),days,people:12,msgs:0,heat:1.6,rules:pr.rules+(pr.src?` Source : ${pr.src}.`:''),creator:'me',anchor:pr.p0,bets:[],online:9,hotUntil:now()+90000};
 for(let i=0;i<30;i++)m.bets.push({s:R()<m.p/100?1:0,a:Math.pow(R(),2.2),me:0});MARKETS.push(m);MK[id]=m;room('m:'+id).msgs.push(mkMsg({k:'evt',text:`Pari proposé par ${S.me.n} et validé par la communauté.`}));
 if(announce){toast({tone:'blue',icon:'check',title:'Ton pari est en ligne',text:`${m.short} : +50 XP`,href:'#marche-'+id,dur:6000});notif('check',`Ton pari « ${m.short} » est en ligne.`,'#marche-'+id);gainXP(50);confetti(40);}return m;}

 :`<div class="pickl" style="margin-top:18px">${[['Portefeuille Ethereum du navigateur','Ethereum, Base, Arbitrum'],['Portefeuille Solana','Solana'],['Application mobile','Scanne un QR code avec ton portefeuille']].map(([t,s2])=>`<button data-a="wallet" data-v="${t}" data-new=""><span><b>${t}</b><small class="muted" style="display:block">${s2}</small></span>${ic('right',18)}</button>`).join('')}</div><p class="sub" style="margin-top:12px">Tu signes un message pour prouver que l’adresse t’appartient. Aucune transaction, aucun frais.</p>`}
 <div class="orl"><span>ou</span></div><button class="btn b-ghost lg full" data-a="demo-login">Utiliser le compte démo (dan.h, Or II)</button><p class="sub" style="text-align:center;margin-top:10px">Les comptes créés ici restent dans ce navigateur : tu peux te déconnecter et revenir avec ton e-mail et ton mot de passe.</p><p class="sub" style="text-align:center;margin-top:18px;font-size:14px">Pas encore de compte ? <a class="link" href="#inscription">Créer un compte</a></p></div>`);}

function pwScore(p){let s=0;if(p.length>=8)s++;if(/[A-Z]/.test(p)&&/[a-z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p)||p.length>=12)s++;return s;}

function pseudoMsg(v){if(!v)return ['','3 à 20 caractères : lettres, chiffres, point ou tiret bas.'];if(!/^[A-Za-z0-9._]{3,20}$/.test(v))return ['bad','3 à 20 caractères : lettres, chiffres, point ou tiret bas.'];if(takenNames().includes(v.toLowerCase()))return ['bad','Ce pseudo est déjà pris.'];return ['ok','Ce pseudo est disponible.'];}
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.su;if(!k)return;const v=e.target.value;
 if(k==='pseudo'){const [st,msg]=pseudoMsg(v.trim());const el=$('[data-sun]');if(el){el.textContent=msg;el.style.color=st==='bad'?'var(--nonT)':st==='ok'?'var(--oui)':'';}}

FORMS.login=f=>{const e=f.email.value.trim().toLowerCase(),p=f.pw.value,err=f.querySelector('[data-autherr]');if(!EMAIL_RE.test(e)){err.textContent='Entre une adresse e-mail valide.';return;}if(p.length<8){err.textContent='Le mot de passe fait au moins 8 caractères.';return;}const rec=AUTH.get(e);const legacy=rec&&rec.ph===hash(p+'|'+e);if(!rec||(rec.ph!==pwHash(p,e)&&!legacy)){err.textContent=rec?'Mot de passe incorrect.':'Aucun compte avec cet e-mail. Crée ton compte en une minute.';return;}if(legacy){rec.ph=pwHash(p,e);AUTH.set(e,rec);}err.textContent='';enterAccount(rec);doLogin();};

const TSPAN={'1 h':36e5,'6 h':216e5,'1 j':864e5,'1 sem.':6048e5,'Tout':1296e7};
function chartData(m){const t=ctype(),a=series(m,S.ui.tf),r=rng(hash(m.id+S.ui.tf+'c')),n=24,per=a.length/n,C=[];
 let prev=a[0];for(let k=0;k<n;k++){const base=a[(k+1)*per-1],o=prev,c=k===n-1?m.p:clamp(base+(r()-.5)*2.6,1,99),h=Math.min(99.5,Math.max(o,c)+.2+r()*1.1),l=Math.max(.5,Math.min(o,c)-.2-r()*1.1);C.push({o,c,h,l,v:.35+r()*.65+Math.min(1.6,Math.abs(c-o)*.45)});prev=c;}
 const lo=t==='bougies'?Math.min(...C.map(c=>c.l)):Math.min(...a),hi=t==='bougies'?Math.max(...C.map(c=>c.h)):Math.max(...a);
 let mn=Math.max(0,Math.floor((lo-3)/10)*10),mx=Math.min(100,Math.ceil((hi+3)/10)*10);if(mx-mn<20)mx=Math.min(100,mn+20);if(mx-mn<20)mn=Math.max(0,mx-20);
 return {t,a,C,mn,mx};}
const CHD={};
function chartInner(m){const d=chartData(m),{t,a,C,mn,mx}=d,W=800,H=240,y=v=>H-(v-mn)/(mx-mn)*H,n=C.length,sw=W/n,bw=sw*.56,vmax=Math.max(...C.map(c=>c.v)),VH=H*.16;CHD[m.id]=d;
 let g='',lab='',vol='',body='';
 for(let v=mn;v<=mx;v+=10){g+=`<line class="gl" x1="0" x2="${W}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>`;lab+=`<span class="ylab" style="top:${(y(v)/H*100).toFixed(2)}%">${v} %</span>`;}
 C.forEach((c,k)=>{const cx=sw*(k+.5),cl=c.c>=c.o?'up':'dn',vh=c.v/vmax*VH;vol+=`<rect class="vo ${t==='bougies'?cl:'nt'}" x="${(cx-bw/2).toFixed(1)}" y="${(H-vh).toFixed(1)}" width="${bw.toFixed(1)}" height="${vh.toFixed(1)}"/>`;
  if(t==='bougies'){const yt=y(Math.max(c.o,c.c)),yb=y(Math.min(c.o,c.c));body+=`<line class="wk ${cl}" x1="${cx.toFixed(1)}" x2="${cx.toFixed(1)}" y1="${y(c.h).toFixed(1)}" y2="${y(c.l).toFixed(1)}"/><rect class="bd ${cl}" x="${(cx-bw/2).toFixed(1)}" y="${yt.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1.6,yb-yt).toFixed(1)}"/>`;}});
 if(t!=='bougies'){const x=i=>i/(a.length-1)*W,p=a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');body=`<path class="ar" d="${p} L${W} ${H} L0 ${H}Z"/><path class="ln" d="${p}"/>`;}
 const last=C[n-1],lc=t==='bougies'?(last.c>=last.o?'up':'dn'):'ln',yp=(y(m.p)/H*100).toFixed(2),per=a.length/n;
 const pins=[[16,.04],[42,.09],[63,.16]].map(([i,k])=>{const ci=Math.floor(i/per),left=t==='bougies'?(ci+.5)/n*100:i/(a.length-1)*100,top=t==='bougies'?y(C[ci].h):y(a[i]);return `<button class="pin" data-a="pin" style="left:${left.toFixed(2)}%;top:${(top/H*100).toFixed(2)}%" aria-label="Voir les messages de ce moment">${ic('chat',11,'#fff',2.4)} ${Math.max(3,Math.round(m.msgs*k))}</button>`;}).join('');
 return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${g}${vol}${body}<line class="cur ${lc}" x1="0" x2="${W}" y1="${y(m.p).toFixed(1)}" y2="${y(m.p).toFixed(1)}"/></svg>${lab}<span class="ptag ${lc}" style="top:${yp}%">${F.pct(m.p)}</span>${pins}${t==='bougies'?'':`<i class="dot" style="left:100%;top:${yp}%"></i>`}`;}
function tfLabel(t){const d=new Date(t);if(S.ui.tf==='Tout')return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});if(S.ui.tf==='1 sem.')return d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'});return hhmm(t);}
function xlabs(tf){const sp=TSPAN[tf]||TSPAN['1 j'],n=now();return [0,.25,.5,.75].map(f=>tfLabel(n-sp*(1-f))).concat('Maintenant');}

 const i=k===undefined?a.length-1:k,v=a[i],ch=v-a[0];return `<span class="ot">${tfTime(i/(a.length-1),i===a.length-1)}</span><span>Oui <b>${F.pct(v)}</b></span><b class="${ch>=0?'up':'dn'}">${F.pts(ch)} sur la période</b>`;}

document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.pe;if(!k||!S.ui.pe)return;S.ui.pe[k]=e.target.value;
 if(k==='n'){const [st,msg]=peNameMsg(e.target.value.trim());const el=$('[data-pen]');if(el){el.textContent=msg;el.style.color=st==='bad'?'var(--nonT)':st==='ok'?'var(--oui)':'';}const av=$('[data-peav]');if(av)av.innerHTML=iniOf(e.target.value);}

 peRefresh();});

FORMS.profile=()=>{const p=S.ui.pe;if(!p)return;const n=p.n.trim(),[st,msg]=peNameMsg(n);if(st==='bad'){toast({tone:'amber',icon:'info',title:'Pseudo invalide',text:msg});const i=$('#pen');if(i)i.focus();return;}if(p.email.trim()&&!EMAIL_RE.test(p.email.trim())){toast({tone:'amber',icon:'info',title:'E-mail invalide',text:'Vérifie ton adresse e-mail.'});const i=$('#pee');if(i)i.focus();return;}
 const me=S.me,renamed=n!==me.n;me.n=n;me.color=p.color;me.bio=p.bio.trim();me.interests=p.interests.slice();me.email=p.email.trim();me.wallet=p.wallet;me.prefs=Object.assign({},p.prefs);if(!me.interests.length&&S.ui.cat==='Pour toi')S.ui.cat='Tout';
 const rec=accountOfMe();if(rec&&!rec.demo){rec.pseudo=me.n;rec.email=me.email;AUTH.set(rec.key,rec);}S.ui.pe=null;updateHeader();save();toast({tone:'green',icon:'check',title:'Profil mis à jour',text:renamed?`Tu t’appelles maintenant ${n}.`:'Tes changements sont enregistrés.'});notif('user','Ton profil a été mis à jour.','#profil');location.hash='#profil';};

/* Bouton « Vendre des parts » : vert si la position gagne, rouge si elle perd */
function posTot(mid){return S.me.positions.filter(x=>x.m===mid).reduce((s,x)=>s+posPnl(x),0);}
function sellBtnH(mid){const t=posTot(mid);return `<button class="btn ${t>0.004?'b-gain':t<-0.004?'b-loss':'b-white'} full sellbtn" data-a="tmode" data-v="sell" data-psell="${mid}"><span>Vendre des parts</span><b class="num">${F.signed(t)}</b></button>`;}
function syncSellBtns(){$$('[data-psell]').forEach(b=>{const t=posTot(b.dataset.psell);b.classList.toggle('b-gain',t>0.004);b.classList.toggle('b-loss',t<-0.004);b.classList.toggle('b-white',Math.abs(t)<=0.004);const v=b.querySelector('b');if(v)v.textContent=F.signed(t);});}

/* ===================== Retrouver ses paris créés ===================== */
function homeTabs(){const base=S.me.interests.length?['Pour toi',...CATS]:CATS.slice();if((S.me.props||[]).length){const i=base.indexOf('Tout');base.splice(i+1,0,'Mes paris créés');}else if(S.ui.cat==='Mes paris créés')S.ui.cat='Tout';return base;}
function voteRowH(pr){const pct=Math.min(100,pr.for/pr.need*100);return `<div class="row vrow" data-href="#creer"><div class="qcell"><div class="cat">${pr.cat}<span class="ctag vote">En vote</span></div><a class="q" href="#creer" data-a="cr-tab" data-v="mine">${esc(pr.q)}</a></div><div class="pv"><div class="num">${F.pct(pr.p0)}</div><div class="delta">au départ</div></div><div class="tr"><div class="vbar"><i data-prb="${pr.id}" style="width:${pct}%"></i></div><small data-prv="${pr.id}">${pr.for} pour, ${pr.against} contre</small></div><div class="vol"><div class="v" data-prc="${pr.id}">${pr.for} / ${pr.need}</div><div class="c">votes</div></div><div class="acts"><a class="btn b-ghost sm" href="#creer" data-a="cr-tab" data-v="mine">Suivre le vote</a></div></div>`;}
function myBoardH(){const P=S.me.props||[];const live=P.filter(p=>p.status==='live'&&MK[p.mid]).map(p=>MK[p.mid]),vote=P.filter(p=>p.status==='vote');if(!live.length&&!vote.length)return `<div class="empty">Tu n’as pas encore créé de pari. <a class="link" href="#creer" data-a="cr-tab" data-v="form">Créer un pari</a></div>`;
 return `<div class="hd"><span>Pari</span><span>Chance Oui</span><span>Volume</span><span>Total</span><span></span></div>`+live.map(rowH).join('')+vote.map(voteRowH).join('');}
function myBetsH(){const L=S.me.props||[];if(!L.length)return `<div class="empty">Tu n’as pas encore créé de pari. <a class="link" href="#creer" data-a="cr-tab" data-v="form">Créer un pari</a></div>`;
 return `<div style="padding:4px 20px 12px">${L.map(pr=>{const m=pr.status==='live'?MK[pr.mid]:null;if(m)return `<a class="act mybet" href="#marche-${m.id}"><span><span class="ctag">En ligne</span>${esc(m.q)}<small style="display:block;margin-top:3px">${m.cat}, ${F.int(m.people)} participants, volume ${F.compact(m.vol)}</small></span><b class="num up" style="font-size:20px" data-mp="${m.id}">${F.pct(m.p)}</b></a>`;
  return `<a class="act mybet" href="#creer" data-a="cr-tab" data-v="mine"><span><span class="ctag vote">En vote</span>${esc(pr.q)}<small style="display:block;margin-top:3px" data-prv="${pr.id}">${pr.for} pour, ${pr.against} contre</small></span><b class="num" style="font-size:16px;white-space:nowrap" data-prc="${pr.id}">${pr.for} / ${pr.need}</b></a>`;}).join('')}</div>`;}
function refreshMine(){const r=S.ui.route||'';if(r==='accueil'){const b=$('#board');if(b){b.innerHTML=boardH();fixText(b);mountTrails(b);}const t=$('.filters .tabs');if(t&&!t.querySelector('[data-v="Mes paris créés"]')&&(S.me.props||[]).length)render(false);}if(r==='profil'&&S.ui.ptab==='mine')render(false);if(r==='creer')render(false);}
function catchUpVotes(){let n=0;for(const pr of S.me.props||[]){if(pr.status!=='vote')continue;const g=Math.floor((now()-(pr.tick||pr.at||now()))/1500);if(g>0){pr.for=Math.min(pr.need,pr.for+g);pr.tick=now();}if(pr.for>=pr.need){pr.status='live';createMarketFromProposal(pr,true);n++;}}if(n){refreshMine();save();}}
function voteTick(){for(const pr of S.me.props||[]){if(pr.status!=='vote')continue;if(R()<.92)pr.for+=1+Math.floor(R()*3);if(R()<.18)pr.against++;pr.tick=now();
 $$(`[data-prv="${pr.id}"]`).forEach(e=>e.textContent=`${pr.for} pour, ${pr.against} contre`);$$(`[data-prb="${pr.id}"]`).forEach(e=>e.style.width=Math.min(100,pr.for/pr.need*100)+'%');$$(`[data-prc="${pr.id}"]`).forEach(e=>e.textContent=`${Math.min(pr.for,pr.need)} / ${pr.need}`);
 if(pr.for>=pr.need){pr.for=pr.need;pr.status='live';createMarketFromProposal(pr,true);refreshMine();}save();}}

/* ===================== Accueil sur ordinateur : rang, grosses mises, top de la semaine (pas de chat) ===================== */
S.bigs=[];
function bigsH(){return S.bigs.map(b=>{const m=MK[b.m];if(!m)return '';return `<a class="bigbet" href="#marche-${m.id}">${avH(b.u,30,'span')}<span class="bt"><span><b>${esc(USERS[b.u].n)}</b> a misé <b class="num">${F.usd0(b.amt)}</b> sur <span class="sidechip ${b.s}">${b.s==='oui'?'Oui':'Non'}</span></span><small>${esc(m.short)}, ${ago(b.at)}</small></span></a>`;}).join('');}
function pushBig(seed){const u=pickUser(),m=pick(MARKETS),s=R()<m.p/100?'oui':'non',amt=Math.round((300+Math.pow(R(),2)*6200)/10)*10;S.bigs.unshift({u,m:m.id,s,amt,at:seed?now()-Math.round(R()*9e5):now()});if(seed)S.bigs.sort((a,b)=>b.at-a.at);S.bigs=S.bigs.slice(0,6);
 if(!seed){const el=$('[data-bigs]');if(el){el.innerHTML=bigsH();fixText(el);const f=el.firstElementChild;if(f)f.classList.add('new');}}}
function homeSideH(){const r=myRank(),pg=progress(),done=S.me.missions.filter(m=>m.have>=m.goal).length,top=lbRows('Semaine').slice(0,5);
 return `<section class="pn pad hs-rank"><a class="hr-top" href="#rang">${emb(r.t,r.d,'e44')}<span><span class="sub" style="margin:0;display:block">Ton rang</span><b>${rankName(r.t,r.d)}</b></span>${ic('right',18,'#A3A8B2')}</a><div class="xpbar sm" style="margin-top:14px"><i style="width:${pg.pct}%"></i></div><div class="hr-meta"><span>${pg.nx?`Plus que <b>${F.xp(pg.left)}</b> pour ${rankName(pg.nx.t,pg.nx.d)}`:'Rang maximal'}</span><a class="link" href="#rang">Missions ${done} / ${S.me.missions.length}</a></div></section>
 <section class="pn pad"><div class="ph" style="margin-bottom:8px"><div><div class="h2">Grosses mises en direct</div><div class="sub">Les plus gros paris de la dernière heure</div></div><i class="live"></i></div><div class="bigs" data-bigs>${bigsH()}</div></section>
 <section class="pn pad"><div class="ph" style="margin-bottom:6px"><div class="h2">Top de la semaine</div><a class="link" href="#classement" style="font-size:13px">Classement</a></div>${top.map((x,i)=>`<a class="t5" href="#joueur-${x.u}"><span class="t5p">${i+1}</span>${avH(x.u,28,'span')}<span class="t5n"><b>${esc(USERS[x.u].n)}</b>${rk(USERS[x.u].t,USERS[x.u].d)}</span><b class="num pl-up">+${F.usd0(x.profit)}</b></a>`).join('')}</section>`;}

/* ===================== Rang : dernière étape avant le palier suivant ===================== */
function missingConds(pg){return pg&&pg.nx?conds(pg.nx.t).filter(c=>!c.ok&&c.k!=='xp'):[];}
function condShort(c){return c.k==='acc'?`${c.have} % sur ${c.need} %`:c.k==='top'?`${F.int(c.have)}e, top ${c.need} requis`:`${F.int(c.have)} sur ${F.int(c.need)}`;}
function missingTxt(pg){return missingConds(pg).map(c=>`${c.label.toLowerCase()} (${condShort(c)})`).join(', ');}
function jumpDiv(t){let d=0;DIV_XP[t].forEach((x,i)=>{if(S.me.xp>=x)d=i;});return d;}
function lastStepH(pg){const L=missingConds(pg),t=pg.nx.t,d=jumpDiv(t),go=L.length?CGO[L[0].k]:['#eclair','Gagner de l’XP'];
 return `<div class="laststep"><div class="ls-h">${ic('lock',15,'#9A5B00',2.4)}<b>Dernière étape pour passer ${TIERS[t].name}</b></div>
 <p>Ton XP est validée : <b>${F.int(S.me.xp)} XP</b> sur ${F.xp(DIV_XP[t][0])} demandés. Pour changer de palier, il faut aussi ${L.length>1?'ces conditions':'cette condition'}. Ton XP en plus est gardée : tu passeras directement <b>${rankName(t,d)}</b>.</p>
 ${L.map(c=>{const pct=c.rev?Math.min(100,c.need/Math.max(1,c.have)*100):Math.min(100,c.have/Math.max(1,c.need)*100);return `<div class="ls-c"><div class="ls-t"><b>${c.label}</b><span>${condShort(c)}</span></div><div class="xpbar sm"><i style="width:${pct}%"></i></div><small>${CHINT[c.k]}</small></div>`;}).join('')}
 <div class="hbtns" style="margin-top:14px"><a class="btn b-oui" href="${go[0]}">${ic(go[0]==='#eclair'?'bolt':'right',16,'#fff')} ${go[1]}</a><a class="btn b-white" href="#classement">Voir le classement</a></div></div>`;}

/* ===================== Notifications : filtre des pop-up ===================== */
const AUTO_IC=['users','smile','flame','gift','star','trophy','bolt','league','bell','chat','send'],SOCIAL_IC=['users','smile','flame','chat','send','league'];
function toastAllowed(o){if(o.force)return true;const ic0=o.icon||'info',m=S.me.tmode||'all',pr=Object.assign({},PREF_DEF,S.me.prefs||{});
 if((o.flash||ic0==='bolt')&&S.me.fmute&&o.tone!=='amber')return false;
 if(!AUTO_IC.includes(ic0))return true;
 if(m==='none')return false;if(m==='imp'&&SOCIAL_IC.includes(ic0))return false;
 if(ic0==='users'&&!pr.follow)return false;if(ic0==='flame'&&!pr.signals)return false;if(ic0==='league'&&!pr.league)return false;
 return true;}
function npModeH(){const m=S.me.tmode||'all',hint={all:'Tu vois toutes les pop-up.',imp:'Seulement tes gains, tes pertes, ton rang et tes missions.',none:'Aucune pop-up. Tout reste ici, dans tes notifications.'}[m];return `<div class="np-mode"><span>Pop-up</span><div class="seg">${[['all','Toutes'],['imp','Importantes'],['none','Aucune']].map(([k,l])=>`<button class="${m===k?'on':''}" data-a="np-mode" data-v="${k}">${l}</button>`).join('')}</div></div><p class="np-hint">${hint}</p>`;}

 'fr-decline':a=>{const u=a.dataset.u,L=fIn(),i=L.indexOf(u);if(i>=0)L.splice(i,1);save();refreshFriends();},

});

 if(!pg.nx)return `<a class="pn pad prk" href="#rang"><div class="prk-h"><span class="muted">Rang maximal</span></div><div class="xpbar sm"><i style="width:100%"></i></div></a>`;
 const L=pg.blocked?missingConds(pg):[];

 return `<a class="pn pad prk" href="#rang"><div class="prk-h"><span class="muted">Prochain rang</span>${rk(pg.nx.t,pg.nx.d)}</div><p class="prk-t"><span><b>${F.int(S.me.xp)}</b> / ${F.xp(pg.next)}${pg.left?`, encore ${F.xp(pg.left)}`:''}</span></p><div class="xpbar sm"><i style="width:${pg.pct}%"></i></div><span class="link">Voir comment monter</span></a>`;}
function postRender(){
 const into=(box,el,center)=>{if(!box||!el||box.scrollWidth<=box.clientWidth+2)return;const bl=box.getBoundingClientRect().left,L=el.getBoundingClientRect().left-bl+box.scrollLeft,R=L+el.offsetWidth;
  if(center)box.scrollLeft=Math.max(0,L-(box.clientWidth-el.offsetWidth)/2);else if(R>box.scrollLeft+box.clientWidth-28||L<box.scrollLeft)box.scrollLeft=Math.max(0,L-16);};
 $$('.ladder').forEach(l=>into(l,l.querySelector('.tier.cur'),true));
 $$('.filters .tabs,.rooms').forEach(t=>into(t,t.querySelector('.on'),false));}
const renderBase=render;
render=function(top=true){renderBase(top);try{postRender();}catch(e){}};

<script>
'use strict';
/* ===================== Comptes persistants (plusieurs comptes par navigateur) ===================== */
const MEMLS={};
const LS={g(k){try{const v=localStorage.getItem(k);return v===null?(MEMLS[k]??null):v;}catch(e){return MEMLS[k]??null;}},s(k,v){MEMLS[k]=v;try{localStorage.setItem(k,v);}catch(e){}},r(k){delete MEMLS[k];try{localStorage.removeItem(k);}catch(e){}}};
const ACCK='wimoro-accounts',SESK='wimoro-session';
const AUTH={all(){try{return JSON.parse(LS.g(ACCK)||'{}')||{};}catch(e){return {};}},put(a){LS.s(ACCK,JSON.stringify(a));},get(k){const r=this.all()[k]||null;if(r&&!r.key){r.key=k;this.set(k,r);}return r;},set(k,rec){const a=this.all();a[k]=rec;this.put(a);}};
const DEMO_ACC={id:'demo',key:'__demo__',email:'dan@exemple.fr',pseudo:'dan.h',demo:true};
const pwHash=(pw,salt)=>hash(pw+'|'+salt).toString(36)+hash(salt+'|'+pw).toString(36);
const kyc=()=>!!S.me.kyc;
const guestMe=()=>Object.assign(demoMe(),{logged:false});
S.auth={key:'',demo:false};S.epoch=0;
function accKey(rec){if(rec.demo)return 'wimoro-demo';const k='wimoro-acc:'+rec.id,old='wimoro-demo:'+rec.id;return (LS.g(k)===null&&LS.g(old)!==null)?old:k;}
function enterAccount(rec,fresh,quiet){S.epoch++;KEY=accKey(rec);S.me=rec.demo?demoMe():(fresh||newMe(rec.pseudo,rec.email||''));if(!fresh)load();S.me.logged=true;
 if(!S.me.credit1m){S.me.balance+=1e6;S.me.credit1m=true;(S.me.deps=S.me.deps||[]).unshift({coin:'USDC',net:'Base',amt:1e6,usd:1e6,at:now(),conf:12,need:12,label:'Crédit démo'});}
 S.auth={key:rec.key,demo:!!rec.demo};LS.s(SESK,rec.key);
 if(!S.me.missions.some(m=>m.day))S.me.missions.forEach(m=>m.day=today());
 S.ui.dep.method='crypto';S.ui.wd.method='crypto';S.ui.fiat={dep:'50',wd:''};S.ui.kycd={doc:false};S.ui.ptab='positions';S.ui.pe=null;
 for(const d of GAMES){G(d.id).my=null;}
 checkBadges(true);flushSave();if(!quiet)updateHeader();}
function leaveAccount(){if(!S.me.logged)return;for(const d of S.me.deps||[])if(d.conf<d.need){d.conf=d.need;S.me.balance+=d.usd;S.me.deposits++;}for(const x of S.me.wds||[])if(x.st!=='sent')x.st='sent';for(const d of GAMES){const g=G(d.id);if(g.my){S.me.balance+=g.my.amt;S.me.played=Math.max(0,S.me.played-1);g.my=null;}}flushSave();S.epoch++;}
function logout(){leaveAccount();LS.r(SESK);S.auth={key:'',demo:false};KEY='wimoro-guest';S.me=guestMe();S.ui.auth=null;const u=$('#umenu');if(u)u.remove();const p=$('#npanel');if(p)p.remove();closeModal();updateHeader();toast({icon:'out',title:'Tu es déconnecté',text:'À bientôt sur Wimoro.'});location.hash='#connexion';}
function bootAuth(){const k=LS.g(SESK);S.auth={key:'',demo:false};
 if(k==='__demo__')enterAccount(DEMO_ACC,null,true);
 else if(k){const rec=AUTH.get(k);if(rec)enterAccount(rec,null,true);}
 if(!S.auth.key){KEY='wimoro-guest';S.me=guestMe();}}
function createAccount(pseudo,email,pw,extra){const key=email?email.toLowerCase():'w:'+Date.now().toString(36);const rec=Object.assign({id:hash(key).toString(36)+Date.now().toString(36).slice(-4),key,email:email||'',pseudo,ph:pw?pwHash(pw,key):''},extra||{});AUTH.set(key,rec);const me=newMe(pseudo,email||'');enterAccount(rec,me);return rec;}
function accountOfMe(){return S.auth.key?AUTH.get(S.auth.key):null;}
/* ===================== KYC et moyens de paiement ===================== */
const COUNTRIES=['France','Belgique','Suisse','Canada','Luxembourg','Autre pays'];
const METHODS=[{k:'crypto',n:'Crypto',ic:'wallet',dt:'Quelques minutes, sans frais',wt:'Quelques minutes'},{k:'card',n:'Carte bancaire',ic:'card',dt:'Instantané, 2,5 % de frais',wt:'1 jour ouvré, 1,5 % de frais'},{k:'bank',n:'Virement',ic:'bank',dt:'1 jour ouvré, sans frais',wt:'1 à 2 jours ouvrés, sans frais'},{k:'paypal',n:'PayPal',ic:'paypal',dt:'Instantané, 1,9 % de frais',wt:'Instantané, 1 % de frais'}];
const FIAT={card:{n:'Carte bancaire',tk:'CB',df:.025,wf:.015,dest:'Carte •••• 4242'},bank:{n:'Virement',tk:'SEPA',df:0,wf:0,dest:'IBAN FR76 •••• 0123'},paypal:{n:'PayPal',tk:'PP',df:.019,wf:.01,dest:'PayPal : d•••@exemple.com'}};
const dMethod=()=>{const m=S.ui.dep.method||'crypto';return m!=='crypto'&&!kyc()?'crypto':m;};
const wMethod=()=>{const m=S.ui.wd.method||'crypto';return m!=='crypto'&&!kyc()?'crypto':m;};
function methodsH(kind){const ok=kyc(),cur=kind==='dep'?dMethod():wMethod();
 const bar=ok?`<div class="kycok">${ic('check',16,'#2448FF',2.6)} KYC vérifié : tous les moyens de ${kind==='dep'?'dépôt':'retrait'} sont débloqués.</div>`:`<div class="kycbar">${ic('shield',20)}<div><b>Fais le KYC pour débloquer la carte, le virement et PayPal.</b><span>Sans KYC, tu peux ${kind==='dep'?'déposer':'retirer'} en crypto uniquement.</span></div><button class="btn b-ink sm" data-a="kyc">Faire le KYC</button></div>`;
 return `<section class="pn pad step"><div class="step-h"><h3>Moyen de ${kind==='dep'?'dépôt':'retrait'}</h3></div><div class="pms" role="group" aria-label="Moyen de paiement">${METHODS.map(m=>{const t=kind==='dep'?m.dt:m.wt,locked=m.k!=='crypto'&&!ok;return locked?`<button class="pm locked" data-a="kyc" aria-disabled="true">${ic(m.ic,22)}<b>${m.n}</b><small>${ic('lock',12)} Fais le KYC pour débloquer</small></button>`:`<button class="pm${cur===m.k?' on':''}" data-a="${kind==='dep'?'dmethod':'wmethod'}" data-v="${m.k}">${ic(m.ic,22)}<b>${m.n}</b><small>${t}</small></button>`;}).join('')}</div>${bar}</section>`;}
function whyH(){return kyc()?`<section class="pn pad"><div class="h2">Crypto ou paiement classique ?</div><p class="sub" style="font-size:14px;line-height:1.55;margin-top:8px;color:var(--g2)">La crypto arrive en quelques minutes, sans frais Wimoro. La carte et PayPal sont instantanés mais avec des frais, le virement est gratuit mais plus lent.</p></section>`:`<section class="pn pad"><div class="h2">Pourquoi le KYC ?</div><p class="sub" style="font-size:14px;line-height:1.55;margin-top:8px;color:var(--g2)">Sans vérification d’identité, seule la crypto est disponible. Avec le KYC, tu débloques aussi la carte, le virement et PayPal, pour déposer comme pour retirer.</p><button class="btn b-ink full" data-a="kyc" style="margin-top:12px">Faire le KYC</button></section>`;}
function fiatCalc(kind){const m=kind==='dep'?dMethod():wMethod(),X=FIAT[m]||FIAT.card,amt=parseFloat(String(S.ui.fiat[kind]).replace(',','.'))||0,rate=kind==='dep'?X.df:X.wf,fee=Math.round(amt*rate*100)/100;let err='';
 if(amt&&amt<10)err='Minimum : 10 $.';else if(kind==='dep'&&amt>5000)err='Maximum : 5 000 $ par dépôt dans cette démo.';else if(kind==='wd'&&amt>S.me.balance)err='Montant supérieur à ton solde.';
 return {m,X,amt,fee,net:Math.max(0,amt-fee),rate,err,ok:amt>=10&&!err};}
function fiatCalcH(kind){const c=fiatCalc(kind),dep=kind==='dep';
 return `<div class="line"><span>Frais ${c.rate?'('+F.d1(c.rate*100)+' %)':''}</span><b>${c.rate?F.usd(c.fee):'Aucun'}</b></div><div class="line"><span>${dep?'Crédité sur ton solde':'Tu reçois'}</span><b>${F.usd(c.net)}</b></div>${c.err?`<p class="sub" style="color:var(--nonT)">${c.err}</p>`:''}<button class="btn ${dep?'b-oui':'b-ink'} lg full" data-a="${dep?'fiat-dep':'fiat-wd'}"${c.ok?'':' disabled'}>${dep?(c.m==='bank'?'J’ai envoyé le virement (simulation)':'Payer '+(c.amt?F.usd(c.amt):'')+' (simulation)'):'Retirer '+(c.amt?F.usd(c.amt):'')}</button>`;}
function bankBoxH(){const ref='WMR-'+hash(S.me.n+'ref').toString(36).toUpperCase().slice(0,6);return `<div class="bankbox"><div class="line"><span>Bénéficiaire</span><b>Wimoro Payments (démo)</b></div><div class="line"><span>IBAN</span><b class="num" style="letter-spacing:.04em">FR76 0000 0000 0000 0000 0000 000</b></div><div class="line"><span>Référence à indiquer</span><b class="num">${ref}</b></div></div>`;}
function fiatDepH(){const m=dMethod(),how=m==='bank'?'Fais ton virement':m==='paypal'?'Paie avec PayPal':'Paie par carte';
 return `<section class="pn pad step"><div class="step-h"><i>1</i><h3>Montant à déposer</h3></div><div class="field"><label class="amt"><input data-fiat="dep" inputmode="decimal" value="${esc(S.ui.fiat.dep)}" placeholder="0" aria-label="Montant en dollars"><span>$</span></label><div class="qa">${[25,50,100,250].map(q=>`<button class="btn b-ghost sm" data-a="fiat-q" data-k="dep" data-v="${q}">${q} $</button>`).join('')}</div></div></section><section class="pn pad step"><div class="step-h"><i>2</i><h3>${how}</h3></div>${m==='bank'?bankBoxH():`<p class="sub" style="font-size:14px;line-height:1.55;color:var(--g2)">${m==='paypal'?'Tu serais redirigé vers PayPal pour valider le paiement.':'Tu serais redirigé vers la page de paiement sécurisée de ta banque.'} Dans cette démo, aucun vrai paiement n’est effectué et aucune donnée bancaire n’est demandée.</p>`}<div class="col" style="gap:8px" data-ficalc="dep">${fiatCalcH('dep')}</div></section>`;}
function fiatWdH(){const m=wMethod(),X=FIAT[m];return `<section class="pn pad step"><div class="step-h"><i>1</i><h3>Montant à retirer</h3></div><div class="field"><label class="amt"><input data-fiat="wd" inputmode="decimal" value="${esc(S.ui.fiat.wd)}" placeholder="0" aria-label="Montant en dollars"><button class="btn b-ghost sm" data-a="fiat-max">Max</button></label></div></section><section class="pn pad step"><div class="step-h"><i>2</i><h3>Destination</h3></div><div class="line"><span>${X.n}</span><b>${X.dest}</b></div><p class="sub" style="font-size:13px">Destination simulée pour la démo : aucune donnée bancaire n’est demandée.</p><div class="col" style="gap:8px" data-ficalc="wd">${fiatCalcH('wd')}</div></section>`;}
function fiatDepRow(d,ok){const X=FIAT[d.method]||{tk:'$'};return `<div class="dep"><span class="tk">${X.tk}</span><span class="dd"><b>${F.usd(d.amt)} par ${esc(d.net)}</b><small>Crédité ${F.usd(d.usd)}${d.fee?`, frais ${F.usd(d.fee)}`:''}, ${ago(d.at)}</small></span>${ok?`<span class="st-ok">${ic('check',13,'#2448FF',2.6)} Crédité</span>`:`<span class="st-wait">${d.method==='bank'?'En attente du virement':'Traitement'}<span class="bar"><i style="width:${d.conf/d.need*100}%"></i></span></span>`}</div>`;}
function fiatWdRow(x){const X=FIAT[x.method]||{tk:'$'};return `<div class="dep"><span class="tk">${X.tk}</span><span class="dd"><b>${F.usd(x.amt)} par ${esc(x.net)}</b><small>Vers ${esc(x.addr)}, ${ago(x.at)}</small></span>${x.st==='sent'?`<span class="st-ok">${ic('check',13,'#2448FF',2.6)} Envoyé</span>`:'<span class="st-wait">En cours d’envoi<span class="bar"><i style="width:60%"></i></span></span>'}</div>`;}
function startFiatDeposit(){const c=fiatCalc('dep');if(!c.ok)return;const m=c.m,X=c.X;const d={coin:'USD',method:m,net:X.n,amt:c.amt,fee:c.fee,usd:c.net,at:now(),conf:0,need:m==='bank'?8:3};S.me.deps.unshift(d);toast({icon:'wallet',title:m==='bank'?'Virement en attente':'Paiement en cours',text:`${F.usd(c.amt)} par ${X.n}.`});refreshDeps();const ep=S.epoch;
 const iv=setInterval(()=>{if(ep!==S.epoch){clearInterval(iv);return;}d.conf++;refreshDeps();if(d.conf>=d.need){clearInterval(iv);const before=myRank();S.me.balance+=d.usd;S.me.deposits++;updateHeader();toast({tone:'blue',icon:'check',title:`Dépôt crédité : +${F.usd(d.usd)}`,text:'Ton solde est à jour.',href:'#depot'});notif('wallet',`Dépôt crédité : ${F.usd(d.usd)} (${X.n}).`,'#depot');mission('dep');if(S.me.depDay!==today()){S.me.depDay=today();gainXP(100);}checkRank(before);checkBadges();save();if((S.ui.route||'')==='depot')render(false);}},m==='bank'?700:650);save();}
