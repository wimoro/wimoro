<script>
'use strict';
/* =====================================================================================
 *  Paris combinés
 *  ------------------------------------------------------------------------------------
 *  Plusieurs sélections Oui/Non sur des marchés différents, une seule mise : la cote du
 *  combiné est le produit des cotes de chaque sélection (cote = 100 / prix en ¢).
 *  Toutes les sélections doivent gagner. Wimoro prend 5 % du gain brut (le « vert » du
 *  combiné), plafonne le gain, et propose un encaissement anticipé à la valeur du moment.
 *  - le « slip » (S.me.slip) se remplit depuis le ticket de n'importe quel marché classique
 *    (bouton « Ajouter au combiné »), y compris les issues des marchés à cotes multiples ;
 *  - la barre en bas de l'écran rappelle le combiné en cours ; la fenêtre règle la mise ;
 *  - #combines : combinés en cours (valeur du moment, encaisser) et terminés.
 * ===================================================================================== */
const COMBO={MIN_LEGS:2,MAX_LEGS:6,MIN:2,MAX:1000,FEE:.05,MAX_PAY:50000,CASH_FEE:.05};
const slip=()=>S.me.slip||(S.me.slip={legs:[],stake:10});
const combosAll=()=>S.me.combos||(S.me.combos=[]);
const comboOf=id=>combosAll().find(c=>c.id===id)||null;
const legPrice=(m,s)=>s==='oui'?m.p:100-m.p;
const legMult=(m,s)=>100/Math.max(1,legPrice(m,s));
const cbSide=s=>s==='oui'?_t('Oui'):_t('Non');
const slipKey=m=>m.parent||m.id;
/* raison pour laquelle une sélection ne peut pas rejoindre le combiné ('' = possible) */
function slipCan(m){const L=slip().legs;if(!m||!MK[m.id])return _t("Marché introuvable.");if(L.length>=COMBO.MAX_LEGS)return `${_t("{0} sélections maximum par combiné.",[COMBO.MAX_LEGS])}`;
 if(L.some(l=>l.m===m.id))return _t("Ce marché est déjà dans ton combiné.");if(m.parent&&L.some(l=>MK[l.m]&&slipKey(MK[l.m])===slipKey(m)))return _t("Une seule issue par marché à cotes multiples.");return '';}
function slipAdd(mid,s){const m=MK[mid];const why=slipCan(m);if(why){toast({tone:'amber',icon:'info',title:_t("Impossible d’ajouter au combiné"),text:why});return false;}
 slip().legs.push({m:mid,s});save();slipBar();const n=slip().legs.length;
 toast({tone:'blue',icon:'layers',force:true,title:_t("Ajouté au combiné"),text:`${m.short} · ${_t('{0} à {1}',[cbSide(s),F.c(legPrice(m,s))])}. ${n===1?_t("Ajoute au moins une autre sélection."):`${_t("{0} sélections, cote ×{1}.",[n,F.d2(slipCalc().mult)])}`}`,dur:2600});return true;}
function slipRemove(mid){slip().legs=slip().legs.filter(l=>l.m!==mid);save();slipBar();comboModalRefresh();}
function slipClear(){slip().legs=[];save();slipBar();}
/* calcul du combiné en cours */
function slipCalc(){const L=slip().legs.map(l=>({m:l.m,s:l.s,mk:MK[l.m]})).filter(l=>l.mk);let mult=1,prob=1;for(const l of L){mult*=legMult(l.mk,l.s);prob*=legPrice(l.mk,l.s)/100;}
 const stake=clamp(F.parse(slip().stake)||0,0,COMBO.MAX),gross=stake*mult,fee=gross*COMBO.FEE;let pay=gross-fee;const capped=pay>COMBO.MAX_PAY;if(capped)pay=COMBO.MAX_PAY;
 const insuf=stake>S.me.balance;return {L,mult,prob,stake,gross,fee,pay,capped,insuf,ok:L.length>=COMBO.MIN_LEGS&&stake>=COMBO.MIN&&!insuf};}
/* valider : la mise est débitée, les prix sont bloqués sélection par sélection */
function comboPlace(){if(!S.me.logged){needLogin(_t("Connecte-toi pour valider un combiné."));return false;}if(typeof rgBlocked==='function'&&rgBlocked('bet'))return false;const c=slipCalc();
 if(c.L.length<COMBO.MIN_LEGS){toast({tone:'amber',icon:'info',title:_t("Combiné incomplet"),text:`${_t("Il faut au moins {0} sélections.",[COMBO.MIN_LEGS])}`});return false;}
 if(c.stake<COMBO.MIN){toast({tone:'amber',icon:'info',title:_t("Mise trop petite"),text:`${_t("Mise minimale : {0}.",[F.usd0(COMBO.MIN)])}`});return false;}
 if(c.insuf){toast({tone:'amber',icon:'wallet',title:_t("Solde insuffisant"),text:_t("Dépose des fonds pour continuer."),href:'#depot'});return false;}
 const before=myRank();S.me.balance-=c.stake;const cb={id:'cb'+now().toString(36)+Math.floor(R()*1e3).toString(36),at:now(),stake:c.stake,mult:c.mult,fee:c.fee,pay:c.pay,status:'open',legs:c.L.map(l=>({m:l.m,s:l.s,price:legPrice(l.mk,l.s),mult:legMult(l.mk,l.s),res:null}))};
 combosAll().unshift(cb);S.me.played++;S.me.cbPlayed=(S.me.cbPlayed||0)+1;slip().legs=[];gainXP(10+5*cb.legs.length);if(typeof clanRecordBet==='function')clanRecordBet(null,c.stake);updateHeader();save();slipBar();closeModal();checkRank(before);
 toast({tone:'green',icon:'layers',force:true,title:`${_t("Combiné validé : {0} à ×{1}",[F.usd(cb.stake),F.d2(cb.mult)])}`,text:`${_t("{0} sélections. Gain si tout passe : {1}. Tu peux encaisser à tout moment avant la clôture.",[cb.legs.length,F.usd(cb.pay)])}`,href:'#combines'});
 if((S.ui.route||'')==='combines')render(false);return cb;}
/* valeur du moment : gain promis × probabilité implicite actuelle, moins les frais d'encaissement */
function comboValue(cb){if(cb.status!=='open')return 0;let p=1;for(const l of cb.legs){const m=MK[l.m];if(!m)return 0;if(l.res==='lost')return 0;if(l.res!=='won')p*=legPrice(m,l.s)/100;}return cb.pay*p*(1-COMBO.CASH_FEE);}
function comboCash(id){const cb=comboOf(id);if(!cb||cb.status!=='open')return false;const v=comboValue(cb);if(v<=0)return false;const before=myRank();cb.status='cashed';cb.cash=v;cb.endAt=now();S.me.balance+=v;S.me.settled++;const pnl=v-cb.stake;if(pnl>=0)S.me.wins++;S.me.realized+=pnl;
 S.me.history.unshift({k:'combo',q:`${_t("Combiné {0} sélections, encaissé à {1}",[cb.legs.length,F.usd(v)])}`,s:'oui',win:pnl>=0,pnl,at:now()});gainXP(10);updateHeader();save();checkRank(before);checkBadges();
 toast({tone:pnl>=0?'green':'amber',icon:'wallet',force:true,title:`${_t("Encaissé : {0}",[F.usd(v)])}`,text:`${_t("{0}{1} par rapport à ta mise de {2}.",[pnl>=0?'+':'−',F.usd(Math.abs(pnl)),F.usd(cb.stake)])}`});if((S.ui.route||'')==='combines')render(false);return true;}
/* règlement d'un marché : toute sélection perdante fait tomber le combiné, toutes gagnantes = payé */
function comboOnResolve(mid,outcome){for(const cb of combosAll()){if(cb.status!=='open')continue;const l=cb.legs.find(x=>x.m===mid);if(!l||l.res)continue;l.res=l.s===outcome?'won':'lost';
 if(l.res==='lost'){cb.status='lost';cb.endAt=now();S.me.settled++;S.me.realized-=cb.stake;S.me.history.unshift({k:'combo',q:`${_t("Combiné {0} sélections : perdu sur {1}",[cb.legs.length,MK[mid]?MK[mid].short:mid])}`,s:'non',win:false,pnl:-cb.stake,at:now()});}
 else if(cb.legs.every(x=>x.res==='won')){cb.status='won';cb.endAt=now();S.me.balance+=cb.pay;S.me.settled++;S.me.wins++;S.me.realized+=cb.pay-cb.stake;S.me.history.unshift({k:'combo',q:`${_t("Combiné {0} sélections gagné à ×{1}",[cb.legs.length,F.d2(cb.mult)])}`,s:'oui',win:true,pnl:cb.pay-cb.stake,at:now()});toast({tone:'green',icon:'trophy',force:true,title:`${_t("Combiné gagné : +{0}",[F.usd(cb.pay-cb.stake)])}`,text:`${_t("{0} sur {0}, ×{1}.",[cb.legs.length,F.d2(cb.mult)])}`,href:'#combines'});confetti(50);}}
 save();}

/* ---------- Barre en bas de l'écran ---------- */
function slipBar(){let b=$('#slipbar');const L=slip().legs.filter(l=>MK[l.m]);if(!L.length||!S.me.logged||/^(connexion|inscription|bienvenue)/.test(S.ui.route||'')){if(b)b.remove();document.body.classList.remove('has-slip');return;}document.body.classList.add('has-slip');
 if(!b){b=document.createElement('div');b.id='slipbar';b.className='slipbar';document.body.appendChild(b);}const c=slipCalc();
 b.innerHTML=`<button class="sb-main" data-a="cb-open">${ic('layers',16)}<span>${_t("<b>Combiné ×{0}</b>",[F.d2(c.mult)])}<small>${_t('{0} sélection{1}',[L.length,L.length>1?'s':''])}</small></span></button><button class="btn b-ink sm" data-a="cb-open">${L.length<COMBO.MIN_LEGS?_t("Compléter"):_t("Miser")}</button><button class="sb-x" data-a="cb-clear" aria-label="${_t('Vider le combiné')}">${ic('x',16)}</button>`;fixText(b);}
/* ---------- Fenêtre du combiné ---------- */
function comboLegH(l,rm){const m=l.mk||MK[l.m];if(!m)return '';const pr=l.price||legPrice(m,l.s),mu=l.mult||legMult(m,l.s);
 return `<div class="cb-leg"><div class="cb-lt"><a href="#marche-${m.id}" data-a="close">${esc(m.short)}</a><small>${esc(m.q)}</small></div><span class="cb-side ${l.s}">${cbSide(l.s)} <b class="num">${F.c(pr)}</b></span><b class="num cb-mult">×${F.d2(mu)}</b>${rm?`<button class="x" data-a="cb-rm" data-m="${m.id}" aria-label="${_t('Retirer')}">${ic('x',14)}</button>`:''}</div>`;}
function comboModalH(){const c=slipCalc(),st=slip();
 if(!c.L.length)return `<div class="md"><div class="md-h"><div><h3>${_t("Pari combiné")}</h3><p>${_t("Plusieurs sélections, une seule mise, les cotes se multiplient.")}</p></div><button class="x" data-a="close" aria-label="${_t("Fermer")}">${ic('x')}</button></div><div class="empty" style="padding:24px 0">${_t("Ton combiné est vide. Ouvre un marché, choisis Oui ou Non, puis « Ajouter au combiné ».")}</div><div class="hbtns"><a class="btn b-ink full" href="#accueil" data-a="close">${_t("Voir les marchés")}</a><a class="btn b-white full" href="#combines" data-a="close">${_t("Mes combinés")}</a></div></div>`;
 return `<div class="md"><div class="md-h"><div><h3>${_t("Pari combiné")}</h3><p>${_t("{0} · toutes doivent gagner.",[_t('{0} sélection{1}',[c.L.length,c.L.length>1?'s':''])])}</p></div><button class="x" data-a="close" aria-label="${_t("Fermer")}">${ic('x')}</button></div>
 <div class="cb-legs">${c.L.map(l=>comboLegH(l,true)).join('')}</div>
 ${c.L.length<COMBO.MAX_LEGS?`<a class="link" href="#accueil" data-a="close" style="font-size:13px">${_t("{0} Ajouter une sélection depuis un marché",[ic('plus',13)])}</a>`:''}
 <div class="cpf" style="margin-top:14px"><span class="cpl">${_t("Ta mise")}</span><div class="presets">${[5,10,25,50,100].map(v=>`<button type="button" class="btn b-ghost sm${+st.stake===v?' on':''}" data-a="cb-stake" data-v="${v}">${F.usd0(v)}</button>`).join('')}</div></div>
 <div class="field"><input class="amt" data-cb="stake" inputmode="decimal" value="${esc(String(st.stake))}" aria-label="${_t('Ta mise')}"></div>
 <div class="calc" data-cb="calc">${comboCalcH(c)}</div>
 ${c.insuf?`<a class="btn b-ink lg full" href="#depot" data-a="close">${_t("Solde insuffisant : déposer des fonds")}</a>`:`<button class="btn b-oui lg full" data-a="cb-place"${c.ok?'':' disabled'} data-cb="btn">${_t("{0} Valider le combiné pour {1}",[ic('layers',16,'#fff'),F.usd(c.stake)])}</button>`}
 <p class="note">${_t("Les prix de chaque sélection sont bloqués à la validation. Wimoro prend {0} du gain brut, gain plafonné à {1}. Encaissement anticipé possible à tout moment à la valeur du moment, moins {2}.",[F.pct(COMBO.FEE*100),F.usd0(COMBO.MAX_PAY),F.pct(COMBO.CASH_FEE*100)])}</p>
 <a class="link" href="#combines" data-a="close" style="font-size:13px;text-align:center;display:block">${_t("Mes combinés")}</a></div>`;}
function comboCalcH(c){return `<div class="line"><span>${_t("Cote combinée")}</span><b class="num">×${F.d2(c.mult)}</b></div><div class="line"><span>${_t("Probabilité implicite")}</span><b class="num">${F.pct1(c.prob)}</b></div><div class="line"><span>${_t("Frais Wimoro ({0} du gain)",[F.pct(COMBO.FEE*100)])}</span><b class="num">${F.usd(c.fee)}</b></div><div class="line gain"><span>${_t("Gain si tout passe")}</span><b class="num">${F.usd(c.pay)}</b></div>${c.capped?`<div class="tnotes"><span class="tn warn">${_t("{0} Gain plafonné à {1} par combiné.",[ic('info',12),F.usd0(COMBO.MAX_PAY)])}</span></div>`:''}${c.L.length<COMBO.MIN_LEGS?`<div class="tnotes"><span class="tn">${_t("{0} Ajoute au moins {1} sélections.",[ic('info',12),COMBO.MIN_LEGS])}</span></div>`:''}`;}
function comboModalOpen(){openModal(comboModalH(),'wide');}

 const legs=cb.legs.map(l=>{const m=MK[l.m];if(!m)return '';const cur=legPrice(m,l.s),d=cur-l.price,res=l.res||(open?'':cb.status);return `<div class="cb-leg sm"><div class="cb-lt"><a href="#marche-${m.id}">${esc(m.short)}</a><small>${cbSide(l.s)} ${_t('à {0}',[F.c(l.price)])} · ×${F.d2(l.mult)}</small></div>${open?`<span class="cb-cur ${d>=0?'up':'dn'}" data-cbcur="${m.id}">${F.c(cur)} <small>${bidi((d>=0?'+':'−')+F.int(Math.abs(d)))}</small></span>`:`<span class="cb-res ${res==='won'?'ok':res==='lost'?'ko':''}">${res==='won'?_t('Gagnée'):res==='lost'?_t('Perdue'):'—'}</span>`}</div>`;}).join('');
 return `<div class="cbcard ${cb.status}"><div class="cb-h"><div><span class="bztag ${open?'onair':''}">${open?`<i class="live"></i> `:''}${st}</span><b>${_t('{0} sélection{1}',[cb.legs.length,cb.legs.length>1?'s':''])} · ×${F.d2(cb.mult)}</b><small>${_t("{0} · mise {1}",[fmtDT(cb.at),F.usd(cb.stake)])}</small></div><div class="cb-pay"><small>${open?_t("Gain net si tout passe"):won?_t("Gain"):cb.status==='cashed'?_t("Encaissé"):_t("Mise perdue")}</small><b class="num ${open?'':won||(cb.status==='cashed'&&cb.cash>=cb.stake)?'pl-up':'pl-dn'}">${open?F.usd(cb.pay):won?F.usd(cb.pay):cb.status==='cashed'?F.usd(cb.cash):'−'+F.usd(cb.stake)}</b></div></div>
 <div class="cb-legs">${legs}</div>
 ${open?`<div class="cb-cash"><div><small>${_t("Valeur du moment")}</small><b class="num ${v>=cb.stake?'pl-up':'pl-dn'}" data-cbval="${cb.id}">${F.usd(v)}</b></div><button class="btn b-ink" data-a="cb-cash" data-id="${cb.id}"${v>0?'':' disabled'}>${_t("{0} Encaisser {1}",[ic('wallet',16,'#fff'),F.usd(v)])}</button></div>`:''}</div>`;}
function vCombos(){if(!S.me.logged){S.ui.after='#combines';location.hash='#connexion';return '';}const all=combosAll(),open=all.filter(c=>c.status==='open'),done=all.filter(c=>c.status!=='open'),tab=S.ui.cbtab||'cours',L=tab==='cours'?open:done,sc=slipCalc();
 return `<div class="wrap"><div class="pagehead"><div><h1 class="ptitle">${_t("Mes combinés")}</h1><p class="plead">${_t("Plusieurs sélections Oui/Non sur des marchés différents, une seule mise : les cotes se multiplient. Toutes doivent gagner, et tu peux encaisser avant la fin.")}</p></div><div class="hbtns"><button class="btn b-ink" data-a="cb-open">${ic('layers',16,'#fff')} ${sc.L.length?_t('Combiné en cours ({0})',[sc.L.length]):_t("Nouveau combiné")}</button></div></div>

 ${L.length?L.map(comboCardH).join(''):`<section class="pn pad"><div class="empty" style="padding:28px 0">${tab==='cours'?_t("Aucun combiné en cours. Ouvre un marché, choisis Oui ou Non, puis « Ajouter au combiné »."):_t("Aucun combiné terminé pour l’instant.")}${tab==='cours'?`<div class="emp-a"><a class="btn b-white sm" href="#accueil">${_t("Voir les marchés")}</a></div>`:''}</div></section>`}</div>
 <aside class="col"><section class="pn pad"><div class="h2" style="margin-bottom:12px">${_t("Comment ça marche")}</div><ol class="steps"><li>${_t("Sur un marché, choisis Oui ou Non et touche « Ajouter au combiné » dans le ticket. {0} à {1} sélections, une seule par marché.",[COMBO.MIN_LEGS,COMBO.MAX_LEGS])}</li><li>${_t("La cote du combiné est le produit des cotes : trois sélections à ×2 donnent ×8.")}</li><li>${_t("Une seule mise, prix bloqués à la validation. Toutes les sélections doivent gagner. Wimoro prend {0} du gain brut, plafonné à {1}.",[F.pct(COMBO.FEE*100),F.usd0(COMBO.MAX_PAY)])}</li><li>${_t("Avant la clôture, tu peux encaisser à la valeur du moment (gain promis × probabilité actuelle), moins {0}.",[F.pct(COMBO.CASH_FEE*100)])}</li></ol></section>
 <section class="pn pad"><div class="h2">${_t("Mise et limites")}</div><p class="sub" style="margin-top:6px">${_t("De {0} à {1} par combiné. Les limites de jeu responsable s’appliquent comme pour n’importe quel pari.",[F.usd0(COMBO.MIN),F.usd0(COMBO.MAX)])}</p></section></aside></div></div>`;}
VIEWS.combines=vCombos;PROTECTED.add('combines');TITLES.combines=_t("Mes combinés");
/* valeurs du moment rafraîchies avec les prix */
{const upd0=updateMarket;updateMarket=function(m,old,noGroup){upd0(m,old,noGroup);if((S.ui.route||'')!=='combines')return;for(const cb of combosAll()){if(cb.status!=='open'||!cb.legs.some(l=>l.m===m.id))continue;const e=$(`[data-cbval="${cb.id}"]`);if(e){const v=comboValue(cb);e.textContent=F.usd(v);e.className='num '+(v>=cb.stake?'pl-up':'pl-dn');const b=e.closest('.cb-cash')&&e.closest('.cb-cash').querySelector('[data-a="cb-cash"]');if(b)b.innerHTML=`${ic('wallet',16,'#fff')} ${_t('Encaisser {0}',[F.usd(v)])}`;}
 const l=cb.legs.find(x=>x.m===m.id),c=$(`[data-cbcur="${m.id}"]`);if(c&&l){const cur=legPrice(m,l.s),d=cur-l.price;c.innerHTML=`${F.c(cur)} <small>${bidi((d>=0?'+':'−')+F.int(Math.abs(d)))}</small>`;c.className='cb-cur '+(d>=0?'up':'dn');}}};}

/* ---------- Actions ---------- */
Object.assign(ACT,{
 'cb-add':a=>{if(!S.me.logged){needLogin(_t("Connecte-toi pour créer un combiné."));return;}if(slipAdd(a.dataset.m,a.dataset.s)&&a.dataset.ctx==='sheet')closeModal();},
 'cb-open':()=>comboModalOpen(),

 const pick2=[['btc150k','oui'],['clasico','non'],['eth6000','oui']].filter(([m])=>MK[m]).slice(0,3);if(pick2.length>=2){const open=mk(pick2.map(([m,s])=>({m,s,price:Math.max(3,Math.min(97,Math.round(legPrice(MK[m],s)+(s==='oui'?-4:3))))})),25,t-2*86400e3);combosAll().push(open);}
 const pk=[['neige-noel','oui'],['bce','non']].filter(([m])=>MK[m]);if(pk.length>=2){const c=mk(pk.map(([m,s])=>({m,s,price:Math.max(3,Math.min(97,Math.round(legPrice(MK[m],s)-6)))})),20,t-6*86400e3);c.status='cashed';c.cash=Math.round(c.stake*1.9*100)/100;c.endAt=t-86400e3;combosAll().push(c);S.me.history.push({k:'combo',q:`${_t("Combiné 2 sélections, encaissé à {0}",[F.usd(c.cash)])}`,s:'oui',win:true,pnl:c.cash-c.stake,at:c.endAt});}
 save();}

<script>
'use strict';
/* =====================================================================================
 *  Mode Pro, partie 1 : données, indicateurs et dessin du graphique
 *  ------------------------------------------------------------------------------------
 *  HISTORIQUE. La démo n'a pas de serveur : chaque marché reçoit un historique simulé à la minute,
 *  fabriqué une seule fois puis figé (clé « wimoro-pro-data », indépendante des comptes comme
 *  « wimoro-markets »). Il passe par les mêmes repères que le graphique classique au moment de sa
 *  création : 50 % à l'ouverture, les valeurs de départ des périodes 1 sem., 1 j, 6 h et 1 h, le prix actuel.
 *  Ensuite, chaque minute réelle de la démo est enregistrée (ouverture, haut, bas, clôture, volume).
 *  Toutes les périodes (1 min à 1 semaine) sont des regroupements de ces mêmes minutes : une bougie
 *  d'une heure est exactement la somme de ses 60 minutes.
 *
 *  INDICATEURS. Calculés sur la série affichée, jamais décoratifs : SMA, EMA, bandes de Bollinger,
 *  VWAP (à partir du volume de chaque bougie), RSI (lissage de Wilder), MACD.
 *
 *  DESSIN. Un seul peintre (proPaint) pour deux supports : le canevas du Mode Pro (interactif) et
 *  une image SVG (aperçu d'une analyse partagée dans un chat). L'aperçu est donc fidèle par construction.
 *
 *  Pour brancher un vrai serveur : remplacer proData() (minutes d'un marché) et proTick() (flux en direct).
 * ===================================================================================== */
const PRO_KEY='wimoro-pro-data',PRO_GEN=1,PRO_SIG=.13,PRO_CAP=6,PRO_SPAN=150*1440,PRO_WK=4*1440;
const PD={};let PRO_ST=null,PRO_DIRTY=false;
/* Périodes proposées. « max » regroupe par jour et montre tout l'historique. */
const PIV=[{k:'1m',ms:6e4},{k:'5m',ms:3e5},{k:'15m',ms:9e5},{k:'1h',ms:36e5},{k:'4h',ms:144e5},{k:'1d',ms:864e5},{k:'1w',ms:6048e5},{k:'max',ms:864e5}];
const PIVK={};PIV.forEach(x=>PIVK[x.k]=x);
const pivLab=k=>({'1m':_t('1 min'),'5m':_t('5 min'),'15m':_t('15 min'),'1h':_t('1 h'),'4h':_t('4 h'),'1d':_t('1 j'),'1w':_t('1 sem.'),max:_t('Max')})[k];
const pivLong=k=>({'1m':_t('1 minute'),'5m':_t('5 minutes'),'15m':_t('15 minutes'),'1h':_t('1 heure'),'4h':_t('4 heures'),'1d':_t('1 jour'),'1w':_t('1 semaine'),max:_t('Tout l’historique')})[k];

/* ---------- Stockage de l'historique ---------- */
function proStore(){if(PRO_ST)return PRO_ST;try{const o=JSON.parse(LS.g(PRO_KEY)||'null');if(o&&o.v===1&&o.m)PRO_ST=o;}catch(e){}if(!PRO_ST)PRO_ST={v:1,m:{}};return PRO_ST;}
function proStoreSave(){if(!PRO_DIRTY||!PRO_ST)return;PRO_DIRTY=false;try{LS.s(PRO_KEY,JSON.stringify(PRO_ST));}catch(e){}}

/* ---------- Fabrication de l'historique ---------- */
const proG=r=>(r()+r()+r()-1.5)*2;                                  // bruit gaussien approché (somme de 3 tirages, écart type 1)
const proF=p=>{const q=p*(100-p)*4e-4;return q<.08?.2828:Math.sqrt(q);};   // une probabilité proche de 0 % ou de 100 % bouge moins (1 à 50 %)
/* Pont aléatoire entre deux points connus (déplacement du point milieu) : même graine, mêmes extrémités, même tracé. */
function proBridge(c,i0,i1,seed){if(i1-i0<2)return;const r=rng(seed),st=new Int32Array(96);let sp=0;st[sp++]=i0;st[sp++]=i1;
 while(sp){const b=st[--sp],a=st[--sp];if(b-a<2)continue;const m=(a+b)>>1,base=c[a]+(c[b]-c[a])*(m-a)/(b-a);
  c[m]=clamp(base+proG(r)*Math.min(PRO_CAP,PRO_SIG*Math.sqrt(b-a)*.5)*proF(base),1.5,98.5);st[sp++]=m;st[sp++]=b;st[sp++]=a;st[sp++]=m;}}
/* Agitation minute par minute autour du tracé de fond (bruit qui revient vers zéro, nul aux extrémités) : en direct, les prix de la démo bougent ainsi. */
function proNoise(c,i0,i1,seed){const r=rng(seed^0x2545f491);let n=0;for(let i=i0+1;i<i1;i++){n=n*.78+proG(r)*.28;c[i]=clamp(c[i]+n*Math.min(1,(i-i0)/6,(i1-i)/6)*proF(c[i]),1,99);}}
/* Haut, bas et volume des minutes i0+1 … i1 ; le volume total distribué vaut volTot. */
const PRO_DAY=(()=>{const t=new Float32Array(1440);for(let m=0;m<1440;m++)t[m]=1+.35*Math.sin((m/60-9)/24*2*Math.PI);return t;})();   // le volume suit l'heure de la journée
function proFill(D,i0,i1,seed,volTot,flat){const r=rng(seed^0x5bd1e995),c=D.c,h=D.h,l=D.l,v=D.v,n0=Math.max(1,D.n0-1);let sum=0;
 for(let i=i0+1;i<=i1;i++){const o=c[i-1],x=c[i],f=.34*proF(x),hi=o>x?o:x,lo=o>x?x:o;h[i]=Math.min(99,hi+r()*r()*f);l[i]=Math.max(1,lo-r()*r()*f);
  const q=i<n0?i/n0:1,tr=flat?1:.3+1.7*q*Math.sqrt(q),u=r(),mv=Math.abs(x-o)/.3;
  const w=(.3+1.4*u*u*Math.sqrt(u))*(.6+3*(mv<1?mv:1))*PRO_DAY[(((D.s+i)%1440)+1440)%1440]*tr;v[i]=w;sum+=w;}
 const k=sum>0?volTot/sum:0;for(let i=i0+1;i<=i1;i++)v[i]*=k;}
function proGrow(D,need){if(need<=D.cap)return;const cap=Math.ceil(need*1.3)+2000;for(const k of ['c','h','l','v']){const a=new Float32Array(cap);a.set(D[k].subarray(0,D.n));D[k]=a;}D.cap=cap;}
/* Pose la minute i (au-delà de la dernière connue). Un trou de plus de 3 minutes (onglet masqué, démo fermée) est comblé par un pont. */
function proPut(D,i,c,h,l,v,o){const L=D.n-1;
 if(i<=L){if(i===L){D.c[i]=c;D.h[i]=h===undefined?c:h;D.l[i]=l===undefined?c:l;D.v[i]=v||0;}return;}
 proGrow(D,i+2);
 if(i-L>3){D.c[i-1]=o===undefined?c:o;proBridge(D.c,L,i-1,hash(D.id+':'+(D.s+L)));proNoise(D.c,L,i-1,hash(D.id+':n'+(D.s+L)));proFill(D,L,i-1,hash(D.id+':g'+(D.s+L)),D.vpm*(i-1-L),true);}
 else for(let j=L+1;j<i;j++){D.c[j]=D.h[j]=D.l[j]=D.c[L];D.v[j]=0;}
 const op=D.c[i-1];D.c[i]=c;D.h[i]=h===undefined?Math.max(op,c):Math.max(h,op,c);D.l[i]=l===undefined?Math.min(op,c):Math.min(l,op,c);D.v[i]=v||0;D.n=i+1;}
/* Données à la minute d'un marché (créées à la première demande, puis relues du stockage). */
function proData(m){if(PD[m.id])return PD[m.id];const st=proStore(),nowM=Math.floor(now()/6e4);let rec=st.m[m.id];
 if(!rec||rec.g!==PRO_GEN||!Array.isArray(rec.a)||rec.a.length<2||!Array.isArray(rec.P)){
  if(m.creator==='me'){const p0=r2(clamp(m.d0!==undefined?m.d0:m.p,2,98));rec={s:nowM-45,t0:nowM,a:[[nowM-45,p0],[nowM,r2(m.p)]],vol:Math.round(m.vol||0),P:[]};}
  else{const g=tf=>r2(clamp(series(m,tf)[0],2,98));rec={s:nowM-PRO_SPAN,t0:nowM,a:[[nowM-PRO_SPAN,50],[nowM-10080,g('1 sem.')],[nowM-1440,r2(clamp(m.d0,2,98))],[nowM-360,g('6 h')],[nowM-60,g('1 h')],[nowM,r2(m.p)]],vol:Math.round(m.vol||0),P:[]};}
  rec.g=PRO_GEN;rec.P.push([nowM,r2(m.p),r2(m.p),r2(m.p),0]);st.m[m.id]=rec;PRO_DIRTY=true;}
 const n0=rec.t0-rec.s+1,cap=n0+Math.max(4000,nowM-rec.t0+3000),N=()=>new Float32Array(cap);
 const D={id:m.id,s:rec.s,n:n0,n0,cap,c:N(),h:N(),l:N(),v:N(),ver:1,agg:{},rec,lastVol:m.vol||0,vpm:1,cur:null};
 const A=rec.a;D.c[0]=A[0][1];for(let k=1;k<A.length;k++){const i0=A[k-1][0]-rec.s,i1=A[k][0]-rec.s;D.c[i1]=A[k][1];proBridge(D.c,i0,i1,hash(m.id+':'+A[k-1][0]));proNoise(D.c,i0,i1,hash(m.id+':n'+A[k-1][0]));}
 D.h[0]=D.l[0]=D.c[0];proFill(D,0,n0-1,hash(m.id+':hl'),rec.vol,false);
 {let s=0,k=0;for(let i=Math.max(1,n0-1440);i<n0;i++){s+=D.v[i];k++;}D.vpm=k?s/k:1;}
 for(const p of rec.P)proPut(D,p[0]-rec.s,p[1],p[2],p[3],p[4],p[5]);
 {const lp=rec.P[rec.P.length-1];if(lp&&lp[0]===D.s+D.n-1)D.cur=lp;}
 PD[m.id]=D;proTick(m,undefined,true);return D;}
/* Une mise vient de bouger le prix (ou une minute vient de passer) : la minute en cours est mise à jour et enregistrée. */
function proTick(m,old,quiet){const D=PD[m.id];if(!D)return;const i=Math.floor(now()/6e4)-D.s,L=D.n-1,p=m.p,dv=quiet?0:Math.max(0,(m.vol||0)-D.lastVol);D.lastVol=m.vol||0;
 if(i>L){const gap=i-L>3;proPut(D,i,p,undefined,undefined,dv,gap?(old===undefined?p:old):undefined);D.cur=[D.s+i,r2(p),r2(D.h[i]),r2(D.l[i]),Math.round(D.v[i])];if(gap)D.cur[5]=r2(D.c[i-1]);D.rec.P.push(D.cur);proThin(D);}
 else if(i===L){D.c[i]=p;if(p>D.h[i])D.h[i]=p;if(p<D.l[i])D.l[i]=p;D.v[i]+=dv;const q=D.cur;if(q&&q[0]===D.s+i){q[1]=r2(p);q[2]=r2(D.h[i]);q[3]=r2(D.l[i]);q[4]=Math.round(D.v[i]);}}
 else return;
 D.ver++;PRO_DIRTY=true;if(typeof proLive==='function')proLive(m);}
/* Le stockage reste petit : au-delà de 600 minutes enregistrées, les plus anciennes ne gardent qu'un point toutes les 30 minutes
   (au rechargement, le détail entre deux points gardés est recréé par un pont, toujours le même). */
function proThin(D){const P=D.rec.P;if(P.length<=600)return;const keep=P.slice(-360),old=P.slice(0,-360).filter(p=>p[0]%30===0).slice(-400);
 const op=p=>{const i=p[0]-D.s;if(i>0&&i<D.n)p[5]=r2(D.c[i-1]);};old.forEach(op);op(keep[0]);D.rec.P=old.concat(keep);}
/* le prix d'un marché change : updateMarket prévient le Mode Pro */
const updateMarketP=updateMarket;
updateMarket=function(m,old,x){updateMarketP(m,old,x);if(PD[m.id])proTick(m,old);};

/* ---------- Regroupement par période ---------- */
/* L'époque Unix tombe un jeudi : les semaines commencent le lundi (décalage de 4 jours). */
function proAgg(D,ms){const mn=ms/6e4,off=mn===10080?PRO_WK:0,bk=i=>Math.floor((D.s+i-off)/mn),b0=bk(0),nb=bk(D.n-1)-b0+1;let A=D.agg[ms];

'use strict';
/* =====================================================================================
 *  Mode Pro, partie 2 : l'écran plein écran et ses interactions
 *  ------------------------------------------------------------------------------------
 *  proOpen(id)        ouvre le Mode Pro d'un marché (proOpen(null, instantané) : analyse partagée, en lecture seule)

 *  Analyse du joueur  S.me.pro.mk[idMarché] = { iv, type, side, n, off, inds[], dr[] } : enregistrée avec le compte (save()),
 *                     donc retrouvée après un rechargement. Les indicateurs sont limités par le rang (proSlots), les tracés non.
 * ===================================================================================== */
Object.assign(ICP,{
 back:'<path d="M19 12H5"/><path d="m11 6-6 6 6 6"/>',
 expand:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
 cursor:'<path d="M5 3l14 7-6 2-2 6Z"/>',
 trend:'<path d="M5 18 19 6"/><circle cx="5" cy="18" r="1.7"/><circle cx="19" cy="6" r="1.7"/>',
 hline:'<path d="M3 12h18"/><circle cx="12" cy="12" r="1.9"/>',
 vline:'<path d="M12 3v18"/><circle cx="12" cy="12" r="1.9"/>',
 rect:'<rect x="4" y="6" width="16" height="12" rx="1.5"/>',
 arrow:'<path d="M5 19 19 5"/><path d="M10 5h9v9"/>',
 text:'<path d="M5 7V5h14v2M12 5v14M9 19h6"/>',
 flag:'<path d="M5 21V4"/><path d="M5 4h13l-3 4 3 4H5"/>',
 eyeOff:'<path d="M3 3l18 18"/><path d="M10.6 5.2A9.6 9.6 0 0 1 12 5c5.5 0 9 7 9 7a15 15 0 0 1-2.6 3.3M6.2 6.6C3.9 8.3 3 12 3 12s3.5 7 9 7c1.3 0 2.5-.3 3.6-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',
 sliders:'<path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10"/><circle cx="15" cy="6" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="17" cy="18" r="2.2"/>',
 pencil:'<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19Z"/><path d="m14.5 6.5 3 3"/>',
 tonow:'<path d="M5 6l7 6-7 6"/><path d="M19 5v14"/>',
 image:'<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m5 17 4.5-4.5 3.5 3.5 2.5-2.5L20 18"/>'
});
const PV={open:false,id:null,snap:null,st:null,D:null,tool:'cursor',sel:null,pend:null,hover:null,panel:'',want:null,L:null,M:null,raf:0,ptrs:new Map(),g:null,tools:true,pushed:false,vn:120,end:0,follow:true,W:0,H:0,legKey:'',timer:0,from:null,arm:0};
const PTOOL=['cursor'].concat(PDRAW);
const ptoolLab=k=>k==='cursor'?_t('Sélectionner et déplacer'):pdrawLab(k);
const PTIC={cursor:'cursor',trend:'trend',hline:'hline',vline:'vline',rect:'rect',arrow:'arrow',text:'text',level:'flag'};
const pcolName=c=>({ink:_t('Couleur du thème'),'#2448FF':_t('Bleu'),'#F59A0B':_t('Orange'),'#12A150':_t('Vert'),'#D92D20':_t('Rouge'),'#7A5AF8':_t('Violet')})[c]||c;
const proHex=c=>PVAR[c]?'var('+PVAR[c]+')':proColOk(c)?c:'var(--ink)';
const proPctS=v=>plain(F.pct1(v/100));
const proNum2=v=>plain(unit(NB(nf2.format(v)),'%'));

/* ---------- Analyse enregistrée du joueur ---------- */
function proMe(){const me=S.me;if(!me.pro||typeof me.pro!=='object')me.pro={v:1,mk:{},sh:[]};if(!me.pro.mk||typeof me.pro.mk!=='object')me.pro.mk={};if(!Array.isArray(me.pro.sh))me.pro.sh=[];return me.pro;}
const proPtOk=a=>Array.isArray(a)&&a.length===2&&isFinite(a[0])&&isFinite(a[1]);
function proDrOk(d){if(!d||!PDRAW.includes(d.k)||!proPtOk(d.a))return false;if((d.k==='trend'||d.k==='arrow'||d.k==='rect')&&!proPtOk(d.b))return false;if(!proColOk(d.c))d.c='#2448FF';d.w=clamp(Math.round(+d.w)||2,1,3);d.h=d.h?1:0;if(!d.id)d.id='d'+Math.random().toString(36).slice(2,8);if(d.txt!==undefined)d.txt=String(d.txt).slice(0,60);return true;}
function proSt(id){const P=proMe();let st=P.mk[id];if(!st||typeof st!=='object')st=P.mk[id]={};
 if(!PIVK[st.iv])st.iv='1h';if(st.type!=='courbe'&&st.type!=='bougies')st.type='bougies';if(st.side!=='non')st.side='oui';if(!(st.n>0))st.n=0;if(typeof st.off!=='number'||!isFinite(st.off))st.off=3;
 st.inds=(Array.isArray(st.inds)?st.inds:[]).slice(0,500).map(pindFix).filter(Boolean);st.dr=(Array.isArray(st.dr)?st.dr:[]).filter(proDrOk).slice(-300);st.ha=st.ha?1:0;return st;}
/* Les règles du rang sont appliquées aux données elles-mêmes : hors rang Radiant, un seul exemplaire de chaque indicateur (le premier est gardé),
   puis, au-delà du nombre permis par le rang, les derniers ajoutés sont retirés. */
function proEnforce(st,tell){const max=proSlots(),n0=st.inds.length;let L=proUnl()?st.inds:proUniq(st.inds);const dup=n0-L.length;if(L.length>max)L=L.slice(0,max);if(L.length===n0)return false;st.inds=L;save();
 if(tell)toast({tone:'amber',icon:'lock',title:_t('{0, plural, one{# indicateur} other{# indicateurs}} à la fois avec ton rang',[max]),text:dup?_t('Chaque indicateur une seule fois avec ton rang : les doublons et les indicateurs en trop ont été retirés. Tes tracés sont tous conservés.'):_t('Les indicateurs en trop ont été retirés. Tes tracés sont tous conservés.')});return true;}
/* Ajout d'un indicateur : refusé au-delà de la limite du rang, et refusé s'il est déjà affiché (plusieurs fois le même : rang Radiant).
   C'est cette fonction qui décide, pas l'affichage. */
const proHasInd=(k,exceptId)=>!!PV.st&&PV.st.inds.some(x=>x.k===k&&x.id!==exceptId);
function proAddInd(k,replaceId){const st=PV.st;if(!st||!PIND[k])return false;if(!proUnl()&&proHasInd(k,replaceId))return false;
 if(replaceId){const i=st.inds.findIndex(x=>x.id===replaceId);if(i<0)return false;st.inds.splice(i,1,pindNew(k,st.inds.filter(x=>x.id!==replaceId)));}
 else{if(st.inds.length>=proSlots())return false;st.inds.push(pindNew(k,st.inds));}
 save();return true;}

/* ---------- Données affichées ---------- */
function proA(){if(PV.snap)return proSnapA(PV.snap);return proAgg(PV.D,PV.st.iv==='max'?proMaxMs(PV.D):PIVK[PV.st.iv].ms);}
const proHasVol=A=>{for(let i=Math.max(0,A.n-400);i<A.n;i++)if(A.v[i]>0)return true;return false;};
function proClamp(A){const tot=A.n,pw=Math.max(120,PV.W-56),maxN=Math.max(12,Math.min(tot+8,Math.floor(pw/1.2))),minN=Math.min(8,Math.max(2,tot));PV.vn=clamp(PV.vn,minN,maxN);
 PV.end=PV.snap?clamp(PV.end,Math.min(tot,PV.vn*.5),tot+3):clamp(PV.end,Math.min(tot,PV.vn*.4),tot+PV.vn*.5);}
function proViewInit(fit){const A=proA(),tot=A.n,def=innerWidth>760?140:70;
 if(PV.snap){PV.vn=PV.snap.vn;PV.end=PV.snap.end;PV.follow=false;return;}
 const st=PV.st;if(fit||st.iv==='max'&&!st.n){PV.vn=tot+6;PV.end=tot+3;PV.follow=true;st.off=3;st.n=Math.round(PV.vn);return;}
 PV.vn=st.n>0?st.n:Math.min(def,tot+6);PV.end=tot+st.off;PV.follow=st.off>=0;}
function proViewSave(){if(PV.snap||!PV.st)return;const A=proA();PV.st.n=Math.round(PV.vn*100)/100;PV.st.off=Math.round((PV.end-A.n)*100)/100;PV.follow=PV.st.off>=0;save();}
function proModel(){const A=proA(),cmp=PV.W<560;
 if(PV.snap)return proSnapModel(PV.snap,PV.W,PV.H,{vn:PV.vn,end:PV.end,hover:PV.hover,compact:cmp});
 const st=PV.st,pos=S.me.logged?S.me.positions.filter(p=>p.m===PV.id).map(p=>{const yes=p.s==='oui'?p.avg:100-p.avg;return {p:st.side==='non'?100-yes:yes,s:p.s,label:_t('Ta position {0} à {1}',[p.s==='oui'?_t('Oui'):_t('Non'),plain(F.c(p.avg))])};}):[];
 return {W:PV.W,H:PV.H,A,side:st.side,type:st.type,vn:PV.vn,end:PV.end,inds:st.inds.map(d=>({id:d.id,k:d.k,p:d.p,c:d.c,w:d.w,h:d.h,vals:proCalc(d,A,st.side,[Math.floor(PV.end-PV.vn)-2,Math.ceil(PV.end)+1])})),draws:st.dr,hideAll:!!st.ha,sel:PV.sel,pend:PV.pend,hover:PV.hover,pos,compact:cmp,live:true};}
function proInval(){if(!PV.open||PV.raf)return;PV.raf=requestAnimationFrame(()=>{PV.raf=0;proDraw();});}
function proDraw(){if(!PV.open||!PV.cv)return;const cv=PV.cv,box=cv.parentElement,W=box.clientWidth,H=box.clientHeight;if(W<60||H<60)return;const dpr=Math.min(2,window.devicePixelRatio||1);
 if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
 PV.W=W;PV.H=H;if(proLegCap()!==PV.legCap)proLegBuild();const A=proA();if(!PV.snap&&PV.follow)PV.end=A.n+PV.st.off;proClamp(A);
 if(!PV.snap){const hp=proHasPos(PV.id);if(PV.hp!==undefined&&hp!==PV.hp)$$('#pro .pro-buy').forEach(e=>{e.innerHTML=proBuyH(PV.id,MK[PV.id]);e.classList.toggle('has3',hp);fixText(e);});PV.hp=hp;}
 const ctx=PV.ctx;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 const M=proModel();PV.M=M;PV.L=proPaint(proCvG(ctx),M);proLegend(M);}
/* le prix du marché ouvert vient de bouger */
function proLive(m){if(PV.open&&!PV.snap&&PV.id===m.id)proInval();}

/* ---------- Légende (valeurs sous le réticule, ou dernière bougie) ---------- */
const proLegCap=()=>PV.W<560||PV.H<340?3:5;
function proLegBuild(){const el=$('#pro .pro-leg');if(!el)return;const ro=!!PV.snap,all=ro?PV.snap.inds:PV.st.inds,cap=PV.legCap=proLegCap(),many=all.length>cap,open=many&&!!PV.legAll,L=many&&!open?all.slice(0,cap-1):all;el.classList.toggle('all',open);
 const more=many?`<button class="pl-more" data-a="pro-leg-more" aria-expanded="${open}">${open?_t('Réduire la liste'):_t('{0, plural, one{+ # autre} other{+ # autres}}',[all.length-L.length])}</button>`:'';
 el.innerHTML=`<div class="pl-o" data-plo></div>`+(open?more:'')+L.map(d=>`<div class="pl-i${d.h?' off':''}"><i style="background:${proHex(d.c)}"></i><span class="pl-n">${esc(pindLab(d))}</span><b class="num" data-plv="${d.id}"></b>${ro?'':`<button data-a="pro-ind-eye" data-id="${d.id}" aria-pressed="${!!d.h}" aria-label="${esc(_t('Masquer ou afficher {0}',[pindLab(d)]))}">${ic(d.h?'eyeOff':'eye',14)}</button><button data-a="pro-panel" data-v="ind" data-keep="1" aria-label="${esc(_t('Régler {0}',[pindLab(d)]))}">${ic('sliders',14)}</button><button data-a="pro-ind-del" data-id="${d.id}" aria-label="${esc(_t('Retirer {0}',[pindLab(d)]))}">${ic('x',14)}</button>`}</div>`).join('')+(open?'':more);PV.legKey='';
 const c=$('[data-procnt]');if(c&&!ro)c.textContent=bidi(proCntTxt(PV.st.inds.length));const n=$('[data-prodn]');if(n&&!ro){n.textContent=PV.st.dr.length||'';n.hidden=!PV.st.dr.length;}}
function proLegend(M){const A=M.A,Sr=proSerie(A,M.side),i=M.hover&&M.hover.i!==undefined?clamp(M.hover.i,0,A.n-1):A.n-1,key=i+'|'+A.ver+'|'+M.side+'|'+M.type+'|'+A.ms+'|'+M.inds.map(d=>d.id+d.h+JSON.stringify(d.p)).join(',');if(key===PV.legKey)return;PV.legKey=key;
 const o=$('#pro [data-plo]');if(!o)return;const dr=RTL?' dir="rtl"':'';const when=i===A.n-1&&M.live!==false?_t('En direct'):proWhen(A.T0+i*A.ms,A.ms),side=M.side==='non'?_t('Non'):_t('Oui'),nz=v=>v===v&&v!==null;
 if(M.type==='bougies'){const ch=Sr.c[i]-Sr.o[i];o.innerHTML=`<span class="pl-w">${esc(when)}</span><span class="pl-s ${M.side}">${side}</span><span${dr}>${_t('Ouv.')} <b dir="ltr">${proPctS(Sr.o[i])}</b></span><span${dr}>${_tc('Haut','bougie')} <b dir="ltr">${proPctS(Sr.h[i])}</b></span><span${dr}>${_tc('Bas','bougie')} <b dir="ltr">${proPctS(Sr.l[i])}</b></span><span${dr}>${_tc('Clôt.','bougie')} <b dir="ltr" class="${ch>=0?'pl-up':'pl-dn'}">${proPctS(Sr.c[i])}</b></span><span class="pl-v"${dr}>${_t('Vol.')} <b dir="ltr">${plain(F.compact(A.v[i]||0))}</b></span>`;}
 else o.innerHTML=`<span class="pl-w">${esc(when)}</span><span class="pl-s ${M.side}">${side}</span><b dir="ltr">${proPctS(Sr.c[i])}</b><span class="pl-v"${dr}>${_t('Vol.')} <b dir="ltr">${plain(F.compact(A.v[i]||0))}</b></span>`;
 for(const d of M.inds){const el=$(`#pro [data-plv="${d.id}"]`);if(!el)continue;const V=d.vals,a=V.a[i];let s='–';
  if(d.h)s=_t('masqué');else if(d.k==='bb')s=nz(a)?proNum2(clamp(V.c[i],0,100))+' · '+proNum2(a)+' · '+proNum2(clamp(V.b[i],0,100)):'–';else if(d.k==='rsi')s=nz(a)?plain(F.d1(a)):'–';else if(d.k==='macd')s=nz(a)?proSgn(a)+(nz(V.b[i])?' · '+proSgn(V.b[i])+' · '+proSgn(V.c[i]):''):'–';else s=nz(a)?proNum2(a):'–';el.textContent=s;}}

/* ---------- Construction de l'écran ---------- */
function proTopH(){const snap=PV.snap,id=PV.id,m=MK[id];
 if(snap){const by=snap.by||{n:'',t:0,d:0};return `<button class="pro-back" data-a="pro-close" aria-label="${esc(_t('Fermer l’analyse'))}">${ic('back',18)}<span>${_t('Fermer')}</span></button>
  <div class="pro-ttl"><b class="pro-q">${esc(m?m.short:snap.short)}</b><span class="pro-px">${_t('Analyse de {0}',[esc(by.n)])} ${rk(by.t,by.d)}<span class="pro-at">${_t('Partagée le {0}',[proShareDate(snap.at)])}</span></span></div>
  <div class="pro-ro">${m?`<button class="btn b-ink sm" data-a="pro-fork">${ic('pencil',15)}<span class="pro-l">${_t('Créer mon analyse à partir de celle-ci')}</span><span class="pro-s">${_t('Créer la mienne')}</span></button><a class="btn b-white sm" href="#marche-${m.id}" data-a="pro-goto"><span class="pro-l">${_t('Ouvrir le marché')}</span><span class="pro-s">${_t('Marché')}</span></a>`:''}</div>`;}
 const sib=m.parent&&GK[m.parent]?GK[m.parent].outcomes:null;
 return `<button class="pro-back" data-a="pro-close" aria-label="${esc(_t('Revenir au graphique classique'))}">${ic('back',18)}<span>${_t('Graphique classique')}</span></button>
  <div class="pro-ttl">${sib?`<select class="pro-out" data-pro-out aria-label="${esc(_t('Issue affichée'))}">${sib.map(o=>`<option value="${o.id}"${o.id===id?' selected':''}>${esc(o.label)}</option>`).join('')}</select>`:`<b class="pro-q">${esc(m.short)}</b>`}<span class="pro-px"><span class="num pro-pct" data-mp="${id}">${F.pct(m.p)}</span><span class="pro-oy">${_t('Oui')} <b data-mc="${id}">${F.c(m.p)}</b> · ${_t('Non')} <b data-mcn="${id}">${F.c(100-m.p)}</b></span><span class="delta ${m.p>=m.d0?'up':'dn'}" data-md="${id}">${F.pts(m.p-m.d0)}</span><span class="pro-24">${_t('sur 24 heures')}</span></span></div>
  <div class="pro-buy top${proHasPos(id)?' has3':''}">${proBuyH(id,m)}</div>
  <button class="btn b-ink sm pro-shareb" data-a="pro-share">${ic('share',15,'currentColor')}<span class="pro-l">${_t('Partager mon analyse')}</span><span class="pro-s">${_t('Partager')}</span></button>`;}
const proHasPos=id=>!!(S.me.logged&&S.me.positions.some(p=>p.m===id));
/* acheter et vendre restent à un appui : le ticket d'achat habituel s'ouvre par-dessus, « Vendre » ramène au ticket de la page en mode vente */
const proBuyH=(id,m)=>`<button class="btn b-oui sm" data-a="bet" data-m="${id}" data-s="oui">${_t('Oui')} <span data-mc="${id}">${F.c(m.p)}</span></button><button class="btn b-non sm" data-a="bet" data-m="${id}" data-s="non">${_t('Non')} <span data-mcn="${id}">${F.c(100-m.p)}</span></button>${proHasPos(id)?`<button class="btn b-white sm pro-sellb" data-a="pro-sell">${_t('Vendre')}</button>`:''}`;
function proBarH(){const snap=PV.snap;
 if(snap){const nI=snap.inds.length,nD=snap.dr.length;return `<div class="pro-scroll"><span class="pro-tag">${esc(pivLong(snap.iv))}</span><span class="pro-tag">${snap.type==='bougies'?_t('Bougies'):_t('Courbe')}</span><span class="pro-tag">${snap.side==='non'?_t('Prix du Non'):_t('Prix du Oui')}</span>${snap.p!==null?`<span class="pro-tag">${_t('Oui à {0} au moment du partage',[plain(F.pct(snap.p))])}</span>`:''}<span class="pro-tag">${_t('{0, plural, =0{Aucun indicateur} one{# indicateur} other{# indicateurs}}',[nI])}</span><span class="pro-tag">${_t('{0, plural, =0{Aucun tracé} one{# tracé} other{# tracés}}',[nD])}</span></div>`;}
 const st=PV.st,D=PV.D;
 return `<div class="pro-scroll"><div class="seg pro-iv" role="group" aria-label="${esc(_t('Période'))}">${PIV.map(x=>{const ok=proIvOk(D,x.k);return `<button class="${st.iv===x.k?'on':''}" data-a="pro-iv" data-v="${x.k}" aria-pressed="${st.iv===x.k}"${ok?'':` disabled title="${esc(_t('Pas encore assez d’historique'))}"`} aria-label="${esc(pivLong(x.k))}">${pivLab(x.k)}</button>`;}).join('')}</div>
  <div class="pro-row2"><div class="seg pro-type" role="group" aria-label="${esc(_t('Type de graphique'))}">${[['courbe',_t('Courbe')],['bougies',_t('Bougies')]].map(([k,l])=>`<button class="${st.type===k?'on':''}" data-a="pro-type" data-v="${k}" aria-pressed="${st.type===k}" aria-label="${esc(l)}">${CTI[k]}<span class="pro-l">${l}</span></button>`).join('')}</div>
  <div class="seg pro-side" role="group" aria-label="${esc(_t('Prix affiché'))}">${[['oui',_t('Oui')],['non',_t('Non')]].map(([k,l])=>`<button class="${st.side===k?'on':''}" data-a="pro-side" data-v="${k}" aria-pressed="${st.side===k}">${l}</button>`).join('')}</div>
  <button class="btn b-white sm pro-indb" data-a="pro-panel" data-v="ind" aria-expanded="${PV.panel==='ind'}">${ic('chart',15)} ${_t('Indicateurs')} <span class="pro-cnt num" data-procnt>${bidi(proCntTxt(st.inds.length))}</span></button>
  <button class="btn b-white sm pro-toolb" data-a="pro-tools-toggle" aria-pressed="${PV.tools}" aria-label="${esc(_t('Outils de dessin'))}">${ic('pencil',15)}<span class="pro-l"> ${_t('Outils')}</span></button></div></div>`;}
function proToolsH(){const st=PV.st;return PTOOL.map(k=>`<button class="pt${PV.tool===k?' on':''}" data-a="pro-tool" data-v="${k}" aria-pressed="${PV.tool===k}" aria-label="${esc(ptoolLab(k))}" title="${esc(ptoolLab(k))}">${ic(PTIC[k],19)}</button>`).join('')+`<span class="pt-sep" aria-hidden="true"></span>
 <button class="pt${PV.panel==='obj'?' on':''}" data-a="pro-panel" data-v="obj" aria-label="${esc(_t('Mes tracés'))}" title="${esc(_t('Mes tracés'))}">${ic('layers',19)}<i class="pt-n num" data-prodn${st.dr.length?'':' hidden'}>${st.dr.length||''}</i></button>
 <button class="pt${st.ha?' on':''}" data-a="pro-hide-all" aria-pressed="${!!st.ha}" aria-label="${esc(_t('Masquer tous les tracés'))}" title="${esc(_t('Masquer tous les tracés'))}">${ic(st.ha?'eyeOff':'eye',19)}</button>
 <button class="pt" data-a="pro-clear" aria-label="${esc(_t('Supprimer tous les tracés'))}" title="${esc(_t('Supprimer tous les tracés'))}">${ic('trash',19)}</button>`;}
function proOpen(id,snap){const m=MK[snap?snap.m:id];if(!snap&&!m)return;if(PV.open)proClose(true);
 PV.from=document.activeElement&&document.activeElement!==document.body?document.activeElement:null;

 const dx=pt.x-g.x0,dy=pt.y-g.y0;if(!g.moved&&Math.hypot(dx,dy)>5)g.moved=true;
 if(g.k==='pan'){if(!g.moved)return;PV.end=g.end0-dx/L.cw;proClamp(A);PV.follow=PV.end>=A.n;if(!PV.snap)PV.st.off=PV.end-A.n;if(e.pointerType==='mouse')PV.hover={i:Math.floor(L.ix(pt.x)),y:pt.y};else PV.hover=null;proInval();}
 else if(g.k==='new2'){if(g.moved){g.d.b=proAt(pt);proInval();}}
 else if(g.k==='drag'){if(!g.moved)return;const d=g.d,dt=dx/L.cw*A.ms,dp=(L.py(pt.y)-L.py(g.y0))*(PV.st.side==='non'?-1:1),snap=t=>A.T0+(Math.round((t-A.T0)/A.ms-.5)+.5)*A.ms,P=v=>Math.round(clamp(v,0,100)*100)/100;
  if(g.part==='a'||g.part==='body')d.a=[d.k==='hline'?g.a0[0]:snap(g.a0[0]+dt),d.k==='vline'?g.a0[1]:P(g.a0[1]+dp)];
  if(g.b0&&(g.part==='b'||g.part==='body'))d.b=[snap(g.b0[0]+dt),P(g.b0[1]+dp)];proInval();}}
function proUp(e){const pt=PV.ptrs.get(e.pointerId)||proXY(e);PV.ptrs.delete(e.pointerId);try{PV.cv.releasePointerCapture(e.pointerId);}catch(x){}const g=PV.g;if(!g)return;
 if(g.k==='pinch'){if(PV.ptrs.size<2){PV.g=null;proViewSave();}return;}
 PV.g=null;
 if(g.k==='pan'){if(g.moved)proViewSave();else{if(PV.sel)proSelect(null);if(g.touch){const same=PV.hover&&PV.L&&Math.abs(PV.L.x(PV.hover.i+.5)-pt.x)<14;if(same){PV.hover=null;proInval();}else proHover(pt,true);}}return;}
 if(g.k==='new1'){if(e.type==='pointercancel')return;const d=proNewDrawing(PV.tool,g.q);if(d.k==='level'||d.k==='hline'||d.k==='vline'||d.k==='text')proCommit(d);return;}
 if(g.k==='new2'){if(e.type==='pointercancel'){PV.pend=null;proInval();return;}if(g.moved){g.d.b=proAt(pt);proCommit(g.d);}else{proFloat();proInval();}return;}
 if(g.k==='drag'){if(g.moved){save();if(PV.panel==='obj')proPanel();}}}
function proTxtCommit(f){const d=PV.edit;if(!d)return;const i=f?f.querySelector('[data-protxt]'):$('#pro [data-protxt]');const v=i?i.value.trim().slice(0,60):'';PV.edit=null;
 if(d.k==='text'&&!v){const st=PV.st,k=st.dr.indexOf(d);if(k>=0)st.dr.splice(k,1);if(PV.sel===d)PV.sel=null;}else d.txt=v;save();proLegBuild();proFloat();if(PV.panel==='obj')proPanel();proInval();}
function proBind(el){const cv=PV.cv;
 cv.addEventListener('pointerdown',proDown);cv.addEventListener('pointermove',proMove);cv.addEventListener('pointerup',proUp);cv.addEventListener('pointercancel',proUp);
 cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!PV.ptrs.size&&PV.hover){PV.hover=null;proInval();}});
 cv.addEventListener('wheel',e=>{e.preventDefault();const pt=proXY(e),L=PV.L;if(!L)return;if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){const A=proA();PV.end+=e.deltaX/L.cw;proClamp(A);PV.follow=PV.end>=A.n;if(!PV.snap)PV.st.off=PV.end-A.n;proInval();}else proZoomAt(Math.exp(clamp(e.deltaY,-120,120)*.0022),pt.x);clearTimeout(PV.wt);PV.wt=setTimeout(proViewSave,300);},{passive:false});
 cv.addEventListener('dblclick',()=>{if(PV.tool==='cursor'&&!PV.sel)ACT['pro-zoom']({dataset:{v:'reset'}});});
 cv.addEventListener('contextmenu',e=>e.preventDefault());
 el.addEventListener('change',e=>{const t=e.target;if(t.dataset.proOut!==undefined){const id=t.value;if(MK[id]){proViewSave();const tools=PV.tools;proClose(true);PV.tools=tools;proOpen(id);}return;}if(t.dataset.pin)proPin(t,true);});
 el.addEventListener('input',e=>{const t=e.target;if(t.dataset.pin)proPin(t,false);});
 if(typeof ResizeObserver!=='undefined'){PV.ro=new ResizeObserver(()=>proInval());PV.ro.observe(cv.parentElement);}}
/* un réglage d'indicateur change : le calcul est refait tout de suite */
function proPin(t,final){const d=PV.st.inds.find(x=>x.id===t.dataset.pin);if(!d)return;const v=F.parse(t.value);if(!t.value.trim()||!isFinite(v)||v<=0){if(final)t.value=d.p[t.dataset.k];return;}
 const before=JSON.stringify(d.p);d.p[t.dataset.k]=v;pindFix(d);if(final)$$(`#pro [data-pin="${d.id}"]`).forEach(i=>{i.value=d.p[i.dataset.k];});if(JSON.stringify(d.p)!==before){save();proLegBuild();const h=$$('#pro .pp-ind').find(x=>x.querySelector(`[data-pin="${d.id}"]`));if(h){const b=h.querySelector('.pp-ih b');if(b)b.textContent=pindLab(d);}proInval();}}

/* ---------- Actions ---------- */
const proInd=id=>PV.st?PV.st.inds.find(d=>d.id===id):null,proDr=id=>PV.st?PV.st.dr.find(d=>d.id===id):null;
Object.assign(ACT,{
 'pro-open':a=>proOpen(a.dataset.m),
 'pro-close':()=>proClose(),'pro-goto':()=>proClose(true),
 'pro-sell':()=>{const id=PV.id,go=()=>{if(S.me.positions.some(p=>p.m===id))ACT.tmode({dataset:{v:'sell'}});};if((S.ui.route||'')!=='marche-'+id){proClose(true);location.hash='#marche-'+id;setTimeout(go,160);}else{proClose();go();}},
 'pro-iv':a=>{const st=PV.st,k=a.dataset.v;if(!st||!PIVK[k]||!proIvOk(PV.D,k))return;const A0=proA(),tEnd=A0.T0+PV.end*A0.ms,fol=PV.follow,off=st.off;st.iv=k;const A=proA();
  if(k==='max')proViewInit(true);else{if(fol)PV.end=A.n+Math.min(off,6);else PV.end=(tEnd-A.T0)/A.ms;PV.vn=Math.min(PV.vn,A.n+8);proClamp(A);PV.follow=PV.end>=A.n;st.off=PV.end-A.n;}
  PV.hover=null;proViewSave();proBars();proRefresh();},
 'pro-type':a=>{if(!PV.st)return;PV.st.type=a.dataset.v==='courbe'?'courbe':'bougies';save();proBars();proInval();},
 'pro-side':a=>{if(!PV.st)return;PV.st.side=a.dataset.v==='non'?'non':'oui';save();proBars();proRefresh();},
 'pro-panel':a=>{const v=a.dataset.v||'';PV.panel=a.dataset.keep?v:(PV.panel===v?'':v);PV.want=null;PV.arm=0;proPanel();},
 'pro-ind-add':a=>{const k=a.dataset.v;if(!PV.st||!PIND[k])return;if(proAddInd(k)){PV.want=null;proRefresh();}else{PV.want=k;proPanel();}},
 'pro-ind-swap':a=>{if(!PV.want)return;if(proAddInd(PV.want,a.dataset.id)){PV.want=null;proRefresh();}},
 'pro-ind-del':a=>{const st=PV.st;if(!st)return;const i=st.inds.findIndex(d=>d.id===a.dataset.id);if(i<0)return;st.inds.splice(i,1);PV.want=null;save();proRefresh();},
 'pro-ind-eye':a=>{const d=proInd(a.dataset.id);if(!d)return;d.h=d.h?0:1;save();proRefresh();},
 'pro-ind-col':a=>{const d=proInd(a.dataset.id);if(!d||!PCOL.includes(a.dataset.v))return;d.c=a.dataset.v;save();proRefresh();},
 'pro-ind-w':a=>{const d=proInd(a.dataset.id);if(!d)return;d.w=clamp(+a.dataset.v||2,1,3);save();proRefresh();},
 'pro-leg-more':()=>{PV.legAll=!PV.legAll;proLegBuild();PV.legKey='';proInval();},
 'pro-ind-anc':a=>{const d=proInd(a.dataset.id);if(!d)return;d.p.anc=a.dataset.v;pindFix(d);save();proRefresh();},
 /* « Découvrir les avantages des rangs » : la fenêtre existante du rang visé (conditions, et tout ce qu'il débloque) */
 'pro-perks':a=>{const t=a&&a.dataset&&a.dataset.t!==undefined?+a.dataset.t:proNextSlotTier();tierModal(t!==null&&TIERS[t]?t:myRank().t);},
 'pro-tool':a=>{if(PV.snap)return;if(PV.edit)proTxtCommit();PV.tool=PTOOL.includes(a.dataset.v)?a.dataset.v:'cursor';PV.pend=null;if(PV.tool!=='cursor')PV.sel=null;$$('#pro .pro-tools [data-a="pro-tool"]').forEach(b=>{const on=b.dataset.v===PV.tool;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));});proFloat();proInval();},
 'pro-tools-toggle':()=>{PV.tools=!PV.tools;const el=$('#pro');if(el)el.classList.toggle('notools',!PV.tools);$$('#pro [data-a="pro-tools-toggle"]').forEach(b=>b.setAttribute('aria-pressed',String(PV.tools)));if(!PV.tools&&PV.tool!=='cursor')ACT['pro-tool']({dataset:{v:'cursor'}});proInval();},
 'pro-hide-all':()=>{const st=PV.st;if(!st)return;st.ha=st.ha?0:1;if(st.ha)PV.sel=null;save();proBars();if(PV.panel==='obj')proPanel();proInval();},
 'pro-clear':()=>{const st=PV.st;if(!st||!st.dr.length){toast({icon:'info',title:_t('Aucun tracé à supprimer')});return;}
  if(!(PV.arm&&now()<PV.arm)){PV.arm=now()+4000;if(PV.panel==='obj')proPanel();else toast({tone:'amber',icon:'info',title:_t('Supprimer tous les tracés ?'),text:_t('Appuie une seconde fois sur la corbeille pour confirmer.'),dur:3800});return;}
  PV.arm=0;st.dr=[];PV.sel=null;PV.pend=null;save();proBars();proLegBuild();if(PV.panel==='obj')proPanel();proInval();toast({icon:'check',title:_t('Tracés supprimés')});},
 'pro-obj-sel':a=>{const d=proDr(a.dataset.id);if(!d)return;if(d.h){d.h=0;save();}if(PV.st.ha){PV.st.ha=0;proBars();}proSelect(d);},
 'pro-obj-eye':a=>{const d=proDr(a.dataset.id);if(!d)return;d.h=d.h?0:1;if(d.h&&PV.sel===d)PV.sel=null;save();proFloat();proPanel();},
 'pro-obj-del':a=>{const st=PV.st,i=st?st.dr.findIndex(d=>d.id===a.dataset.id):-1;if(i<0)return;if(PV.sel===st.dr[i])PV.sel=null;st.dr.splice(i,1);save();proFloat();proLegBuild();proPanel();},
 'pro-dr-col':a=>{const d=PV.sel;if(!d||!PCOL.includes(a.dataset.v))return;d.c=a.dataset.v;save();proFloat();if(PV.panel==='obj')proPanel();proInval();},
 'pro-dr-w':a=>{const d=PV.sel;if(!d)return;d.w=clamp(+a.dataset.v||2,1,3);save();proFloat();proInval();},
 'pro-dr-txt':()=>{if(!PV.sel)return;PV.edit=PV.sel;proFloat();},
 'pro-dr-eye':()=>{const d=PV.sel;if(!d)return;d.h=1;PV.sel=null;save();proFloat();if(PV.panel==='obj')proPanel();proInval();toast({icon:'eye',title:_t('Tracé masqué'),text:_t('Retrouve-le dans « Mes tracés ».')});},
 'pro-dr-del':()=>{const d=PV.sel,st=PV.st;if(!d||!st)return;const i=st.dr.indexOf(d);if(i>=0)st.dr.splice(i,1);PV.sel=null;PV.edit=null;save();proFloat();proLegBuild();if(PV.panel==='obj')proPanel();proInval();},
 'pro-dr-none':()=>proSelect(null),'pro-tip-x':()=>{PV.tip=0;proFloat();},
 'pro-zoom':a=>{const v=a.dataset.v;if(v==='in')proZoomAt(.7);else if(v==='out')proZoomAt(1/.7);else{if(PV.snap){PV.vn=PV.snap.vn;PV.end=PV.snap.end;}else{const A=proA();PV.st.off=3;PV.follow=true;if(PV.st.iv==='max')PV.vn=A.n+6;PV.end=A.n+3;}PV.hover=null;proInval();}clearTimeout(PV.wt);PV.wt=setTimeout(proViewSave,200);}
});
FORMS['pro-txt']=f=>proTxtCommit(f);

/* ---------- Clavier, retour arrière, thème ---------- */
document.addEventListener('keydown',e=>{if(!PV.open||$('#ov')||$('#sov')||$('.rankup'))return;const t=e.target,typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT');
 if(e.key==='Escape'){e.stopPropagation();if(PV.edit){proTxtCommit();return;}if(PV.pend||PV.tool!=='cursor'){ACT['pro-tool']({dataset:{v:'cursor'}});return;}if(PV.sel){proSelect(null);return;}if(PV.panel){PV.panel='';PV.want=null;proPanel();return;}proClose();return;}
 if(e.key==='Tab'){const L=$$(FOCUSABLE,$('#pro')).filter(x=>x.getClientRects().length);if(!L.length)return;const a=document.activeElement,first=L[0],last=L[L.length-1];if(!$('#pro').contains(a)){e.preventDefault();first.focus();}else if(e.shiftKey&&a===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&a===last){e.preventDefault();first.focus();}return;}
 if(typing)return;
 if((e.key==='Delete'||e.key==='Backspace')&&PV.sel){e.preventDefault();ACT['pro-dr-del']();return;}
 if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const A=proA();PV.end+=(e.key==='ArrowLeft'?-1:1)*Math.max(1,PV.vn*.1);proClamp(A);PV.follow=PV.end>=A.n;if(!PV.snap)PV.st.off=PV.end-A.n;proInval();clearTimeout(PV.wt);PV.wt=setTimeout(proViewSave,300);return;}
 if(e.key==='+'||e.key==='='){proZoomAt(.8);return;}if(e.key==='-'){proZoomAt(1.25);return;}},true);
window.addEventListener('popstate',()=>{if(PV.open&&!(history.state&&history.state.pro===PV.pid))proClose(true);});
window.addEventListener('hashchange',()=>{if(PV.open)proClose(true);});
window.addEventListener('resize',()=>proInval());
new MutationObserver(()=>{PCSS=null;proInval();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
addEventListener('pagehide',proStoreSave);document.addEventListener('visibilitychange',()=>{if(document.hidden)proStoreSave();else proInval();});
setInterval(()=>{if(!document.hidden)proStoreSave();},20000);

<script>
'use strict';
/* =====================================================================================
 *  Mode Pro, partie 3 : partager une analyse (dans les chats, ou en image hors de Wimoro), carte d'analyse dans les chats,
 *  analyses des autres joueurs, et bouton de grade du compte démo
 *  ------------------------------------------------------------------------------------
 *  Une analyse partagée est un INSTANTANÉ (proSnap) : bougies visibles, indicateurs calculés, tracés, commentaire.
 *  Il est publié comme un message de chat ordinaire (k:'ana') dans les salons existants : général, marché, clan, message privé.
 *  La démo n'a pas de serveur : les analyses du joueur sont gardées avec son compte (S.me.pro.sh) et remises dans les salons
 *  au chargement. Rien n'est envoyé à un autre appareil. Pour brancher un serveur : remplacer proPublish() et proRooms().
 * ===================================================================================== */
const proShareDate=(at,short)=>_t('{0} à {1}',[new Date(at).toLocaleDateString(LOC,{day:'numeric',month:short?'short':'long'}),hhmm(at)]);
const proCountsTxt=s=>_t('{0, plural, =0{Aucun indicateur} one{# indicateur} other{# indicateurs}}',[s.inds.length])+' · '+_t('{0, plural, =0{Aucun tracé} one{# tracé} other{# tracés}}',[s.dr.length]);

/* ---------- Carte d'analyse dans un chat ---------- */
function proCardSvg(s,W,H){const k='_svg'+W+'x'+H;if(s[k])return s[k];const v=proSnapSvg(s,W,H);Object.defineProperty(s,k,{value:v,enumerable:false,configurable:true});return v;}
function anaCardH(x){const s=x.ana;if(!s)return '';const m=MK[s.m],by=userOf(x.u).n;
 return `<div class="anac"><div class="an-h"><span class="an-k">${ic('chart',13)} ${_t('Analyse')}</span>${m?`<a class="an-m" href="#marche-${m.id}">${esc(m.short)}</a>`:`<span class="an-m">${esc(s.short)}</span>`}<span class="an-iv">${esc(pivLong(s.iv))}</span></div>
  <button class="an-pv" data-a="pro-view" data-id="${x.id}" aria-label="${esc(_t('Voir l’analyse de {0}',[by]))}" dir="ltr">${proCardSvg(s,360,190)}</button>
  <div class="an-f"><span class="an-meta"><span>${proCountsTxt(s)}</span><span class="an-at">${_t('Partagée le {0}',[proShareDate(s.at,true)])}</span></span><button class="btn b-ink sm" data-a="pro-view" data-id="${x.id}">${_t('Voir l’analyse')}</button></div></div>`;}

/* ---------- Publication ---------- */
const PRO_REPLY=[()=>_t('belle analyse, je surveille ce niveau.'),()=>_t('je vois la même chose sur ce graphique.'),()=>_t('pas d’accord, pour moi la tendance reste intacte.'),()=>_t('merci pour le partage, je garde ça sous le coude.'),()=>_t('propre. Tu entres maintenant ou tu attends ?')];
const PRO_DM=[()=>_t('Bien vu, ton analyse. Je regarde ça de près.'),()=>_t('Intéressant. Tu entres maintenant ou tu attends ?'),()=>_t('Merci, je la compare avec la mienne.')];
function proClanRoom(mc){const rid='clan:'+mc.id,cr=room(rid);cr.name=mc.name;cr.kind='clan';if(!cr.msgs.length&&typeof clanSeedRoom==='function')clanSeedRoom(mc);return rid;}
/* Publie l'instantané dans les salons choisis, comme n'importe quel message. */
/* Les analyses publiées sont gardées avec le compte, dans le stockage du navigateur (quelques Mo au total). Une analyse à très nombreux indicateurs
   pèse lourd : les plus anciennes cèdent la place, et une analyse qui dépasserait le budget à elle seule reste dans les chats jusqu'au rechargement. */
const PRO_SH_MAX=15e5;
function proPublish(snap,rooms){const P=proMe(),ep=S.epoch,size=x=>JSON.stringify(x).length;P.sh=P.sh.filter(x=>x&&x.id!==snap.id);P.sh.unshift({id:snap.id,at:snap.at,rooms:rooms.slice(),snap});P.sh=P.sh.slice(0,12);
 {let tot=P.sh.reduce((a,x)=>a+size(x),0);while(P.sh.length>1&&tot>PRO_SH_MAX)tot-=size(P.sh.pop());if(tot>PRO_SH_MAX){P.sh.shift();toast({tone:'amber',icon:'info',title:_t('Analyse très lourde'),text:_t('Elle est publiée, mais trop volumineuse pour être gardée après un rechargement de la page.'),dur:6000});}}
 rooms.forEach((rid,n)=>{const dm=rid.startsWith('dm:');if(rid.startsWith('clan:')){const mc=typeof myClan==='function'?myClan():null;if(mc&&'clan:'+mc.id===rid)proClanRoom(mc);}if(dm){const r=room(rid);if(!r.msgs.length)r.msgs.push(mkMsg({k:'evt',text:_t('Début de ta conversation avec {0}',[USERS[rid.slice(3)].n])}));}
  const x=mkMsg({u:'me',k:'ana',text:snap.txt||'',ana:snap,shid:snap.id,inj:1});addMsg(rid,x);
  setTimeout(()=>{if(ep!==S.epoch)return;const e=pick(['🎯','🔥','👀']);x.r[e]=(x.r[e]||0)+1+Math.floor(R()*3);refreshReacts(x);},1400+n*500+R()*1500);
  setTimeout(()=>{if(ep!==S.epoch)return;let u;if(dm)u=rid.slice(3);else if(rid.startsWith('clan:')){const mc=typeof myClan==='function'?myClan():null,mates=mc&&typeof clanMates==='function'?clanMates(mc):[];u=mates.length?pick(mates):pickUser();}else u=pickUser();
   addMsg(rid,mkMsg({u,k:'msg',text:dm?pick(PRO_DM)():'@'+S.me.n+' '+pick(PRO_REPLY)()}));},2600+n*900+R()*2600);});
 S.me.msgsTotal++;if(S.me.chatDay!==today()){S.me.chatDay=today();S.me.chatXP=0;}if(S.me.chatXP<20){const g=Math.min(2,20-S.me.chatXP);S.me.chatXP+=g;gainXP(g);}
 mission('chat');if(rooms.some(r=>r.startsWith('m:')))mission('chatm');checkBadges();save();}
/* Au chargement et à chaque changement de compte : les analyses du compte reviennent dans leurs salons (à leur date). */
function proRooms(){for(const id in S.rooms){const r=S.rooms[id];if(r.msgs.some(x=>x.inj))r.msgs=r.msgs.filter(x=>!x.inj);}
 if(!S.me.logged)return;const P=proMe(),mc=typeof myClan==='function'?myClan():null;
 for(const sh of P.sh.slice().reverse()){if(!sh||!sh.snap||!sh.snap.id||!Array.isArray(sh.rooms)||!Array.isArray(sh.snap.c))continue;
  for(const rid of sh.rooms){if(rid.startsWith('clan:')){if(!mc||'clan:'+mc.id!==rid)continue;proClanRoom(mc);}else if(rid.startsWith('dm:')){if(!USERS[rid.slice(3)])continue;}else if(rid.startsWith('m:')){if(!MK[rid.slice(2)]&&!(typeof GK!=='undefined'&&GK[rid.slice(2)]))continue;}else if(rid!=='general')continue;
   const r=room(rid);r.msgs.push(mkMsg({u:'me',k:'ana',text:sh.snap.txt||'',ana:sh.snap,shid:sh.snap.id,at:sh.at,inj:1}));r.msgs.sort((a,b)=>a.at-b.at);}}}

/* ---------- Fenêtre « Partager mon analyse » ---------- */
function proShareH(){const sh=PV.share,s=sh.snap,m=MK[s.m],mc=typeof myClan==='function'?myClan():null,fr=friendsOf(),dmOk=can('dm'),D=sh.dst;
 const opt=(k,icn,title,sub)=>`<button class="psh-o${D[k]?' on':''}" data-a="pro-sh-dst" data-v="${k}" role="checkbox" aria-checked="${!!D[k]}"><span class="psh-i">${icn}</span><span class="psh-t"><b>${title}</b><small>${sub}</small></span><i class="psh-ck" aria-hidden="true">${ic('check',13,'#fff',3)}</i></button>`;
 return `<div class="md pro-sh"><div class="md-h"><div><h3>${_t('Partager mon analyse')}</h3><p>${esc(m.short)} · ${esc(pivLong(s.iv))} · ${proCountsTxt(s)}</p></div><button class="x" data-a="close" aria-label="${esc(_t('Fermer'))}">${ic('x')}</button></div>

/* Message d'analyse d'un autre joueur : l'instantané n'est fabriqué qu'au moment où la carte est affichée. */
function proBotMsg(u,mid,k,ago){const cfg=PRO_BOT[k%PRO_BOT.length],at=now()-(ago||0),x=mkMsg({u,k:'ana',text:cfg.txt()+(mid?' #'+mid:''),at,r:ago?{'🎯':3+Math.floor(R()*9),'🔥':1+Math.floor(R()*6)}:{}});let s;
 Object.defineProperty(x,'ana',{enumerable:true,configurable:true,get(){if(s===undefined){try{s=proBotSnap(u,mid,Object.assign({},cfg,{txt:x.text,ago:now()-at}));}catch(e){s=null;}}return s;}});return x;}
function proSeedBots(){const t=5.5*6e4,g=room('general');if(!g.msgs.some(x=>x.k==='ana'&&x.u!=='me')){g.msgs.push(proBotMsg('satoshi','btc150k',0,t));g.msgs.sort((a,b)=>a.at-b.at);}
 const r=room('m:btc150k');if(!r.msgs.some(x=>x.k==='ana'&&x.u!=='me')){r.msgs.push(proBotMsg('lea','btc150k',1,8*6e4));r.msgs.sort((a,b)=>a.at-b.at);}
 const c=room('m:clasico');if(MK.clasico&&!c.msgs.some(x=>x.k==='ana'&&x.u!=='me')){c.msgs.push(proBotMsg('karim','clasico',3,7*6e4));c.msgs.sort((a,b)=>a.at-b.at);}}
/* le salon d'un clan reçoit aussi une analyse d'un membre */
if(typeof clanSeedRoom==='function'){const clanSeedRoomP=clanSeedRoom;clanSeedRoom=function(c){clanSeedRoomP(c);const rid='clan:'+c.id,mates=typeof clanMates==='function'?clanMates(c):[],u=mates.length?mates[0]:'maxou';if(USERS[u]&&!room(rid).msgs.some(x=>x.k==='ana')){const x=proBotMsg(u,'btc150k',2,6*6e4);room(rid).msgs.push(x);room(rid).msgs.sort((a,b)=>a.at-b.at);}};}
/* de temps en temps, un joueur partage une analyse d'un marché déjà ouvert en Mode Pro */
function proBotShare(){const ids=Object.keys(PD).filter(id=>MK[id]&&!MK[id].creator);if(!ids.length)return;const mid=pick(ids),rid=R()<.5?'general':'m:'+mid,r=room(rid);if(r.msgs.slice(-40).filter(x=>x.k==='ana').length>=2)return;addMsg(rid,proBotMsg(pickUser(),mid,Math.floor(R()*PRO_BOT.length),0));}
function proBoot(){PRO_UP=true;proRooms();proSeedBots();setInterval(()=>{if(!document.hidden&&R()<.4)proBotShare();},150000);}
/* changement de compte : les analyses publiées suivent le compte */
{const enterAccountP=enterAccount;enterAccount=function(rec,fresh,quiet){if(PV.open)proClose(true);enterAccountP(rec,fresh,quiet);if(PRO_UP)proRooms();};const logoutP=logout;logout=function(){if(PV.open)proClose(true);logoutP();proRooms();};}
let PRO_UP=false;

/* =====================================================================================
 *  Compte démo : passer au grade voulu en un clic
 *  Les valeurs d'origine du compte sont gardées (S.me.rank0) : « Revenir à mon grade d'origine » les rétablit.
 *  Le grade n'est pas forcé : l'XP et les conditions du grade choisi sont réellement remplies, donc toutes les pages restent cohérentes.
 * ===================================================================================== */
const DEMO_RK=['xp','settled','wins','deposits','flashWins','followed','pos'];
const isDemoAcc=()=>!!(S.auth&&S.auth.demo&&S.me.logged);
function demoRankAfter(){const me=S.me;me.blockedShown='';checkBadges(true);save();updateHeader();const r=myRank();closeModal();
 if(PV.open&&!PV.snap){proEnforce(PV.st,true);proBars();proRefresh();}render(false);
 toast({tone:'blue',icon:'trophy',title:_t('Tu es maintenant {0}',[rankName(r.t,r.d)]),text:_t('Mode démo : les conditions de ce rang sont remplies sur ton compte.')});}
function demoRankSet(t){if(!isDemoAcc()||!TIERS[t])return;const me=S.me;if(!me.rank0){me.rank0={badges:(me.badges||[]).slice()};DEMO_RK.forEach(k=>me.rank0[k]=me[k]);}
 const b=me.rank0;DEMO_RK.forEach(k=>me[k]=b[k]);me.badges=b.badges.slice();
 if(rankFrom(stats()).t===t){delete me.rank0;demoRankAfter();return;}
 const need={settled:0,acc:0,deposits:0,flashWins:0,followed:0};for(let i=1;i<=t;i++){const c=TIERS[i].cond;for(const k in need)if(c[k])need[k]=Math.max(need[k],c[k]);}
 me.xp=t===8?Math.max(DIV_XP[8][0],b.xp):DIV_XP[t][0];me.settled=Math.max(b.settled,need.settled);me.wins=Math.min(me.settled,Math.max(b.wins,Math.ceil((need.acc+.5)/100*me.settled)));
 me.deposits=Math.max(b.deposits,need.deposits);me.flashWins=Math.max(b.flashWins,need.flashWins);me.followed=Math.max(b.followed,need.followed);if(t===8)me.pos=Math.min(b.pos,87);
 demoRankAfter();}
function demoRankReset(){if(!isDemoAcc()||!S.me.rank0)return;const me=S.me,b=me.rank0;DEMO_RK.forEach(k=>me[k]=b[k]);me.badges=b.badges.slice();delete me.rank0;demoRankAfter();}
function demoRankListH(){const r=myRank();return `<div class="drk-l" role="group" aria-label="${esc(_t('Choisir un rang'))}">${TIERS.map((T,i)=>`<button class="drk${i===r.t?' on':''}" data-a="demo-rank" data-t="${i}" aria-pressed="${i===r.t}">${emb(i,i===r.t?r.d:0)}<b>${T.name}</b><small>${PRO_SLOTS[i]===Infinity?_t('Illimités'):_t('{0, plural, one{# indicateur} other{# indicateurs}}',[PRO_SLOTS[i]])}</small></button>`).join('')}</div>${S.me.rank0?`<button class="link drk-r" data-a="demo-rank-reset">${_t('Revenir à mon rang d’origine')}</button>`:''}`;}
const DEMO_RK_SUB=()=>_t('Un clic sur un rang et ton compte démo y passe tout de suite, avec ses conditions remplies. Sous chaque rang : le nombre d’indicateurs du Mode Pro.');
/* bloc de la page « Ton rang » (compte démo seulement) */
function demoRankH(){if(!isDemoAcc())return '';return `<section class="pn pad demo-rk"><div class="h2">${demoB()} ${_t('Changer de rang')}</div><div class="sub">${DEMO_RK_SUB()}</div>${demoRankListH()}</section>`;}
function demoRankModal(){if(!isDemoAcc())return;openModal(`<div class="md demo-rk"><div class="md-h"><div><h3>${_t('Changer de rang')}</h3><p>${DEMO_RK_SUB()}</p></div><button class="x" data-a="close" aria-label="${esc(_t('Fermer'))}">${ic('x')}</button></div>${demoRankListH()}</div>`,'wide');}
/* entrée du menu du compte et de « Mon compte » (compte démo seulement) */
const demoRankItemH=()=>isDemoAcc()?`<button class="ui" data-a="demo-rank-open">${ic('trophy',16)} ${_t('Changer de rang')}${demoB()}</button>`:'';
Object.assign(ACT,{'demo-rank':a=>demoRankSet(+a.dataset.t),'demo-rank-reset':()=>demoRankReset(),'demo-rank-open':()=>{const u=$('#umenu');if(u)u.remove();demoRankModal();}});

</script>
