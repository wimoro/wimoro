<script>
'use strict';
/* =====================================================================================
 *  Langues : anglais (par défaut), français, hébreu (écriture de droite à gauche)
 *  ------------------------------------------------------------------------------------
 *  Le code source est écrit en français : chaque texte passe par t('texte français', [args]).
 *  Les catalogues I18N.en et I18N.he traduisent ces clés ; une clé absente s'affiche en français.
 *  Les textes peuvent contenir des blocs au format ICU :
 *     {0}                                   l'argument n° 0
 *     {0, plural, one{# pari} other{# paris}} pluriel selon la langue (# = la valeur)
 *     {0, select, oui{Oui} non{Non} other{…}}  variante selon la valeur
 *  Changer de langue enregistre le choix et recharge la page (toutes les données sont recréées).
 * ===================================================================================== */
const LANGS={en:{n:'English',dir:'ltr',loc:'en-US',short:'EN'},fr:{n:'Français',dir:'ltr',loc:'fr-FR',short:'FR'},he:{n:'עברית',dir:'rtl',loc:'he-IL',short:'HE'}};
const LANG=(()=>{try{const l=localStorage.getItem('wimoro-lang');if(l&&LANGS[l])return l;}catch(e){}return 'en';})();
const LOC=LANGS[LANG].loc,RTL=LANGS[LANG].dir==='rtl';
document.documentElement.lang=LANG;document.documentElement.dir=LANGS[LANG].dir;
const I18N={en:{},he:{}};
/* Les fichiers lang_*.js ajoutent leurs entrées ici ; les clés sont normalisées (espaces insécables → espaces). */
function I18N_ADD(lang,obj){const cat=I18N[lang];for(const k in obj)cat[k.replace(/[\u00a0\u202f]/g,' ')]=obj[k];}
function setLang(l){if(!LANGS[l]||l===LANG)return;try{localStorage.setItem('wimoro-lang',l);}catch(e){}location.reload();}

/* ---------- Pluriels ---------- */
function plCat(n){n=Math.abs(n);if(LANG==='fr')return n<=1?'one':'other';if(LANG==='he')return n===1?'one':n===2?'two':'other';return n===1?'one':'other';}
/* Lit un nombre tel qu'il est affiché ou saisi dans la langue courante (« 1 000,50 », « 1,000.50 »). */
function numOf(v){if(typeof v==='number')return v;let s=String(v).replace(/[\u2066-\u2069\s\u00a0\u202f]/g,'');
 /* Tolérance : « 12.5 » en français ou « 12,5 » en anglais sont lus comme des décimales (un seul séparateur, pas un groupe de trois chiffres). */
 if(LANG==='fr'){if(s.indexOf(',')<0&&(s.match(/\./g)||[]).length===1&&!/\.\d{3}$/.test(s))s=s.replace('.',',');s=s.replace(/\./g,'').replace(',','.');}
 else{if(s.indexOf('.')<0&&(s.match(/,/g)||[]).length===1&&!/,\d{3}$/.test(s))s=s.replace(',','.');s=s.replace(/,/g,'');}
 const m=s.match(/-?\d+(?:\.\d+)?/);return m?parseFloat(m[0]):NaN;}

/* ---------- Traduction ---------- */
const I18N_MISSING=new Set();
/* Les catalogues sont indexés avec des espaces simples ; le code source contient parfois des espaces insécables. */
const nkey=k=>(k.indexOf('\u00a0')<0&&k.indexOf('\u202f')<0)?k:k.replace(/[\u00a0\u202f]/g,' ');
function _t(key,args){
 const cat=I18N[LANG];let s=cat?cat[nkey(key)]:undefined;
 if(s===undefined){s=key;if(cat&&LANG!=='fr')I18N_MISSING.add(nkey(key));}
 if(s.indexOf('{')<0)return s;
 return icu(s,args||[]);
}
/* Même mot français, deux sens : _tc('Retirer','ami') cherche d'abord la clé « Retirer [ami] » du catalogue. */
function _tc(key,ctx,args){const cat=I18N[LANG],s=cat?cat[nkey(key)+' ['+ctx+']']:undefined;if(s===undefined)return _t(key,args);return s.indexOf('{')<0?s:icu(s,args||[]);}
/* Ordinaux : 1er/2e en français, 1st/2nd en anglais, nombre seul en hébreu. */
function ordinal(n){const v=Math.abs(Math.round(n));if(LANG==='en'){const m10=v%10,m100=v%100;return v+(m10===1&&m100!==11?'st':m10===2&&m100!==12?'nd':m10===3&&m100!==13?'rd':'th');}if(LANG==='fr')return v+(v===1?'er':'e');return String(v);}
/* Interprète les blocs {…} d'une chaîne traduite. */
function icu(s,args){
 let out='',i=0;
 while(i<s.length){
  const c=s[i];
  if(c!=='{'){out+=c;i++;continue;}
  let depth=0,j=i;
  for(;j<s.length;j++){if(s[j]==='{')depth++;else if(s[j]==='}'){depth--;if(depth===0)break;}}
  if(j>=s.length){out+=s.slice(i);break;}
  const body=s.slice(i+1,j);i=j+1;
  const m=body.match(/^\s*(\d+)\s*(?:,\s*(plural|select|ordinal)\s*,?([\s\S]*))?$/);
  if(!m){out+='{'+body+'}';continue;}
  const a=args[+m[1]];
  if(!m[2]){out+=a===undefined||a===null?'':String(a);continue;}
  if(m[2]==='ordinal'){const n=numOf(a);out+=isNaN(n)?String(a):ordinal(n);continue;}
  const opts=icuOpts(m[3]);let pickd;
  if(m[2]==='plural'){const n=numOf(a);pickd=opts['='+n]!==undefined?opts['='+n]:opts[plCat(isNaN(n)?0:n)]!==undefined?opts[plCat(isNaN(n)?0:n)]:opts.other;}
  else{const k=a===undefined||a===null?'':String(a);pickd=opts[k]!==undefined?opts[k]:opts.other;}
  if(pickd===undefined)pickd='';
  out+=icu(pickd.replace(/#/g,()=>a===undefined||a===null?'':String(a)),args);
 }
 return out;
}
function icuOpts(src){const o={};let i=0;while(i<src.length){while(i<src.length&&/\s/.test(src[i]))i++;let k='';while(i<src.length&&src[i]!=='{'&&!/\s/.test(src[i])){k+=src[i];i++;}while(i<src.length&&/\s/.test(src[i]))i++;if(src[i]!=='{')break;let d=0,j=i;for(;j<src.length;j++){if(src[j]==='{')d++;else if(src[j]==='}'){d--;if(d===0)break;}}o[k]=src.slice(i+1,j);i=j+1;}return o;}

/* ---------- Textes statiques de la page (en-tête, barre d'onglets) ---------- */
function i18nStatic(root){
 if(LANG==='fr'||!root)return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const todo=[];
 while((n=w.nextNode()))todo.push(n);
 for(const tn of todo){const v=tn.nodeValue,k=v.trim();if(!k)continue;const tr=I18N[LANG][k];if(tr!==undefined)tn.nodeValue=v.replace(k,tr);}
 for(const el of root.querySelectorAll('[placeholder],[aria-label],[title],[alt]'))for(const at of ['placeholder','aria-label','title','alt']){const v=el.getAttribute(at);if(v&&I18N[LANG][v]!==undefined)el.setAttribute(at,I18N[LANG][v]);}
}
/* Les nombres restent lisibles de gauche à droite dans un texte hébreu. */
const bidi=s=>RTL?'⁦'+s+'⁩':s;
const plain=s=>String(s).replace(/[⁦-⁩]/g,'');

</script>

<script>
'use strict';
/* Wimoro : démo front-end (version hybride). Aucune donnée réelle, tout est simulé dans le navigateur. */

/* ===================== Utilitaires ===================== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const now=()=>Date.now();
const R=Math.random;
const pick=a=>a[Math.floor(R()*a.length)];
const NB=s=>String(s).replace(/[  ]/g,' ');
const nf0=new Intl.NumberFormat(LOC,{maximumFractionDigits:0}),nf1=new Intl.NumberFormat(LOC,{minimumFractionDigits:1,maximumFractionDigits:1}),nf2=new Intl.NumberFormat(LOC,{minimumFractionDigits:2,maximumFractionDigits:2});
/* Formats : « 1 000,00 $ » en français ; « $1,000.00 » en anglais et en hébreu (isolé pour rester lisible de droite à gauche). */
const SYMB=LANG!=='fr';
const money=s=>bidi(SYMB?'$'+s:s+' $');
const unit=(s,u)=>bidi(SYMB?s+u:s+' '+u);
const F={
 int:v=>bidi(NB(nf0.format(Math.round(v)))),
 d1:v=>bidi(NB(nf1.format(v))),
 d2:v=>bidi(NB(nf2.format(v))),
 usd:v=>money(NB(nf2.format(v))),
 usd0:v=>v===Infinity?_t('Illimitée'):money(NB(nf0.format(Math.round(v)))),
 /* C10 : le solde n'est jamais arrondi vers le haut. Centimes tant que la place le permet ; dans l'en-tête mobile, à partir de 100 000 $, tronqué à l'unité. */
 bal:(v,full)=>{const c=Math.floor(v*100+1e-6)/100;return full||innerWidth>760||Math.abs(c)<1e5?money(NB(nf2.format(c))):money(NB(nf0.format(Math.floor(c))));},
 signed:v=>bidi((v>=-0.004?'+':'−')+plain(money(NB(nf2.format(Math.abs(v)))))),
 pct:p=>unit(Math.round(p),'%'),
 mult:p=>{const x=100/Math.max(1,p);return bidi('×'+NB((x>=10?nf1:nf2).format(x)));},
 c:p=>unit(Math.round(p),'¢'),
 c1:p=>unit(NB(nf1.format(p)),'¢'),
 pct1:r=>unit(NB(nf1.format(r*100)),'%'),
 /* C17 : un impact inférieur au centième de point est dit tel quel, plutôt que « +0,00 pt » */
 imp:d=>d===0?bidi('0 '+_t('pt')):Math.abs(d)<0.005?_t('{0} (négligeable)',[bidi('< '+NB(nf2.format(0.01))+' '+_t('pt'))]):bidi((d>=-0.004?'+':'−')+NB(nf2.format(Math.abs(d)))+' '+_t('pt')),
 compact:v=>bidi(SYMB?(v>=1e6?'$'+NB(nf1.format(v/1e6))+'M':v>=1e3?'$'+NB(nf0.format(v/1e3))+'K':'$'+NB(nf0.format(v))):(v>=1e6?NB(nf1.format(v/1e6))+' M$':v>=1e3?NB(nf0.format(v/1e3))+' k$':NB(nf0.format(v))+' $')),
 pts:d=>{const r=Math.round(d),a=Math.abs(r);return bidi((r>=0?'+':'−')+_t('{0, plural, one{# pt} other{# pts}}',[a]));},
 xp:v=>bidi(NB(nf0.format(Math.round(v)))+' XP'),
 parse:s=>{const n=numOf(s);return isNaN(n)?0:n;},
 inp:n=>LANG==='fr'?String(n).replace('.',','):String(n),
 /* pourcentage signé (« −10 % », « +20% »), rang (« 1 284e », « 1,284th ») et « libellé : valeur » selon la langue */
 spct:p=>bidi((p<0?'−':'+')+plain(unit(Math.abs(Math.round(p)),'%'))),
 ord:v=>{const n=Math.abs(Math.round(v));return bidi(NB(nf0.format(n))+ordinal(n).slice(String(n).length));},
 kv:(a,b)=>_t('{0} : {1}',[a,b])
};
/* Adresse publique du site : tous les liens partagés (invitation, parrainage, duel, profil, marché) partent d'ici. */
const SITE_URL='https://wimoro.com';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
function ago(ts){const s=(now()-ts)/1000;if(s<60)return _t('à l’instant');if(s<3600)return _t('il y a {0} min',[Math.floor(s/60)]);if(s<86400)return _t('il y a {0} h',[Math.floor(s/3600)]);return s<172800?_t('hier'):_t('il y a {0} j',[Math.floor(s/86400)]);}
const today=()=>new Date().toISOString().slice(0,10);

/* Un seul formateur par langue ; l'heure est toujours sur 24 h (« 23:59 »). */
const DAYMS=864e5,isoDate=s=>{const [y,mo,d]=s.split('-').map(Number);return new Date(y,mo-1,d);};
const fmtDay=d=>d.toLocaleDateString(LOC,{day:'numeric',month:'long',year:'numeric'});
const fmtWhen=(iso,time)=>time?_t('{0} à {1}',[fmtDay(isoDate(iso)),time]):fmtDay(isoDate(iso));
const isoIn=n=>{const d=new Date(now()+n*DAYMS);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
/* Clôture d'un marché : la date longue et le délai affiché (« Dans 14 j ») sont calculés à partir de la même date. */
function closeOf(iso,time,lab){const d=isoDate(iso),days=Math.max(0,Math.ceil((d-now())/DAYMS));
 const close=lab==='d'?d.toLocaleDateString(LOC,{day:'numeric',month:'short'}):lab==='dy'?d.toLocaleDateString(LOC,{day:'numeric',month:'short',year:'numeric'}):lab==='long'?fmtDay(d):days<1?_t('Aujourd’hui'):days<60?_t('Dans {0} j',[days]):_t('Dans {0} mois',[Math.round(days/30)]);
 return {close,closeLong:fmtWhen(iso,time),days};}

<script>
'use strict';
/* =====================================================================================
 *  Moteur de marché Wimoro
 *  ------------------------------------------------------------------------------------
 *  MARCHÉS CLASSIQUES : carnet d'ordres, comme Polymarket.
 *   - Une part gagnante rapporte 1 $. Une part Oui + une part Non = 1 $ verrouillé :
 *     chaque part achetée est financée par la mise de l'autre camp. Wimoro ne joue jamais
 *     contre les joueurs, donc aucune réserve à immobiliser et aucun pari ne peut la mettre en perte.
 *   - La profondeur du carnet dépend du volume du marché (BOOK_PCT du volume, par cent de prix).
 *   - Un ordre « mange » le carnet niveau par niveau : le prix moyen se dégrade avec la taille.
 *       coût(parts) = A0·parts + parts² / (2·D)     (A0 = meilleur prix, D = parts par 1 $ de prix)
 *   - Frais = taux · parts · p · (1 − p), comme Polymarket, avec des taux plus bas (PM_K).
 *     Payés à l'entrée seulement : revendre avant la clôture et encaisser les gains sont gratuits.
 *
 *  PARIS ÉCLAIR : vraie cagnotte (pari mutuel). Toutes les mises (nettes de frais) vont dans une
 *  cagnotte ; les gagnants se la partagent au prorata. Impossible de payer plus que ce qui est entré.
 * ===================================================================================== */
const ENG={
  BOOK_PCT:.006,     // profondeur : 0,6 % du volume en parts par cent de prix
  BOOK_MIN:400,      // profondeur minimale (marché neuf)
  LIQ_RATE:.01,      // part de l'écart rattrapée à chaque pas de croissance de la profondeur
  PM_K:.70,          // taux Wimoro = 70 % du taux Polymarket (30 % moins cher)
  RANK_DISC:.90,     // rang Diamant et au-dessus : −10 % sur les frais
  PMAX:.99,PMIN:.01, // bornes de prix du carnet
  CAP_BE:50,         // plafond absolu du break even éclair (sécurité : jamais plus que la cagnotte)
  BE_EDGE:.05,       // marge maison sur le break even : payé 95 % de sa cote équitable (le vert de la roulette rend 35 pour 36, soit 2,7 %)
  BE_MIN:5,BE_MAX:40 // bornes du multiplicateur break even
};
/* ---------- Break even : cote cohérente avec sa probabilité ---------- */
/* fonction d'erreur (Abramowitz-Stegun 7.1.26, précision 1,5e-7) */
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+.3275911*x);const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return s*y;}
/* probabilité qu'une marche aléatoire (pas uniformes de largeur k, `ticks` pas) finisse dans ±band : P(|N(0,σ)| ≤ band), σ = k·√(ticks/12) */
function beProb(band,k,ticks){const sig=k*Math.sqrt(ticks/12);return Math.max(.002,Math.min(.5,erf(band/(sig*Math.SQRT2))));}
/* multiplicateur payé = (1 − marge) / probabilité, borné */
function beMultFair(p){return Math.max(ENG.BE_MIN,Math.min(ENG.BE_MAX,(1-ENG.BE_EDGE)/p));}
/* argent de la cagnotte encore disponible pour promettre des gains break even : mises Oui + Non, moins ce qui est déjà promis */
function beRoom(g){return Math.max(0,g.pool.o+g.pool.n-(g.pool.eProm||0));}
/* Barème public de Polymarket (docs.polymarket.com/trading/fees, nov. 2026) : frais = parts × taux × p × (1 − p) */
const PM_RATE={'Crypto':.07,'Football':.05,'Sport':.05,'Sport live':.05,'Tech et IA':.04,'Économie':.05,'Culture':.05,'Météo':.05,'Bourse':.04,'Matières':.04,'Devises':.04};
const pmRate=cat=>PM_RATE[cat]!==undefined?PM_RATE[cat]:.05;
const wmRate=(cat,disc)=>pmRate(cat)*ENG.PM_K*(disc?ENG.RANK_DISC:1);
const engClamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- Carnet ---------- */
/* La profondeur suit le volume avec un temps de retard (les teneurs de marché ajoutent de la liquidité au fil du temps) :
   elle ne bouge pas pendant un ordre, donc acheter puis revendre ne peut jamais rapporter de l'argent. Elle ne baisse jamais. */
const bookDepth=m=>{if(m.liq===undefined)m.liq=Math.max(ENG.BOOK_MIN,(m.vol||0)*ENG.BOOK_PCT);return Math.max(ENG.BOOK_MIN,m.liq);}; // parts par cent de prix
function growLiq(m){const tgt=Math.max(ENG.BOOK_MIN,(m.vol||0)*ENG.BOOK_PCT),cur=bookDepth(m);if(tgt>cur)m.liq=cur+(tgt-cur)*ENG.LIQ_RATE;return m.liq;}
const bookHalf=m=>engClamp(15/Math.sqrt(bookDepth(m)),.1,1.5)/100;                        // demi-écart acheteur/vendeur, en $
const sideMid=(m,side)=>(side==='oui'?m.p:100-m.p)/100;                                   // prix milieu du côté, en $

/* Achat : on dépense `cost` (hors frais) en mangeant les offres de A0 vers le haut. */
function bookBuy(m,side,cost){
  const D=bookDepth(m)*100,mid=sideMid(m,side),A0=Math.min(ENG.PMAX,mid+bookHalf(m));
  const cap=Math.max(0,D*(ENG.PMAX-A0)),maxCost=A0*cap+cap*cap/(2*D);                      // parts / coût max jusqu'à 99 ¢
  const c=Math.max(0,Math.min(cost,maxCost));
  const sh=c>0?2*c/(A0+Math.sqrt(A0*A0+2*c/D)):0;                                         // forme stable de D(√(A0²+2c/D) − A0)
  return {sh,cost:c,first:A0,avg:sh>0?c/sh:A0,mid0:mid,mid1:mid+sh/D,cap,maxCost,full:cost<=maxCost+1e-9};
}
/* Vente : on vend `sh` parts en mangeant les demandes de B0 vers le bas. */
function bookSell(m,side,sh){
  const D=bookDepth(m)*100,mid=sideMid(m,side),B0=Math.max(ENG.PMIN,mid-bookHalf(m));
  const cap=Math.max(0,D*(B0-ENG.PMIN)),s=Math.max(0,Math.min(sh,cap));
  const pro=s*B0-s*s/(2*D);
  return {sh:s,pro,first:B0,avg:s>0?pro/s:B0,mid0:mid,mid1:mid-s/D,cap,full:sh<=cap+1e-9};
}

/* Devis d'achat : `total` = ce que le joueur débite, frais compris. Frais = coût · taux · (1 − prix moyen). */
function quoteBuy(m,side,total,disc){
  const th=wmRate(m.cat,disc);let a=total/(1+th/2),r=bookBuy(m,side,a);
  for(let i=0;i<12;i++){r=bookBuy(m,side,a);const fee=r.cost*th*(1-r.avg);const na=Math.max(0,total-fee);if(Math.abs(na-a)<1e-10){a=na;break;}a=na;}
  r=bookBuy(m,side,a);const fee=r.cost*th*(1-r.avg),totalFee=r.cost+fee;
  const capFee=r.maxCost*th*(1-(r.cap>0?r.maxCost/r.cap:r.first));
  return {side,total:r.full?total:totalFee,req:total,a:r.cost,fee,sh:r.sh,avg:r.avg*100,first:r.first*100,theta:th,feeRate:r.cost>0?fee/(r.cost+fee):th*(1-r.first),
    impact:(r.mid1-r.mid0)*100,mid1:r.mid1*100,spread:(r.first-r.mid0)*100,full:r.full,maxTotal:r.maxCost+capFee,
    pm:r.cost*pmRate(m.cat)*(1-r.avg),gain:r.sh-(r.full?total:totalFee)};
}
function quoteSell(m,side,sh){const r=bookSell(m,side,sh);return {side,sh:r.sh,pro:r.pro,avg:r.avg*100,first:r.first*100,impact:(r.mid0-r.mid1)*100,mid1:r.mid1*100,full:r.full,cap:r.cap};}

/* Exécution : le prix du marché se déplace de l'impact de l'ordre (en points de %). */
function applyBuy(m,q){const d=q.impact*(q.side==='oui'?1:-1);m.p=engClamp(m.p+d,1,99);m.vol+=q.a;return m.p;}
function applySell(m,q){const d=q.impact*(q.side==='oui'?-1:1);m.p=engClamp(m.p+d,1,99);m.vol+=q.pro;return m.p;}
/* Valeur de sortie d'une position (ce qu'elle rapporterait si on la vendait maintenant). */
const liqValue=(m,side,sh)=>bookSell(m,side,sh).pro;
/* Meilleure offre et meilleure demande du carnet, en ¢. */
const bestAsk=(m,side)=>Math.min(ENG.PMAX,sideMid(m,side)+bookHalf(m))*100;
const bestBid=(m,side)=>Math.max(ENG.PMIN,sideMid(m,side)-bookHalf(m))*100;

/* ---------- Ordres à cours limité ---------- */
/* Achat limité : on dépense `total` (frais compris) mais seulement tant que le prix reste ≤ pcap ($).
   Si le carnet ne permet pas de tout exécuter sous ce prix, la part exécutable l'est tout de suite et `rest` attend. */
function quoteBuyCap(m,side,total,disc,pcap){
  const th=wmRate(m.cat,disc),D=bookDepth(m)*100,mid=sideMid(m,side),A0=Math.min(ENG.PMAX,mid+bookHalf(m)),P=Math.min(pcap,ENG.PMAX);
  if(P<=A0+1e-12)return {side,sh:0,a:0,fee:0,total:0,rest:total,avg:A0*100,first:A0*100,impact:0,mid1:mid*100,theta:th,full:false,marketable:false,partial:false};
  const capSh=D*(P-A0),capCost=A0*capSh+capSh*capSh/(2*D),capAvg=capSh>0?capCost/capSh:A0,capFee=capCost*th*(1-capAvg);
  if(total>=capCost+capFee-1e-9)return {side,sh:capSh,a:capCost,fee:capFee,total:capCost+capFee,rest:total-capCost-capFee,avg:capAvg*100,first:A0*100,impact:capSh/D*100,mid1:(mid+capSh/D)*100,theta:th,feeRate:capCost>0?capFee/(capCost+capFee):0,full:true,marketable:true,partial:true};
  const q=quoteBuy(m,side,total,disc);q.rest=0;q.marketable=true;q.partial=false;return q;
}
/* Vente limitée : on vend `sh` parts mais seulement tant que le prix reste ≥ pfloor ($). */
function quoteSellCap(m,side,sh,pfloor){
  const D=bookDepth(m)*100,mid=sideMid(m,side),B0=Math.max(ENG.PMIN,mid-bookHalf(m)),P=Math.max(pfloor,ENG.PMIN);
  if(B0<=P+1e-12)return {side,sh:0,pro:0,rest:sh,avg:B0*100,first:B0*100,impact:0,mid1:mid*100,full:false,marketable:false,partial:false};
  const capSh=D*(B0-P);
  if(sh>capSh+1e-9){const pro=B0*capSh-capSh*capSh/(2*D);return {side,sh:capSh,pro,rest:sh-capSh,avg:capSh>0?pro/capSh*100:B0*100,first:B0*100,impact:capSh/D*100,mid1:(mid-capSh/D)*100,full:true,marketable:true,partial:true};}
  const q=quoteSell(m,side,sh);q.rest=0;q.marketable=true;q.partial=false;return q;
}

/* ---------- Paris éclair : cagnotte ---------- */
const flashPool=g=>g.pool.o+g.pool.n+g.pool.e;
const poolKey=side=>side==='oui'?'o':side==='non'?'n':'e';
/* frais prélevés à la mise : taux · (1 − part de la cagnotte déjà sur ce côté) */
function flashFee(cat,g,side,amt,disc){const T=flashPool(g),share=T>0?g.pool[poolKey(side)]/T:.5;return amt*wmRate(cat,disc)*(1-share);}
/* gain si le côté gagne : Oui/Non = mise nette × (cagnotte / mises du côté) ; break even = mise nette × cote bloquée à la mise (beMultFair), jamais plus que la cagnotte */
function flashPayout(g,my){const key=poolKey(my.s),T=flashPool(g),W=g.pool[key];if(W<=0)return my.net;let mult=T/W;if(my.s==='be')mult=Math.min(mult,my.mult||ENG.CAP_BE,ENG.CAP_BE);return my.net*mult;}

if(typeof module!=='undefined')module.exports={ENG,PM_RATE,pmRate,wmRate,bookDepth,growLiq,bookHalf,sideMid,bookBuy,bookSell,quoteBuy,quoteSell,applyBuy,applySell,liqValue,bestAsk,bestBid,quoteBuyCap,quoteSellCap,flashPool,poolKey,flashFee,flashPayout,erf,beProb,beMultFair,beRoom};

</script>
<script>
'use strict';
/* ===================== Emblèmes de rang (dessin original) ===================== */

function emb(t,d=0,cls=''){const T=TIERS[t],u='eg'+(++EMB);const pips=t===8?'':[0,1,2].map(i=>`<rect x="${12.5+i*8.5}" y="48" width="6" height="4" rx="2" fill="${i<=d?T.c[1]:'#D5D9E0'}"/>`).join('');
 const rays=t===8?Array.from({length:12},(_,i)=>{const a=i*Math.PI/6+Math.PI/12;return `<path d="M${(24+17*Math.cos(a)).toFixed(1)} ${(23+17*Math.sin(a)).toFixed(1)}L${(24+23.5*Math.cos(a)).toFixed(1)} ${(23+23.5*Math.sin(a)).toFixed(1)}" stroke="${T.c[1]}" stroke-width="2.4" stroke-linecap="round"/>`;}).join(''):'';
 return `<svg class="emb ${cls}" viewBox="0 0 48 54" aria-hidden="true"><defs><linearGradient id="${u}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${T.c[0]}"/><stop offset="1" stop-color="${T.c[1]}"/></linearGradient></defs>${rays}<path d="M24 2 43 13v20L24 44 5 33V13Z" fill="url(#${u})"/><path d="M24 2 43 13 24 23 5 13Z" fill="#fff" opacity=".2"/>${GLYPH[t]}${pips}</svg>`;}
const rk=(t,d)=>`<span class="rk${t===8?' r8':''}">${emb(t,d)}${rankName(t,d)}</span>`;

/* ===================== Petits composants ===================== */
function meU(){const r=myRank();return {n:S.me.n,t:r.t,d:r.d,tone:'me'};}
const userOf=u=>u==='me'?meU():USERS[u];
const uHref=u=>u==='me'?'#profil':'#joueur-'+u;
function avH(u,size,tag='a'){const U=userOf(u);const css=(size?`width:${size}px;height:${size}px;font-size:${Math.round(size*.4)}px;`:'')+(u==='me'?`background:${S.me.color};`:'');const st=css?` style="${css}"`:'';return `<${tag} class="av${avClass(u)} ${u==='me'?'t-me':'t'+U.tone}"${tag==='a'?` href="${uHref(u)}" aria-label="${esc(u==='me'?_t('Mon profil'):_t('Profil de {0}',[U.n]))}"`:''}${st}>${avInner(u,size||32)}</${tag}>`;}
function richText(t){return esc(t).replace(/@([\w.]+)/g,'<span class="mention">@$1</span>').replace(/#([a-z0-9-]+)/g,(s,id)=>MK[id]?`<a class="mlink" href="#marche-${id}">${esc(MK[id].short)} <b data-mp="${id}">${F.pct(MK[id].p)}</b></a>`:s);}
function gateBtn(g,label,cls,extra=''){if(can(g))return `<button class="btn ${cls}" data-a="${g}" ${extra}>${label}</button>`;return `<button class="btn ${cls}" data-a="lock" data-g="${g}" ${extra}>${label} <span class="lk">${ic('lock',10)} ${TIERS[GATES[g].t].name}</span></button>`;}
/* C13 : sur la page d'un marché, une seule variation est affichée : celle de la période choisie, nommée. */
const perLab=()=>({'1 h':_t('sur 1 heure'),'6 h':_t('sur 6 heures'),'1 j':_t('sur 24 heures'),'1 sem.':_t('sur 7 jours'),'Tout':_t('depuis l’ouverture')})[S.ui.tf]||'';
const perDelta=m=>{if(S.ui.tf==='1 j')return Math.round(m.p-m.d0);const a=series(m,S.ui.tf);return Math.round(a[a.length-1]-a[0]);};
const ptsLong=(d,suf)=>{const r=Math.round(d),a=Math.abs(r);return `${_t("{0} point{1} {2}",[bidi((r>=0?'+':'−')+a),a>1?'s':'',suf])}`;};
function followBtn(u){const on=S.me.following.includes(u);return `<button class="btn ${on?'b-soft':'b-ghost'} sm" data-a="follow-user" data-u="${u}">${on?_t("Suivi"):_t("Suivre")}</button>`;}
const posOf=(mid,s)=>S.me.positions.find(p=>p.m===mid&&p.s===s)||{sh:0,avg:0};
/* Espaces insécables : règles françaises (chiffre + mot, espace avant ? ! : ; % $) uniquement en français.
   En anglais et en hébreu, seul un nombre reste collé à son unité (« 45 s », « 63 % »), sans souder les mots qui suivent. */
const FIX_UNIT=/(\d) (?=(?:[%¢]|(?:ms|min|s|h|d|XP|pts?)(?![\w\u0590-\u05FF])|[\u0590-\u05FF]{1,3}[׳״]))/g;
function fixText(root){if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
 if(LANG!=='fr'){while((n=w.nextNode())){const v=n.nodeValue;if(!/\d /.test(v))continue;const nv=v.replace(FIX_UNIT,'$1 ');if(nv!==v)n.nodeValue=nv;}return;}
 while((n=w.nextNode())){const v=n.nodeValue;if(!/\d |\s[?!:;%$¢»]|« /.test(v))continue;const nv=v.replace(/(\d) (?=[\d$%¢A-Za-zÀ-ÿ])/g,'$1 ').replace(/ ([?!:;%$¢»])/g,' $1').replace(/« /g,'« ');if(nv!==v)n.nodeValue=nv;}}

/* ===================== Traînée des mises ===================== */
function barH(b,isNew){return `<span class="b ${b.s===2?'e':b.s?'o':'n'}${b.me?' me':''}${isNew?' new':''}"><i style="height:${(6+b.a*42).toFixed(1)}%"></i></span>`;}
function trailFill(el){const id=el.dataset.trail;
 if(id!=='flash'&&S.ui.tmode!=='bars'){const m=MK[id];if(m&&m.ph&&m.ph.length>1){const L=lineSVG(m.ph.slice(-(el.classList.contains('big')?120:70)));el.classList.add('tl');el.innerHTML=L.svg+`<i class="tdot" style="top:${L.top.toFixed(1)}%;background:${L.col}"></i>`;return;}}
 el.classList.remove('tl');const src=id==='flash'?G(S.ui.fgame).bets:(MK[id]?MK[id].bets:[]);const cap=Math.max(8,Math.floor((el.clientWidth||300)/5));el.dataset.cap=cap;el.innerHTML=src.slice(-cap).map(b=>barH(b,false)).join('');}
function trailPush(id,b){if(id!=='flash'&&S.ui.tmode!=='bars')return;$$(`[data-trail="${id}"]`).forEach(el=>{el.insertAdjacentHTML('beforeend',barH(b,true));const cap=+el.dataset.cap||60;while(el.children.length>cap)el.firstElementChild.remove();});}

const REM=['🔥','👀','💸','🎯'];
function reactsInner(x){return REM.filter(e=>x.r[e]).map(e=>`<button class="${x.my.includes(e)?'on':''}" data-a="react" data-id="${x.id}" data-e="${e}">${e} ${x.r[e]}</button>`).join('')+`<button class="add" data-a="react-pal" aria-label="${_t("Réagir")}">${ic('smile',14)}</button><span class="pal">${REM.filter(e=>!x.r[e]).map(e=>`<button data-a="react" data-id="${x.id}" data-e="${e}">${e}</button>`).join('')}</span>`;}
function fcText(x){const n=x.followers||0;return n===0?(x.u==='me'?_t("Personne ne l’a encore suivie"):_t("Sois le premier à la suivre")):n===1?_t("1 personne l’a suivie"):F.int(n)+_t(" personnes l’ont suivie");}
function betHTML(x){const b=x.bet,m=MK[b.m],o=b.s==='oui',mine=x.u==='me';return `<div class="betc ${o?'':'non'}"><div class="bl"><b class="num">${F.usd0(b.amt)}</b><span>${_t("sur {0} à {1}",[o?_t("Oui"):_t("Non"),F.c(b.price)])}</span></div><a class="bm" href="#marche-${m.id}">${esc(m.q)}</a><div class="bf">${mine?`<span class="fc">${_t("Ta mise")}</span>`:(can('follow')?`<button class="btn ${o?'b-oui':'b-non'} sm" data-a="follow-bet" data-id="${x.id}">${_t("Suivre cette mise")}</button>`:`<button class="btn ${o?'b-oui':'b-non'} sm" data-a="lock" data-g="follow">${_t("Suivre cette mise")} <span class="lk">${_t("{0} Argent",[ic('lock',10)])}</span></button>`)}<span class="fc" data-fc="${x.id}">${fcText(x)}</span></div></div>`;}
function sigHTML(x){const g=x.sig,m=MK[g.m],o=g.s==='oui';return `<div class="sig ${o?'':'non'}" data-id="${x.id}"><div class="sg-h">${_t("<b>Signal de foule</b>")}<span>${hhmm(x.at)}</span></div><p>${_t("{0} personnes ont acheté {1} sur « {2} » en {3} minutes.",[F.int(g.n),o?_t("Oui"):_t("Non"),esc(m.short),g.mins])}</p><div class="trail sm" data-trail="${m.id}"></div><div class="sg-f"><span>${_t("De {0} % à {1} % en {2} min",[g.from,g.to,g.mins*2])}</span><a class="btn b-ink sm" href="#marche-${m.id}">${_t("Voir le marché")}</a></div></div>`;}
function msgH(x){if(x.k==='evt')return `<div class="evt" data-id="${x.id}">${x.rt!=null?emb(x.rt,x.rd):''}<span>${richText(x.text)}</span></div>`;if(x.k==='sig')return sigHTML(x);
 const U=userOf(x.u),mine=x.u==='me';return `<div class="msg${mine?' mine':''}" data-id="${x.id}">${avH(x.u)}<div class="mb"><div class="mh"><a class="un" href="${uHref(x.u)}">${esc(U.n)}</a>${tagH(x.u)}${rk(U.t,U.d)}<span class="tm">${hhmm(x.at)}</span></div>${x.text?`<div class="tx">${richText(x.text)}</div>`:''}${x.k==='bet'?betHTML(x):x.k==='ana'?anaCardH(x):''}<div class="reacts${REM.some(e=>x.r[e])?'':' empty'}" data-re="${x.id}">${reactsInner(x)}</div></div></div>`;}
const rsum=x=>Object.values(x.r).reduce((a,b)=>a+b,0)+(x.followers||0);
function feedH(rid){let L=room(rid).msgs;if(rid.startsWith('m:')&&S.ui.mtab==='top')L=L.filter(x=>x.k==='msg'||x.k==='bet'||x.k==='ana').slice().sort((a,b)=>rsum(b)-rsum(a)).slice(0,15).reverse();return L.slice(-60).map(msgH).join('');}
function composerH(rid){return `<div class="composer"><form class="cin" data-form="${rid}"><input data-in="${rid}" placeholder="${esc(composerPh(rid))}" maxlength="280" autocomplete="off" enterkeyhint="send" aria-label="${_t("Message")}"><span class="cc" data-cc aria-live="polite"></span><button class="send" type="submit" aria-label="${_t("Envoyer")}">${ic('send',17,'#fff')}</button></form><div class="ctools">${gateBtn('share',ic('share',15)+_t(" Partager une mise"),'b-ghost sm',`data-room="${rid}"`)}<button class="btn b-ghost sm" data-a="cite" data-room="${rid}">${_t("{0} Citer un marché",[ic('hash',15)])}</button><span class="xpc">${_t("+2 XP par message")}</span></div></div>`;}
function chatH(rid,cls,head){return `<section class="pn chat ${cls}" data-chatbox="${rid}">${head}<div class="feed" data-room="${rid}">${feedH(rid)}</div>${composerH(rid)}</section>`;}
function unr(r){const n=(S.rooms[r]||{}).unread||0;return n?`<span class="unr">${n>9?'9+':n}</span>`:'';}
function addMsg(rid,x){const r=room(rid);r.msgs.push(x);if(r.msgs.length>160)r.msgs.shift();
 if(rid.startsWith('m:')){const m=MK[rid.slice(2)];m.msgs++;$$(`[data-mmsg="${m.id}"]`).forEach(el=>el.textContent=F.int(m.msgs));}
 if(rid==='general'){const hc=$('[data-hcmini]');if(hc&&(x.k==='msg'||x.k==='bet')){hc.outerHTML=homeChatMiniH();fixText($('[data-hcmini]'));}}
 const feeds=$$(`.feed[data-room="${rid}"]`);if(feeds.length)feeds.forEach(f=>appendTo(f,x));else if(rid!=='vip'){r.unread++;$$(`[data-unread="${rid}"]`).forEach(el=>el.innerHTML=unr(rid));}}
function appendTo(feed,x){if(feed.dataset.room.startsWith('m:')&&S.ui.mtab==='top'&&x.u!=='me')return;const stick=feed.scrollHeight-feed.scrollTop-feed.clientHeight<140||x.u==='me'||Date.now()-(+feed.dataset.down||0)<900;feed.insertAdjacentHTML('beforeend',msgH(x));const el=feed.lastElementChild;fixText(el);mountTrails(el);
 /* C21 : en retirant les plus anciens (70 messages au plus), la position de lecture est conservée ; si on lit plus haut, une pastille annonce les nouveaux messages */
 if(feed.children.length>70){if(stick){while(feed.children.length>70)feed.firstElementChild.remove();feed._fr=0;}
  else{const ref=feed.children[feed.children.length-70],y0=ref.getBoundingClientRect().top;while(feed.children.length>70)feed.firstElementChild.remove();const adj=ref.getBoundingClientRect().top-y0+(feed._fr||0),t=feed.scrollTop;feed.scrollTop=t+adj;feed._fr=adj-(feed.scrollTop-t);}}
 if(stick){feed.dataset.down=Date.now();feed.scrollTo({top:feed.scrollHeight,behavior:'smooth'});feedPill(feed,false);}else feedPill(feed,true);}
function feedPill(feed,on){const box=feed.parentElement;if(!box)return;let w=box.querySelector('.nm-w');if(!on){if(w)w.remove();return;}if(w)return;w=document.createElement('div');w.className='nm-w';w.innerHTML=`<button type="button" class="nm-pill" data-a="feed-down">${_t('Nouveaux messages')} <span aria-hidden="true">↓</span></button>`;feed.insertAdjacentElement('afterend',w);}
document.addEventListener('scroll',e=>{const f=e.target;if(f&&f.classList&&f.classList.contains('feed')&&f.scrollHeight-f.scrollTop-f.clientHeight<60)feedPill(f,false);},{capture:true,passive:true});
/* un geste de défilement annule la descente automatique */
for(const t of ['wheel','touchmove'])document.addEventListener(t,e=>{const f=e.target.closest?e.target.closest('.feed'):null;if(f&&f.dataset.down)delete f.dataset.down;},{capture:true,passive:true});
/* compteur discret à l'approche de la limite de 280 caractères */
function ccUpd(i){const c=i.parentElement.querySelector('[data-cc]');if(!c)return;const n=i.value.length;c.textContent=n>=240?bidi(n+' / 280'):'';c.classList.toggle('lim',n>=270);}
document.addEventListener('input',e=>{const i=e.target;if(i&&i.dataset&&i.dataset.in!==undefined)ccUpd(i);});
document.addEventListener('submit',e=>{const i=e.target.querySelector?e.target.querySelector('[data-in]'):null;if(i)setTimeout(()=>ccUpd(i),0);},true);
function refreshReacts(x){$$(`[data-re="${x.id}"]`).forEach(el=>{const mm=el.closest('.msg');el.innerHTML=reactsInner(x);el.classList.toggle('empty',!REM.some(e=>x.r[e]));if(mm)mm.classList.remove('palopen');});}

/* ===================== Mises à jour en direct ===================== */
function updateMarket(m,old){const ch=old===undefined?0:Math.round(m.p)-Math.round(old);if(m.ph){m.ph.push(m.p);if(m.ph.length>160)m.ph.shift();if(S.ui.tmode!=='bars')$$(`[data-trail="${m.id}"]`).forEach(trailFill);}
 $$(`[data-mp="${m.id}"]`).forEach(el=>{const v=F.pct(m.p);if(el.textContent!==v){el.textContent=v;if(ch){el.classList.remove('tick-up','tick-dn');void el.offsetWidth;el.classList.add(ch>0?'tick-up':'tick-dn');}}});
 const d=m.p-m.d0;$$(`[data-md="${m.id}"]`).forEach(el=>{el.textContent=el.dataset.long?ptsLong(d,el.dataset.long):F.pts(d);el.classList.toggle('up',d>=0);el.classList.toggle('dn',d<0);});
 $$(`[data-mdp="${m.id}"]`).forEach(el=>{const pd=perDelta(m);el.textContent=ptsLong(pd,perLab());el.classList.toggle('up',pd>=0);el.classList.toggle('dn',pd<0);});
 $$(`[data-mc="${m.id}"]`).forEach(el=>el.textContent=F.c(m.p));$$(`[data-mcn="${m.id}"]`).forEach(el=>el.textContent=F.c(100-m.p));$$(`[data-mx="${m.id}"]`).forEach(el=>el.textContent=F.mult(el.dataset.side==='oui'?m.p:100-m.p));
 $$(`[data-mv="${m.id}"]`).forEach(el=>el.textContent=F.compact(m.vol));$$(`[data-people="${m.id}"]`).forEach(el=>el.textContent=F.int(m.people));
 if(S.ui.ticket.m===m.id)updNums('page');if(S.ui.sheet&&S.ui.sheet.m===m.id)updNums('sheet');if(typeof ordersCheck==='function')ordersCheck(m);}
function markHot(m){$$(`[data-row="${m.id}"]`).forEach(el=>el.classList.add('hot'));setTimeout(()=>{if(m.hotUntil<=now())$$(`[data-row="${m.id}"]`).forEach(el=>el.classList.remove('hot'));},90500);}
function tweenMoney(el,to){const from=parseFloat(el.dataset.v),full=el.classList.contains('balbig');el.dataset.v=to;if(isNaN(from)||Math.abs(from-to)<.005){el.textContent=F.bal(to,full);return;}const t0=performance.now(),D=600;const step=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);el.textContent=F.bal(from+(to-from)*e,full);if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse');}
function updateHeader(){const r=myRank(),pg=progress(),ch=$('[data-rankchip]');if(ch){const key=r.t+'-'+r.d;if(ch.dataset.key!==key){ch.dataset.key=key;ch.innerHTML=`${emb(r.t,r.d)}<span class="rt"><b>${rankName(r.t,r.d)}</b><span class="xb"><i style="width:${pg.pct}%"></i></span></span>`;}else{const i=ch.querySelector('.xb i');if(i)i.style.width=pg.pct+'%';}ch.classList.toggle('blocked',!!(pg.blocked&&pg.nx));ch.title=pg.nx?(pg.blocked?`${_t("XP suffisante pour {0} : il te manque {1}",[rankName(pg.nx.t,0),missingTxt(pg)])}`:`${_t("Plus que {0} pour {1}",[F.xp(pg.left),rankName(pg.nx.t,pg.nx.d)])}`):_t("Rang maximal");}
 $$('[data-bal]').forEach(el=>tweenMoney(el,S.me.balance));$$('[data-bal-plain]').forEach(el=>el.textContent=F.bal(S.me.balance,true));$$('[data-me-ini]').forEach(el=>{el.innerHTML=avInner('me',32);el.classList.toggle('av-img',!!photoOf('me'));el.style.background=S.me.color;});$$('.bell').forEach(b=>b.classList.toggle('muted',(S.me.tmode||'imp')==='none'));updateBell();if(typeof rgSync==='function')rgSync();}
function updateBell(){const n=S.me.logged?S.me.notifs.filter(x=>!x.read).length:0;$$('[data-nbadge]').forEach(el=>el.textContent=n?(n>9?'9+':n):'');$$('[data-ndot]').forEach(el=>el.classList.toggle('hide',!n));}
function refreshLive(){const pf=portfolio();$$('[data-live="profit"]').forEach(el=>{el.textContent=F.signed(pf.profit);el.classList.toggle('pl-up',pf.profit>0.004);el.classList.toggle('pl-dn',pf.profit<-0.004);});$$('[data-live="pvalue"]').forEach(el=>el.textContent=F.usd(pf.value));$$('[data-live="punreal"]').forEach(el=>{el.textContent=F.signed(pf.unreal);el.className='num '+plc(pf.unreal);});
 for(const p of S.me.positions){const k=p.m+'-'+p.s,m=MK[p.m],pr=p.s==='oui'?m.p:100-m.p;$$(`[data-pv="${k}"]`).forEach(el=>el.textContent=F.usd(posValue(p)));$$(`[data-ppr="${k}"]`).forEach(el=>el.textContent=F.c(pr));$$(`[data-ppnl="${k}"]`).forEach(el=>{const v=posPnl(p);el.textContent=F.signed(v);el.classList.toggle('pl-up',v>0.004);el.classList.toggle('pl-dn',v<-0.004);});}

/* ===================== Superpositions ===================== */
function toast(o){const {title,text='',sub='',icon='info',tone='',href='',dur=4200}=o;if(typeof toastAllowed==='function'&&!toastAllowed(o))return;const box=$('#toasts');if(!box)return;const t=document.createElement('div');t.className='toast '+tone;t.innerHTML=`<span class="ti">${ic(icon,16)}</span><div><b>${esc(title)}</b>${text?`<small>${esc(text)}</small>`:''}${sub?`<small class="tsub">${ic('shield',12)}<span>${esc(sub)}</span></small>`:''}</div><button class="tx" aria-label="${_t("Masquer la notification")}">${ic('x',14,'currentColor',2.4)}</button>`;fixText(t);t.addEventListener('click',e=>{if(e.target.closest('.tx')){kill();return;}if(href)location.hash=href;kill();});box.appendChild(t);const mx=innerWidth<=760?1:3;while(box.children.length>mx)box.firstElementChild.remove();let gone=false;const kill=()=>{if(gone)return;gone=true;t.classList.add('out');setTimeout(()=>t.remove(),300);};setTimeout(kill,dur);}
function floatXP(text,ev){let x,y;if(ev&&ev.clientX!=null){x=ev.clientX;y=ev.clientY-12;}else{const c=$('[data-rankchip]');const r=c&&c.getBoundingClientRect();if(r&&r.width){x=r.left+r.width/2;y=r.bottom+16;}else{x=innerWidth/2;y=120;}}const el=document.createElement('div');el.className='fxp';el.textContent=text;el.style.left=x+'px';el.style.top=y+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),1250);const c=$('[data-rankchip]');if(c){c.classList.remove('pulse');void c.offsetWidth;c.classList.add('pulse');}}

   le focus entre dans la fenêtre et y reste (Tab), puis revient au bouton d'origine à la fermeture. Échap et le clic à côté ferment toujours. */
const FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
let OVFROM=null,OVON=false,LASTC=null,LASTCT=0;

function ovRemember(){if(topOverlay())return;const a=document.activeElement;OVFROM=LASTC&&performance.now()-LASTCT<1200?LASTC:(a&&a!==document.body?a:null);}
function ovFocusBack(el){if(!el)return;let t=document.contains(el)?el:null;
 if(!t&&el.dataset&&el.dataset.a){let sel=`[data-a="${el.dataset.a}"]`;for(const k of ['m','s','id','v','g','ctx','u'])if(el.dataset[k]!==undefined)sel+=`[data-${k}="${String(el.dataset[k]).replace(/["\\]/g,'')}"]`;try{t=$(sel);}catch(e){}}
 if(t&&!t.matches('input:not([type=checkbox]):not([type=radio]),textarea,select'))try{t.focus({preventScroll:true});}catch(e){}}

 if(o&&!OVON){OVON=true;de.style.setProperty('--sbw',Math.max(0,innerWidth-de.clientWidth)+'px');de.classList.add('lock');}
 else if(!o&&OVON){OVON=false;de.classList.remove('lock');const el=OVFROM;OVFROM=null;ovFocusBack(el);}
 if(o){if(!o.dataset.tm){o.dataset.tm='1';o.addEventListener('touchmove',e=>{if(e.target===o||o.classList.contains('rankup'))e.preventDefault();},{passive:false});}
  const b=ovBox(o);if(b&&!b.contains(document.activeElement)){if(!b.hasAttribute('tabindex'))b.setAttribute('tabindex','-1');try{b.focus({preventScroll:true});}catch(e){}}}}
new MutationObserver(ovSync).observe(document.body,{childList:true});

 if(!L.length){e.preventDefault();return;}const a=document.activeElement,first=L[0],last=L[L.length-1];
 if(!box.contains(a)||a===box){e.preventDefault();(e.shiftKey?last:first).focus();}else if(e.shiftKey&&a===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&a===last){e.preventDefault();first.focus();}});

 for(const g of GROUPS)if(norm(g.q+' '+g.short+' '+g.cat+' '+_t(g.cat)).includes(q))M.push({href:'#marche-'+g.id,l:g.short,s:_t(g.cat),r:_t('{0} issues',[g.outcomes.length])});

 if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.search!==undefined){const a=e.target.parentElement.querySelector('.sres a.sel')||e.target.parentElement.querySelector('.sres a[role=option]');if(a){if(a.dataset.a==='cat')S.ui.cat=a.dataset.v;if(a.dataset.a==='fopen')ACT.fopen(a);location.hash=a.getAttribute('href');e.target.value='';e.target.blur();$$('.sres').forEach(s=>s.classList.remove('open'));searchClose();}}});

<script>
'use strict';

/* ===================== Créer un marché ===================== */
const COMM_PROPS=[{id:'pp-psg',q:_t("Le PSG sera-t-il champion de France 2027 ?"),cat:'Football',by:'karim',for:38,against:9,need:50},{id:'pp-jeu',q:_t("Un jeu vidéo dépassera-t-il 50 millions de ventes en 2027 ?"),cat:'Culture',by:'tomtom',for:21,against:6,need:50},{id:'pp-sol',q:_t("Le Solana dépassera-t-il 300 $ avant juin 2027 ?"),cat:'Crypto',by:'maxou',for:44,against:12,need:50}];
const slugify=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,28);
const shortOf=q=>{let s=q.replace(/\s*\?$/,'');if(s.length>34){s=s.slice(0,34);s=s.slice(0,s.lastIndexOf(' '))+'…';}return s;};
const dateFr=(d,t)=>{const x=new Date(d+'T'+(t||'21:00'));return isNaN(x)?'':_t('{0} à {1}',[fmtDay(x),t||'21:00']);};
function crChecks(dr){const q=dr.q.trim(),d=new Date(dr.date+'T'+(dr.time||'21:00'));return [{ok:q.length>=15,l:_t("Une question d’au moins 15 caractères")},{ok:/\?$/.test(q),l:_t("Elle se termine par un point d’interrogation")},{ok:!isNaN(d)&&d>new Date(),l:_t("Une date de clôture dans le futur")},{ok:dr.src.trim().length>=3,l:_t("Une source de résolution vérifiable")},{ok:dr.rules.trim().length>=30,l:_t("Des règles d’au moins 30 caractères")}];}
function crPreviewH(){const dr=S.ui.draft,p=+dr.p0,days=dr.date?Math.max(0,Math.round((new Date(dr.date+'T'+(dr.time||'21:00'))-new Date())/864e5)):null;return `<div class="prevcard"><div class="cat">${esc(_t(dr.cat))}</div><div class="q">${dr.q.trim()?esc(dr.q.trim()):`<span class="muted">${_t("Ta question apparaîtra ici")}</span>`}</div><div class="prevrow"><div><b class="num">${F.pct(p)}</b><small>${_t("chance Oui")}</small></div><div class="hbtns"><span class="btn b-ouis sm">${_t("Oui {0} ¢",[p])}</span><span class="btn b-nons sm">${_t("Non {0} ¢",[100-p])}</span></div></div><div class="sub">${days===null?_t("Choisis une date de clôture"):days===0?_t("Clôture aujourd’hui"):`${_t("Clôture dans {0} j",[days])}`}${dr.src.trim()?`${_t(", résolu selon {0}",[esc(dr.src.trim())])}`:''}</div></div>`;}
function crChecksH(){return crChecks(S.ui.draft).map(c=>`<div class="chk2${c.ok?' ok':''}"><span class="ck">${c.ok?ic('check',12,'#fff',3):''}</span>${c.l}</div>`).join('');}
function propRowH(pr,mine){const tot=pr.for+pr.against,pct=Math.round(pr.for/Math.max(1,pr.need)*100);const st=pr.status==='live'?`<a class="btn b-white sm" href="#marche-${pr.mid}">${_t("Voir le marché")}</a>`:mine?`<span class="xpc" data-prs="${pr.id}">${_t("En vote")}</span>`:(S.me.voted[pr.id]?`<span class="xpc">${_t("Tu as voté {0}",[S.me.voted[pr.id]==='for'?_t('pour'):_t('contre')])}</span>`:`<span class="hbtns"><button class="btn b-ouis sm" data-a="vote" data-id="${pr.id}" data-v="for">${_t("Pour")}</button><button class="btn b-nons sm" data-a="vote" data-id="${pr.id}" data-v="against">${_t("Contre")}</button></span>`);
 return `<div class="prop" data-prop="${pr.id}"><div class="pq"><span class="tag2">${_t(pr.cat)}</span><b>${esc(pr.q)}</b><small>${mine?_t("Ta proposition"):_t("Proposée par ")+esc(USERS[pr.by].n)}, <span data-prv="${pr.id}">${_t("{0} pour, {1} contre",[pr.for,pr.against])}</span>${pr.status==='live'?_t(", validée"):`${_t(", {0} votes pour la valider",[pr.need])}`}</small></div>${st}<div class="xpbar sm"><i data-prb="${pr.id}" style="width:${Math.min(100,pct)}%"></i></div></div>`;}
function vCreate(){const dr=S.ui.draft,tab=S.ui.crTab,mine=S.me.props||[];if(!dr.date){const d=new Date(Date.now()+30*864e5);dr.date=d.toISOString().slice(0,10);}const okAll=crChecks(dr).every(c=>c.ok)&&can('propose');
 const tabs=`<div class="tabs utabs">${[['form',_t("Nouveau pari")],['mine',`${_t("Mes propositions{0}",[mine.length?' ('+mine.length+')':''])}`],['vote',_t("À voter")]].map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="cr-tab" data-v="${k}">${l}</button>`).join('')}</div>`;
 let body='';
 if(tab==='form')body=`${can('propose')?'':`<button class="lockrow on-bg" data-a="lock" data-g="propose" style="width:100%;margin-bottom:20px"><span style="display:flex;gap:10px;align-items:center">${ic('lock',16,'#7A808C')}<span>${_t("Créer un pari se débloque au rang Or. Clique pour voir ce qu’il te manque.")}</span></span>${rk(3,0)}</button>`}<div class="g-dep"><form class="col" data-form="create" novalidate>
 <section class="pn pad step"><div class="step-h"><i>1</i><h3>${_t("La question")}</h3></div><div class="field"><label for="cq">${_t("Question, avec une réponse Oui ou Non")}</label><input id="cq" data-cr="q" maxlength="120" placeholder="${_t("Le PSG sera-t-il champion de France 2027 ?")}" value="${esc(dr.q)}" autocomplete="off"><span class="sub" data-crcount>${dr.q.length} / 120</span></div><div class="field"><label>${_t("Catégorie")}</label><div class="chips">${CATS.filter(c=>c!=='Tout').map(c=>`<button type="button" class="chip${dr.cat===c?' on':''}" data-a="cr-cat" data-v="${c}">${_t(c)}</button>`).join('')}</div></div></section>
 <section class="pn pad step"><div class="step-h"><i>2</i><h3>${_t("Clôture et résolution")}</h3></div><div class="row2"><div class="field"><label for="cd">${_t("Date de clôture")}</label><input id="cd" type="date" data-cr="date" value="${dr.date}" min="${today()}"></div><div class="field"><label for="ct">${_t("Heure")}</label><input id="ct" type="time" data-cr="time" value="${dr.time}"></div></div><div class="field"><label for="cs">${_t("Source de résolution")}</label><input id="cs" data-cr="src" placeholder="${_t("Site officiel de la Ligue 1")}" value="${esc(dr.src)}" autocomplete="off"></div><div class="field"><label for="crr">${_t("Règles de résolution")}</label><textarea id="crr" data-cr="rules" rows="4" placeholder="${_t("Ce marché se résout par Oui si…")}">${esc(dr.rules)}</textarea><button type="button" class="link" data-a="cr-rules" style="align-self:flex-start;font-size:13px">${_t("Rédiger les règles à partir de ma question")}</button></div></section>
 <section class="pn pad step"><div class="step-h"><i>3</i><h3>${_t("Cote de départ")}</h3></div><div class="field"><label for="cp">${_t("Chance de Oui au lancement :")} <b data-crp>${F.pct(dr.p0)}</b></label><input id="cp" type="range" min="5" max="95" step="1" value="${dr.p0}" data-cr="p0" class="range"></div><p class="sub">${_t("Elle bougera ensuite avec les mises des joueurs.")}</p></section>
 <section class="pn pad step"><div class="step-h"><i>4</i><h3>${_t("Publication")}</h3></div><label class="net on" style="cursor:default"><span class="rad"></span><span class="nn">${_t("<b>Envoyer au vote de la communauté</b>")}<small>${_t("Il suffit de 25 votes favorables pour le mettre en ligne. +50 XP s’il est validé.")}</small></span>${rk(3,0)}</label>${can('publish')?'':`<button type="button" class="net" data-a="lock" data-g="publish"><span class="rad"></span><span class="nn">${_t("<b>Publier directement, sans vote</b>")}<small>${_t("Réservé aux joueurs Immortel et Radiant.")}</small></span>${rk(7,0)}</button>`}<button class="btn b-ink lg full" type="submit" data-crsubmit${okAll?'':' disabled'}>${_t("Envoyer ma proposition")}</button></section></form>
 <aside class="col"><section class="pn pad" style="position:sticky;top:88px"><div class="sub" style="margin:0 0 10px">${_t("Aperçu dans la liste des marchés")}</div><div data-crprev>${crPreviewH()}</div><hr><div class="h2" style="font-size:15px;margin-bottom:6px">${_t("Avant d’envoyer")}</div><div data-crcheck>${crChecksH()}</div><hr><div class="h2" style="font-size:15px;margin-bottom:6px">${_t("Ce qui est refusé")}</div><p class="sub" style="line-height:1.55">${_t("Les questions sur des personnes privées, la violence ou la santé de quelqu’un, et celles dont le résultat ne peut pas être vérifié.")}</p></section></aside></div>`;
 else if(tab==='mine')body=`<section class="pn pad">${mine.length?mine.map(p=>propRowH(p,true)).join(''):`<div class="empty">${_t("Tu n’as encore rien proposé.")} <button class="link" data-a="cr-tab" data-v="form">${_t("Créer un pari")}</button></div>`}</section>`;
 else body=`<section class="pn pad"><div class="sub" style="margin:0 0 6px">${_t("Vote pour les marchés que tu veux voir en ligne. +2 XP par vote.")}</div>${COMM_PROPS.map(p=>propRowH(p,false)).join('')}</section>`;
 return `<div class="wrap"><div class="pagehead"><div><h1 class="ptitle">${_t("Créer un pari")}</h1><p class="plead">${_t("Pose une question avec une réponse claire, Oui ou Non. Si la communauté la valide, ton pari passe en ligne avec son propre chat.")}</p></div>${tabs}</div>${body}</div>`;}
function crRefresh(){const p=$('[data-crprev]');if(p){p.innerHTML=crPreviewH();fixText(p);}const c=$('[data-crcheck]');if(c){c.innerHTML=crChecksH();fixText(c);}const b=$('[data-crsubmit]');if(b)b.disabled=!(crChecks(S.ui.draft).every(x=>x.ok)&&can('propose'));const n=$('[data-crcount]');if(n)n.textContent=S.ui.draft.q.length+' / 120';const v=$('[data-crp]');if(v)v.textContent=S.ui.draft.p0+' %';}

function pseudoMsg(v){if(!v)return ['',_t("3 à 20 caractères : lettres, chiffres, point ou tiret bas.")];if(!/^[A-Za-z0-9._]{3,20}$/.test(v))return ['bad',_t("3 à 20 caractères : lettres, chiffres, point ou tiret bas.")];if(takenNames().includes(v.toLowerCase()))return ['bad',_t("Ce pseudo est déjà pris.")];return ['ok',_t("Ce pseudo est disponible.")];}
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.su;if(!k)return;const v=e.target.value;
 if(k==='pseudo'){const [st,msg]=pseudoMsg(v.trim());const el=$('[data-sun]');if(el){el.textContent=msg;el.style.color=st==='bad'?'var(--nonT)':st==='ok'?'var(--oui)':'';}}

FORMS.login=f=>{const e=f.email.value.trim().toLowerCase(),p=f.pw.value,err=f.querySelector('[data-autherr]');if(!EMAIL_RE.test(e)){err.textContent=_t("Entre une adresse e-mail valide.");return;}if(p.length<8){err.textContent=_t("Le mot de passe fait au moins 8 caractères.");return;}const rec=AUTH.get(e);const legacy=rec&&rec.ph===hash(p+'|'+e);if(!rec||(rec.ph!==pwHash(p,e)&&!legacy)){err.textContent=rec?_t("Mot de passe incorrect."):_t("Aucun compte avec cet e-mail. Crée ton compte en une minute.");return;}if(legacy){rec.ph=pwHash(p,e);AUTH.set(e,rec);}err.textContent='';enterAccount(rec);doLogin();};

 if(st!=='ok'){err.textContent=msg;return;}if(!EMAIL_RE.test(e)){err.textContent=_t("Entre une adresse e-mail valide.");return;}if(p.length<8){err.textContent=_t("Le mot de passe doit faire au moins 8 caractères.");return;}if(!f.age.checked){err.textContent=_t("Wimoro est réservé aux personnes majeures.");return;}if(!f.cgu.checked){err.textContent=_t("Accepte les conditions pour continuer.");return;}
 if(AUTH.get(e.toLowerCase())){err.textContent=_t("Un compte existe déjà avec cet e-mail. Connecte-toi.");return;}createAccount(n,e,p);const refOk=typeof refApplyAtSignup==='function'&&refApplyAtSignup(f.ref?f.ref.value:'');S.ui.ob=1;S.ui.cat='Tout';toast({tone:'blue',icon:'check',title:`${_t("Compte créé, bienvenue {0} !",[n])}`,text:refOk?`${_t("{0} de parrainage offerts. Encore 5 petites étapes.",[F.usd0(REF.BONUS)])}`:_t("Encore 5 petites étapes.")});location.hash='#bienvenue';};

function chartData(m){const t=ctype(),a=series(m,S.ui.tf),r=rng(hash(m.id+S.ui.tf+'c')),n=24,per=a.length/n,C=[];
 let prev=a[0];for(let k=0;k<n;k++){const base=a[(k+1)*per-1],o=prev,c=k===n-1?m.p:clamp(base+(r()-.5)*2.6,1,99),h=Math.min(99.5,Math.max(o,c)+.2+r()*1.1),l=Math.max(.5,Math.min(o,c)-.2-r()*1.1);C.push({o,c,h,l,v:.35+r()*.65+Math.min(1.6,Math.abs(c-o)*.45)});prev=c;}

 let mn=Math.max(0,Math.floor((lo-3)/10)*10),mx=Math.min(100,Math.ceil((hi+3)/10)*10);if(mx-mn<20)mx=Math.min(100,mn+20);if(mx-mn<20)mn=Math.max(0,mx-20);

function chartInner(m){const d=chartData(m),{t,a,C,mn,mx}=d,W=800,H=240,y=v=>H-(v-mn)/(mx-mn)*H,n=C.length,sw=W/n,bw=sw*.56,vmax=Math.max(...C.map(c=>c.v)),VH=H*.16;CHD[m.id]=d;
 let g='',lab='',vol='',body='';
 for(let v=mn;v<=mx;v+=10){g+=`<line class="gl" x1="0" x2="${W}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>`;lab+=`<span class="ylab" style="top:${(y(v)/H*100).toFixed(2)}%">${F.pct(v)}</span>`;}
 C.forEach((c,k)=>{const cx=sw*(k+.5),cl=c.c>=c.o?'up':'dn',vh=c.v/vmax*VH;vol+=`<rect class="vo ${t==='bougies'?cl:'nt'}" x="${(cx-bw/2).toFixed(1)}" y="${(H-vh).toFixed(1)}" width="${bw.toFixed(1)}" height="${vh.toFixed(1)}"/>`;
  if(t==='bougies'){const yt=y(Math.max(c.o,c.c)),yb=y(Math.min(c.o,c.c));body+=`<line class="wk ${cl}" x1="${cx.toFixed(1)}" x2="${cx.toFixed(1)}" y1="${y(c.h).toFixed(1)}" y2="${y(c.l).toFixed(1)}"/><rect class="bd ${cl}" x="${(cx-bw/2).toFixed(1)}" y="${yt.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1.6,yb-yt).toFixed(1)}"/>`;}});
 if(t!=='bougies'){const x=i=>i/(a.length-1)*W,p=a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');body=`<path class="ar" d="${p} L${W} ${H} L0 ${H}Z"/><path class="ln" d="${p}"/>`;}
 const last=C[n-1],lc=t==='bougies'?(last.c>=last.o?'up':'dn'):'ln',yp=(y(m.p)/H*100).toFixed(2),per=a.length/n;

function tfLabel(t){const d=new Date(t);if(S.ui.tf==='Tout')return d.toLocaleDateString(LOC,{day:'numeric',month:'short'});if(S.ui.tf==='1 sem.')return d.toLocaleDateString(LOC,{weekday:'short',day:'numeric'});return hhmm(t);}

FORMS.pwchange=f=>{const err=f.querySelector('[data-pwerr]');if(f.cur.value.length<8){err.textContent=_t("Ton mot de passe actuel fait au moins 8 caractères.");return;}if(f.pw.value.length<8){err.textContent=_t("Le nouveau mot de passe doit faire au moins 8 caractères.");return;}if(f.pw.value!==f.pw2.value){err.textContent=_t("Les deux mots de passe ne sont pas identiques.");return;}if(f.pw.value===f.cur.value){err.textContent=_t("Choisis un mot de passe différent de l’actuel.");return;}const rec=accountOfMe();if(rec&&rec.ph&&rec.ph!==pwHash(f.cur.value,rec.key)){err.textContent=_t("Mot de passe actuel incorrect.");return;}if(rec){rec.ph=pwHash(f.pw.value,rec.key);AUTH.set(rec.key,rec);}closeModal();toast({tone:'green',icon:'check',title:_t("Mot de passe changé"),text:_t("Utilise-le à ta prochaine connexion.")});notif('shield',_t('Ton mot de passe a été changé.'),'#modifier');};

 const me=S.me,renamed=n!==me.n;me.n=n;me.photo=p.photo||'';me.color=p.color;me.bio=p.bio.trim();me.interests=p.interests.slice();me.email=p.email.trim();me.wallet=p.wallet;me.prefs=Object.assign({},p.prefs);if(!me.interests.length&&S.ui.cat==='Pour toi')S.ui.cat='Tout';
 const rec=accountOfMe();if(rec&&!rec.demo){rec.pseudo=me.n;rec.email=me.email;AUTH.set(rec.key,rec);}S.ui.pe=null;updateHeader();save();toast({tone:'green',icon:'check',title:_t("Profil mis à jour"),text:renamed?`${_t("Tu t’appelles maintenant {0}.",[n])}`:_t("Tes changements sont enregistrés.")});notif('user',_t('Ton profil a été mis à jour.'),'#profil');location.hash='#profil';};

/* Bouton « Vendre des parts » : vert si la position gagne, rouge si elle perd */
function posTot(mid){return S.me.positions.filter(x=>x.m===mid).reduce((s,x)=>s+liqPnl(x),0);}
function sellBtnH(mid){const t=posTot(mid);return `<button class="btn ${t>0.004?'b-gain':t<-0.004?'b-loss':'b-white'} full sellbtn" data-a="tmode" data-v="sell" data-psell="${mid}"><span>${_t("Vendre des parts")}</span><b class="num">${F.signed(t)}</b></button>`;}
function syncSellBtns(){$$('[data-psell]').forEach(b=>{const t=posTot(b.dataset.psell);b.classList.toggle('b-gain',t>0.004);b.classList.toggle('b-loss',t<-0.004);b.classList.toggle('b-white',Math.abs(t)<=0.004);const v=b.querySelector('b');if(v)v.textContent=F.signed(t);});}

function homeTabs(){const base=S.me.interests.length?['Pour toi',...CATS]:CATS.slice();if((S.me.props||[]).length){const i=base.indexOf('Tout');base.splice(i+1,0,'Mes paris créés');}else if(S.ui.cat==='Mes paris créés')S.ui.cat='Tout';return base;}
function voteRowH(pr){const pct=Math.min(100,pr.for/pr.need*100);return `<div class="row vrow" data-href="#creer"><div class="qcell"><div class="cat">${_t(pr.cat)}<span class="ctag vote">${_t("En vote")}</span></div><a class="q" href="#creer" data-a="cr-tab" data-v="mine">${esc(pr.q)}</a></div><div class="pv"><div class="num">${F.pct(pr.p0)}</div><div class="delta">${_t("au départ")}</div></div><div class="tr"><div class="vbar"><i data-prb="${pr.id}" style="width:${pct}%"></i></div><small data-prv="${pr.id}">${_t("{0} pour, {1} contre",[pr.for,pr.against])}</small></div><div class="vol"><div class="v" data-prc="${pr.id}">${pr.for} / ${pr.need}</div><div class="c">${_t("votes")}</div></div><div class="acts"><a class="btn b-ghost sm" href="#creer" data-a="cr-tab" data-v="mine">${_t("Suivre le vote")}</a></div></div>`;}
function myBoardH(){const P=S.me.props||[];const live=P.filter(p=>p.status==='live'&&MK[p.mid]).map(p=>MK[p.mid]),vote=P.filter(p=>p.status==='vote');if(!live.length&&!vote.length)return `<div class="empty">${_t("Tu n’as pas encore créé de pari.")} <a class="link" href="#creer" data-a="cr-tab" data-v="form">${_t("Créer un pari")}</a></div>`;
 return `<div class="hd"><span>${_t("Pari")}</span><span>${_t("Chance Oui")}</span><span>${_t("Volume")}</span><span>${_t("Total")}</span><span></span></div>`+live.map(rowH).join('')+vote.map(voteRowH).join('');}
function myBetsH(){const L=S.me.props||[];if(!L.length)return `<div class="empty">${_t("Tu n’as pas encore créé de pari.")} <a class="link" href="#creer" data-a="cr-tab" data-v="form">${_t("Créer un pari")}</a></div>`;
 return `<div style="padding:4px 20px 12px">${L.map(pr=>{const m=pr.status==='live'?MK[pr.mid]:null;if(m)return `<a class="act mybet" href="#marche-${m.id}"><span><span class="ctag">${_t("En ligne")}</span>${esc(m.q)}<small style="display:block;margin-top:3px">${_t("{0}, {1} participants, volume {2}",[_t(m.cat),F.int(m.people),F.compact(m.vol)])}</small></span><b class="num up" style="font-size:20px" data-mp="${m.id}">${F.pct(m.p)}</b></a>`;
  return `<a class="act mybet" href="#creer" data-a="cr-tab" data-v="mine"><span><span class="ctag vote">${_t("En vote")}</span>${esc(pr.q)}<small style="display:block;margin-top:3px" data-prv="${pr.id}">${_t("{0} pour, {1} contre",[pr.for,pr.against])}</small></span><b class="num" style="font-size:16px;white-space:nowrap" data-prc="${pr.id}">${pr.for} / ${pr.need}</b></a>`;}).join('')}</div>`;}
function refreshMine(){const r=S.ui.route||'';if(r==='accueil'){const b=$('#board');if(b){b.innerHTML=boardH();fixText(b);mountTrails(b);}const t=$('.filters .tabs');if(t&&!t.querySelector('[data-v="Mes paris créés"]')&&(S.me.props||[]).length)render(false);}if(r==='profil'&&S.ui.ptab==='mine')render(false);if(r==='creer')render(false);}
function catchUpVotes(){let n=0;for(const pr of S.me.props||[]){if(pr.status!=='vote')continue;const g=Math.floor((now()-(pr.tick||pr.at||now()))/1500);if(g>0){pr.for=Math.min(pr.need,pr.for+g);pr.tick=now();}if(pr.for>=pr.need){pr.status='live';createMarketFromProposal(pr,true);n++;}}if(n){refreshMine();save();}}
function voteTick(){for(const pr of S.me.props||[]){if(pr.status!=='vote')continue;if(R()<.92)pr.for+=1+Math.floor(R()*3);if(R()<.18)pr.against++;pr.tick=now();
 $$(`[data-prv="${pr.id}"]`).forEach(e=>e.textContent=`${_t("{0} pour, {1} contre",[pr.for,pr.against])}`);$$(`[data-prb="${pr.id}"]`).forEach(e=>e.style.width=Math.min(100,pr.for/pr.need*100)+'%');$$(`[data-prc="${pr.id}"]`).forEach(e=>e.textContent=`${Math.min(pr.for,pr.need)} / ${pr.need}`);
 if(pr.for>=pr.need){pr.for=pr.need;pr.status='live';createMarketFromProposal(pr,true);refreshMine();}save();}}

];

/* SVG d'un avatar de la galerie (dégradé de fond + dessin) */

/* photo d'un joueur : « g:id », data:URL, ou '' (initiale) */
function photoOf(u){if(u==='me')return S.me.photo||'';const U=USERS[u];if(!U)return '';if(U.photo!==undefined)return U.photo;return 'g:'+AV_GALLERY[hash(u)%AV_GALLERY.length].id;}
/* contenu intérieur d'un .av : image ou initiale */
function avInner(u,size){const p=photoOf(u);if(p.startsWith('g:'))return avSvg(p.slice(2),size);if(p.startsWith('data:'))return `<img src="${p}" alt="">`;const U=userOf(u);return esc((U.n||'?')[0]);}
function avClass(u){const p=photoOf(u);return p?' av-img':'';}
/* Import d'une photo : recadrage carré, 256 px, JPEG */
function avImportFile(file,cb){if(!file||!/^image\//.test(file.type)){toast({tone:'amber',icon:'info',title:_t("Fichier non reconnu"),text:_t("Choisis une image (JPG, PNG, HEIC…).")});return;}
 const img=new Image(),url=URL.createObjectURL(file);
 img.onload=()=>{try{const S0=256,c=document.createElement('canvas');c.width=S0;c.height=S0;const x=c.getContext('2d'),s=Math.min(img.naturalWidth,img.naturalHeight);x.drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,S0,S0);cb(c.toDataURL('image/jpeg',.86));}catch(e){toast({tone:'amber',icon:'info',title:_t("Image illisible"),text:_t("Essaie une autre photo.")});}URL.revokeObjectURL(url);};
 img.onerror=()=>{URL.revokeObjectURL(url);toast({tone:'amber',icon:'info',title:_t("Image illisible"),text:_t("Essaie une autre photo.")});};
 img.src=url;}
/* Bloc « Photo de profil » de l'éditeur */
function avPickerH(p){const cur=p.photo||'';return `<div class="pe-photo"><div class="pe-photo-h"><span class="av av-lg${cur?' av-img':''}" data-peav style="background:${p.color}">${cur.startsWith('g:')?avSvg(cur.slice(2),72):cur.startsWith('data:')?`<img src="${cur}" alt="">`:iniOf(p.n)}</span><div>${_t("<b>Photo de profil</b>")}<small>${_t("Choisis un avatar Wimoro ou importe une photo depuis ton appareil. Sans photo, ton initiale s’affiche sur ta couleur.")}</small></div></div>

<script>
'use strict';
/* =====================================================================================
 *  Marchés à cotes multiples
 *  ------------------------------------------------------------------------------------
 *  Un marché « groupe » (GROUPS, défini dans core.js) regroupe N issues qui s'excluent.
 *  Chaque issue est un sous-marché Oui/Non ordinaire (carnet, positions, ordres limite,
 *  copie, graphique) ; ici : la page du groupe, la ligne de liste, et le couplage des prix
 *  (quand une issue monte, les autres baissent au prorata : la somme reste à 100 %).
 * ===================================================================================== */
const GCOL=['#2448FF','#F59A0B','#12A150','#7350E3','#E11D74','#0E9AA7','#8D94A0'];
const groupOf=m=>m&&m.parent?GK[m.parent]:null;
const gSum=g=>g.outcomes.reduce((t,o)=>t+o.p,0);
const gVol=g=>g.outcomes.reduce((t,o)=>t+o.vol,0);
const gSorted=g=>g.outcomes.slice().sort((a,b)=>b.p-a.p);
/* objet « ligne de liste » d'un groupe : mêmes champs que les tris des marchés */
function groupProxy(g){const top=gSorted(g)[0];return {group:g,id:g.id,cat:g.cat,vol:gVol(g),days:g.days,people:g.people,msgs:g.msgs,heat:g.heat,p:top.p,d0:top.d0,creator:''};}
/* Une issue a bougé de `delta` points : les autres compensent au prorata de leur poids */
function groupRebalance(m,delta){const g=groupOf(m);if(!g||!delta)return;const others=g.outcomes.filter(o=>o!==m),tot=others.reduce((t,o)=>t+o.p,0);if(tot<=0)return;
 for(const o of others){const old=o.p;o.p=clamp(o.p-delta*o.p/tot,1,97);if(Math.abs(o.p-old)>1e-9)updateMarket(o,old,true);}
 groupRefresh(g);}
function groupRefresh(g){$$(`[data-gsum="${g.id}"]`).forEach(el=>el.textContent=F.pct(Math.round(gSum(g))));for(const o of g.outcomes){$$(`[data-obar="${o.id}"] i`).forEach(i=>i.style.width=clamp(o.p,1,100)+'%');}
 const box=$(`[data-gchart="${g.id}"]`);if(box)box.innerHTML=groupChartH(g);}
/* le rafraîchissement d'un marché entraîne le rééquilibrage de ses frères */
const updateMarket0=updateMarket;
updateMarket=function(m,old,noGroup){updateMarket0(m,old);if(!noGroup&&m.parent&&old!==undefined){const d=m.p-old;if(Math.abs(d)>1e-9)groupRebalance(m,d);}};

/* ---------- Ligne de liste : question, puces des issues en tête, volume, bouton ---------- */
function groupRowH(g){const L=gSorted(g),top=L.slice(0,4),rest=L.length-top.length,vol=gVol(g);
 return `<div class="row grow" data-href="#marche-${g.id}" data-row="${g.id}"><div class="qcell"><div class="cat">${_t(g.cat)}<span class="ctag multi">${_t("{0} issues",[g.outcomes.length])}</span></div><a class="q" href="#marche-${g.id}">${esc(g.q)}</a></div>
 <div class="gchips">${top.map(o=>`<a class="gchip" href="#marche-${o.id}"><i style="background:${gColor(g,o)}"></i><span>${esc(o.label)}</span><b class="num" data-mp="${o.id}">${F.pct(o.p)}</b></a>`).join('')}${rest>0?`<a class="gchip more" href="#marche-${g.id}">+${rest}</a>`:''}</div>
 <div class="vol"><div class="v">${F.compact(vol)}</div><div class="c">${g.close}</div></div>
 <div class="acts"><a class="btn b-white sm full" href="#marche-${g.id}">${_t("Voir les {0} issues",[g.outcomes.length])}</a></div></div>`;}
/* couleur stable d'une issue : son rang à l'ouverture (ne change pas quand les prix bougent) */
function gColor(g,o){if(!g._col){g._col={};g.outcomes.slice().sort((a,b)=>b.d0-a.d0).forEach((x,i)=>g._col[x.id]=GCOL[Math.min(i,GCOL.length-1)]);}return g._col[o.id]||GCOL[GCOL.length-1];}

/* ---------- Graphique des issues (depuis l'ouverture) ---------- */
function groupChartH(g){const L=gSorted(g).slice(0,5),W=640,H=200,n=Math.min(...L.map(o=>o.ph?o.ph.length:0));if(n<2)return '';const mx=Math.min(100,Math.max(...L.map(o=>Math.max(...o.ph.slice(-n))))*1.18+2);
 const x=i=>i/(n-1)*W,y=v=>H-v/mx*H;const grid=[0,25,50,75].filter(v=>v<mx*.92).map(v=>`<line x1="0" x2="${W}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="gg"/><text x="0" y="${(y(v)-5).toFixed(1)}" class="gt">${F.pct(v)}</text>`).join('');
 const lead=L[0],la=lead.ph.slice(-n),area=`<defs><linearGradient id="ga-${g.id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${gColor(g,lead)}" stop-opacity=".22"/><stop offset="1" stop-color="${gColor(g,lead)}" stop-opacity="0"/></linearGradient></defs><path d="${la.map((v,k)=>(k?'L':'M')+x(k).toFixed(1)+' '+y(v).toFixed(1)).join('')}L${W} ${H}L0 ${H}Z" fill="url(#ga-${g.id})"/>`;
 const paths=L.slice().reverse().map(o=>{const a=o.ph.slice(-n),c=gColor(g,o);return `<path d="${a.map((v,k)=>(k?'L':'M')+x(k).toFixed(1)+' '+y(v).toFixed(1)).join('')}" fill="none" stroke="${c}" stroke-width="${o===lead?3:2.2}" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${W}" cy="${y(a[a.length-1]).toFixed(1)}" r="4" fill="${c}" stroke="var(--panel)" stroke-width="2"/>`;}).join('');
 return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="gsvg" aria-hidden="true">${grid}${area}${paths}</svg><div class="glegend">${L.map(o=>`<span><i style="background:${gColor(g,o)}"></i>${esc(o.label)} <b class="num" data-mp="${o.id}">${F.pct(o.p)}</b></span>`).join('')}</div>`;}

/* ---------- Page du groupe ---------- */
function vGroup(id){const g=GK[id],rid='m:'+id;room(rid).unread=0;const L=gSorted(g),vol=gVol(g),mine=S.me.positions.filter(p=>p.m&&MK[p.m]&&MK[p.m].parent===id);
 const rows=L.map(o=>{const d=o.p-o.d0,c=gColor(g,o);return `<div class="orow" data-row="${o.id}"><a class="oem" href="#marche-${o.id}" style="color:${c};background:${c}1F" aria-hidden="true">${esc(o.label.replace(/^(Une?|Le|La|Les|L’)\s+/i,'').charAt(0).toUpperCase())}</a>
  <div class="ol"><a class="on" href="#marche-${o.id}">${esc(o.label)}</a><small>${F.compact(o.vol)} · <span data-people="${o.id}">${F.int(o.people)}</span> ${_t("participants")}</small><span class="gb obar" data-obar="${o.id}"><i style="width:${clamp(o.p,1,100)}%;background:${c}"></i></span></div>
  <div class="opv"><b class="num" data-mp="${o.id}">${F.pct(o.p)}</b><span class="delta ${d>=0?'up':'dn'}" data-md="${o.id}">${F.pts(d)}</span></div>
  <div class="acts"><button class="btn b-ouis" data-a="bet" data-m="${o.id}" data-s="oui">${mxH(o.id,'oui',o.p)}${buyLbl(o.id,'oui',o.p)}</button><button class="btn b-nons" data-a="bet" data-m="${o.id}" data-s="non">${mxH(o.id,'non',o.p)}${buyLbl(o.id,'non',100-o.p)}</button></div></div>`;}).join('');
 return `<div class="wrap"><div class="mtop"><div><nav class="crumbs"><a href="#accueil">${_t("Marchés")}</a><span>/</span><a href="#accueil" data-a="cat" data-v="${g.cat}">${_t(g.cat)}</a></nav><h1 class="mq">${esc(g.q)}</h1><div class="mmeta"><span class="ctag multi">${_t("{0} issues",[g.outcomes.length])}</span><span>${_t("Clôture : <b>{0}</b>",[g.closeLong])}</span><span>${_t("Volume <b>{0}</b>",[F.compact(vol)])}</span><span>${_t("<b>{0}</b> participants",[F.int(g.people)])}</span><span>${_t("<b>{0}</b> messages dans le chat",[F.int(g.msgs)])}</span></div></div><div class="mact"><button class="btn b-white" data-a="duel-open" data-m="${L[0].id}">${_t("{0} Défier",[ic('swords',16)])}</button><button class="btn b-white" data-a="copylink" data-v="#marche-${id}">${_t("{0} Partager",[ic('share',16)])}</button><button class="btn b-white" data-a="watch" data-m="${id}" aria-pressed="${S.me.watch.includes(id)}">${ic('star',16)} <span data-watch="${id}">${watchTxt(S.me.watch.includes(id))}</span></button></div></div>
 <div class="g-mkt"><section class="pn a-chart"><div class="pad" style="padding-bottom:0"><div class="cp-h"><div class="cp-p"><b class="num" style="color:${gColor(g,L[0])}" data-mp="${L[0].id}">${F.pct(L[0].p)}</b><div><div class="cpt">${_t("pour {0}, en tête",[esc(L[0].label)])}</div><div class="sub">${_t("Les {0} issues s’excluent : la somme des chances fait",[g.outcomes.length])} <b data-gsum="${id}">${F.pct(Math.round(gSum(g)))}</b>.</div></div></div><button class="btn b-ink sm pro-open" data-a="pro-open" data-m="${L[0].id}">${_t("{0} Mode Pro",[ic('expand',15)])}</button></div></div>
 <div class="gchart" data-gchart="${id}">${groupChartH(g)}</div><div class="xax" style="padding:0 20px 12px"><span>${_t("Ouverture")}</span><span>${_t("Maintenant")}</span></div>
 <div class="orows"><div class="bd-cap">${_t("Variations sur 24 heures")}</div><div class="orows-h"><span>${_t("Issue")}</span><span>${_t("Chance")}<small class="hd-s">${_t("variation sur 24 h")}</small></span><span>${_t("Miser")}</span></div>${rows}</div>
 <p class="sub" style="padding:12px 20px 18px">${_t("Chaque issue se joue comme un marché Oui/Non : tu peux acheter Oui sur une issue, ou Non sur plusieurs. Touche le nom d’une issue pour son graphique détaillé, son carnet et ses ordres limite.")}</p></section>
 <aside class="col a-side">${mine.length?`<section class="pn pad"><div class="h2">${_t("Tes positions sur ce marché")}</div>${L.filter(o=>mine.some(p=>p.m===o.id)).map(o=>`<div class="gpos"><b>${esc(o.label)}</b>${posBoxH(o)}</div>`).join('')}</section>`:`<section class="pn pad"><div class="h2">${_t("Comment ça marche")}</div><p class="sub" style="margin-top:6px">${_t("Une seule issue gagne à la clôture. Chaque part Oui sur l’issue gagnante rapporte 1 $ ; chaque part Non sur une issue perdante rapporte 1 $ aussi.")}</p><p class="sub">${_t("Les prix bougent avec les ordres : quand une issue monte, les autres descendent, comme sur Polymarket.")}</p></section>`}${radiantsH(L[0])}</aside>
 ${chatH(rid,'mkt a-chat',mktChatHead(Object.assign({id,msgs:g.msgs,online:Math.round(g.people*.07)},{})))}
 <section class="pn pad a-rules"><div class="h2">${_t("Règles de résolution")}</div><p class="plead" style="font-size:15px">${esc(g.rules)}</p></section></div></div>`;}
VIEWS.marche=id=>GK[id]?vGroup(id):vMarket(id);
/* sur la page d'un groupe, le panneau « Tes positions » se rafraîchit après un achat ou une vente */
{const placeBet1=placeBet,sellPos1=sellPos;const onGroup=ctx=>{const st=tState(ctx),m=st&&MK[st.m];return m&&m.parent&&(S.ui.route||'')==='marche-'+m.parent;};
 placeBet=function(ctx,ev){const g=onGroup(ctx);placeBet1(ctx,ev);if(g)render(false);};
 sellPos=function(ctx){const g=onGroup(ctx);sellPos1(ctx);if(g)render(false);};}

/* ---------- Chat des groupes : quelques lignes au départ ---------- */
{const t=now(),ids=USER_IDS.slice().sort(()=>R()-.5);const GL={
 presid27:[_t("Roux prend 5 points en une semaine, le marché suit les sondages."),_t("Je garde Non sur Lefèvre à 73 ¢, c’est le meilleur rendement du marché."),_t("Quelqu’un a une source sur le retrait de Moreau ?")],
 ldc27:[_t("Le Real à 22 % c’est cher pour une équipe qui perd ses matchs de poule."),_t("City favori comme chaque année, et comme chaque année…"),_t("Le PSG à 15 ¢, je prends 100 $, on verra au printemps.")],
 crypto2:[_t("Ethereum à 61 %, ça reste le pari sûr."),_t("Solana a doublé son volume en six mois, 19 % c’est bas."),_t("XRP à 9 ¢ pour un simple retour au classement de 2025, pourquoi pas.")]};
 for(const g of GROUPS){const r=room('m:'+g.id);let k=0;(GL[g.id]||[]).forEach((txt,i)=>r.msgs.push(mkMsg({u:ids[k++],k:'msg',text:txt,at:t-(16-i*4)*60000,r:i===0?{'🔥':Math.round(3+R()*12)}:{}})));
  const o=gSorted(g)[1];r.msgs.push(mkMsg({u:ids[k++],k:'bet',text:'',bet:{m:o.id,s:'oui',amt:pick([100,200,300,500]),price:Math.round(o.p)},followers:Math.round(R()*20),at:t-2*60000}));}}

<script>
'use strict';
/* ===================== Comptes persistants (plusieurs comptes par navigateur) ===================== */
const MEMLS={};

 'flash-bet':(a,e)=>flashBet(a.dataset.v,e,a.dataset.fg),
 'flash-amt':a=>{S.ui.flashAmt=+a.dataset.v;$$('[data-a="flash-amt"]').forEach(b=>b.classList.toggle('on',+b.dataset.v===S.ui.flashAmt));$$('[data-fa]').forEach(e=>e.textContent=F.usd0(S.ui.flashAmt));},
 'flres-close':a=>{const o=a.closest('.flres');if(o)o.remove();},
 fhelp:()=>{S.ui.fmh=!fhelpOpen();render(false);},
 fopen:a=>{const d=GM[a.dataset.v];if(!d||!S.me.logged)return;S.me.fmode='free';if(!inCat(d)){S.me.fcat='Tout';S.flash.spot=fSpot(S.flash.round);S.flash.hist=null;}S.ui.fgame=d.id;save();if((S.ui.route||'')==='eclair')render(false);},
 fgame:a=>{S.ui.fgame=a.dataset.v;render(false);},
