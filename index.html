 falert:a=>{const k=a.dataset.v,L=S.me.falerts=(S.me.falerts||[]);const i=L.indexOf(k);if(i>=0)L.splice(i,1);else L.push(k);save();const on=i<0;$$(`[data-a="falert"][data-v="${k}"]`).forEach(b=>{b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));});toast({icon:'info',force:true,title:on?`${_t("Alerte activée : {0}",[GM[k].name])}`:`${_t("Alerte retirée : {0}",[GM[k].name])}`,text:on?_t("Tu seras prévenu quand il passe en vedette."):_t("Plus de notification pour ce pari."),dur:2400});}
});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.fpref;if(!k)return;S.me[k]=e.target.checked;save();toast({icon:'info',force:true,title:k==='fmute'?(e.target.checked?_t("Notifications éclair masquées"):_t("Notifications éclair réactivées")):(e.target.checked?_t("Alerte à chaque manche activée"):_t("Alerte à chaque manche coupée")),dur:2200});});

/* barre des paris : recentre la puce active (la vue est reconstruite à chaque choix) */
/* rangées d'onglets défilantes : l'onglet actif est ramené dans la vue */
function centerTabs(){$$('.fl-tabs,.filters .tabs,.ptabs,.ctabs,.fl-top .fpills').forEach(tb=>{const on=tb.querySelector('.on');if(!on||tb.scrollWidth<=tb.clientWidth+1)return;const b=tb.getBoundingClientRect(),r=on.getBoundingClientRect();tb.scrollLeft+=(r.left+r.width/2)-(b.left+b.width/2);});tabArrows();tabFades();}
/* fondu aussi au début d'une rangée une fois qu'elle a défilé (le fondu de fin est toujours là) */
function tabFades(){$$('.fl-tabs,.filters .tabs,.ptabs,.ctabs,.fl-top .fpills').forEach(tb=>{if(tb.dataset.fd)return;tb.dataset.fd=1;const upd=()=>tb.classList.toggle('at-s',Math.abs(tb.scrollLeft)>6);tb.addEventListener('scroll',upd,{passive:true});upd();});}
/* B6 : sur un écran à souris, une rangée d'onglets qui déborde reçoit deux flèches de défilement ‹ › */
function tabArrows(){if(!matchMedia('(hover:hover) and (pointer:fine)').matches)return;$$('.fl-tabs,.filters .tabs').forEach(tb=>{if(tb.querySelector('.tarr'))return;if(tb.scrollWidth<=tb.clientWidth+1)return;
  const mk=d=>{const b=document.createElement('button');b.type='button';b.className='tarr '+d;b.dataset.a='tscroll';b.dataset.v=d;b.setAttribute('aria-label',d==='prev'?_t('Précédent'):_t('Suivant'));b.innerHTML=ic('right',16);return b;};
  const p=mk('prev'),n=mk('next');tb.insertBefore(p,tb.firstChild);tb.appendChild(n);tb.classList.add('has-arr');
  const upd=()=>{const x=Math.abs(tb.scrollLeft),mx=tb.scrollWidth-tb.clientWidth;p.classList.toggle('off',x<4);n.classList.toggle('off',x>mx-4);};tb.addEventListener('scroll',upd,{passive:true});upd();});}
ACT.tscroll=a=>{const tb=a.parentElement;tb.scrollBy({left:(a.dataset.v==='next'?1:-1)*(RTL?-1:1)*tb.clientWidth*.7,behavior:'smooth'});};

</script>
<script>
'use strict';
/* =====================================================================================
 *  Profil public ou privé + copie automatique des paris (copy trading)
 *  ------------------------------------------------------------------------------------
 *  - Chaque joueur choisit dans « Modifier le profil » si son profil est public ou privé.
 *    Un profil privé ne montre que le pseudo, le rang et la place au classement (les amis voient tout)
 *    et ne peut pas être copié.
 *  - Copier un joueur : budget, mise fixe ou proportionnelle (x % de sa mise), catégories choisies,
 *    arrêt de perte. Chaque nouveau pari du joueur est reproduit par le même carnet d'ordres que
 *    tes propres paris (prix, impact, frais), et chaque vente est reproduite aussi.
 *  - Le joueur copié touche COPY.SHARE (20 %) des frais payés par ses copieurs, pris sur la part de
 *    Wimoro : aucun surcoût pour le copieur.
 *  - Débloqué au rang Or (voir FEATURES.copy), comme la création de paris.
 * ===================================================================================== */
const COPY={MIN_BETS:10,MIN_BUDGET:50,MIN_PER:5,MAX_ACTIVE:10,SHARE:.20,PCT:[5,10,25,50,100]};
const numIn=v=>F.parse(v);

/* ---------- Visibilité du profil ---------- */
const mePrefs=()=>Object.assign({},PREF_DEF,S.me.prefs||{});
const mePublic=()=>!!mePrefs().public;
const meCopyOk=()=>{const p=mePrefs();return !!(p.public&&p.copyok);};
const uPub=u=>u==='me'?mePublic():!!USERS[u]&&USERS[u].pub!==0;
const canSeeProfile=u=>uPub(u)||friendsOf().includes(u);
/* Un joueur est copiable s'il est public, autorise la copie et a un historique suffisant. */
function copyElig(u){const U=USERS[u];if(!U)return {ok:false,why:'none'};if(!uPub(u))return {ok:false,why:'private'};if(U.cp===0)return {ok:false,why:'off'};if(U.bets<COPY.MIN_BETS)return {ok:false,why:'few'};return {ok:true};}
const accLabel=a=>a>=65?[_t("Élevée"),'hi']:a>=58?[_t("Bonne"),'ok']:a>=52?[_t("Moyenne"),'mid']:[_t("Faible"),'lo'];
const gateName=()=>TIERS[GATES.copy.t].name;
/* Nombre de copieurs d'un joueur simulé (stable) et ce que la copie lui a rapporté. */
const copiersOf=u=>{const U=USERS[u];if(!U||!copyElig(u).ok)return 0;return 3+(hash('cp'+u)%30)+(U.acc>=65?25:U.acc>=58?8:0);};
const sharePct=()=>Math.round(COPY.SHARE*100);

function visMetaH(){const pub=mePublic(),n=S.me.copiers||0,e=S.me.copyEarn||0;return `<span class="vis-chip ${pub?'pub':'priv'}">${_t("{0} Profil {1}",[ic(pub?'eye':'lock',12),pub?_t("public"):_t("privé")])}</span>${meCopyOk()&&n?`<span>${_t("{0} copieur{1}{2}",[F.int(n),n>1?'s':'',e>=.005?` · <b class="pl-up">+${F.usd(e)}</b>`:''])}</span>`:''}`;}

/* ---------- Réglage dans Modifier le profil ---------- */
function privSectionH(){const p=S.ui.pe.prefs,pub=!!p.public;
 const row=(k,t,s2,dis)=>`<label class="tgl${dis?' dis':''}"><span class="tx"><b>${t}</b><small>${s2}</small></span><input type="checkbox" data-pe-pref="${k}"${p[k]&&!dis?' checked':''}${dis?' disabled':''}><span class="sl" aria-hidden="true"></span></label>`;
 const card=(on,k,icn,t,d)=>`<button type="button" role="radio" aria-checked="${on}" class="vc${on?' on':''}" data-a="pe-vis" data-v="${k}"><span class="vh">${ic(icn,18)}<b>${t}</b><i class="vr" aria-hidden="true"></i></span><small>${d}</small></button>`;
 return `<section class="pn pad step" data-pepriv><div class="step-h"><h3>${_t("Confidentialité")}</h3></div>
 <div class="vis" role="radiogroup" aria-label="${_t("Visibilité du profil")}">${card(pub,'pub','eye',_t("Profil public"),_t("Tout le monde voit ta précision, tes stats et ton historique. Tu peux autoriser la copie de tes paris."))}${card(!pub,'priv','lock',_t("Profil privé"),_t("Seuls ton pseudo, ton rang et ta place au classement restent visibles. Tes amis voient tout. Personne ne peut te copier."))}</div>
 <div class="tgls">${row('showpos',_t("Afficher mes positions"),_t("Les autres joueurs voient tes positions ouvertes."),!pub)}${row('copyok',_t("Autoriser la copie de mes paris"),`${_t("Les joueurs de rang {0} ou plus peuvent reproduire automatiquement chacun de tes nouveaux paris. Tu touches {1} % des frais qu’ils paient sur ces paris.",[gateName(),sharePct()])}`,!pub)}${row('dms',_t("Messages privés de tous"),_t("Les joueurs que tu ne suis pas peuvent t’écrire."),false)}</div>
 ${pub?'':`<p class="vis-note">${_t("{0} Un profil privé arrête aussi les copies de tes paris en cours.",[ic('info',14)])}</p>`}</section>`;}

/* Après l'enregistrement : passer en privé met fin aux copies dont on est la cible. */
{const base=FORMS.profile;FORMS.profile=function(...a){const wasPub=mePublic(),n=S.me.copiers||0;const r=base.apply(this,a);
 if(wasPub&&!mePublic()&&n){S.me.copiers=0;save();toast({icon:'lock',title:_t("Profil privé"),text:`${_t("{0} joueur{1} de te copier.",[F.int(n),n>1?_t("s ont arrêté"):_t(" a arrêté")])}`});}return r;};}

/* ---------- Données de copie ---------- */
const copiesAll=()=>S.me.copies||(S.me.copies=[]);
const copiesLive=()=>copiesAll().filter(c=>c.status!=='stopped');
const copyOf=u=>copiesLive().find(c=>c.u===u);
const cOpen=c=>c.holds.reduce((a,h)=>a+h.cost,0);
function cUnreal(c){let v=0;for(const h of c.holds){const m=MK[h.m];if(!m)continue;const pr=h.s==='oui'?m.p:100-m.p;v+=h.sh*pr/100-h.cost;}return v;}
const cPnl=c=>c.status==='stopped'?c.endPnl:c.realized+cUnreal(c);
const cFree=c=>Math.max(0,c.budget+c.realized-cOpen(c));
const logC=(c,e)=>{e.at=now();c.log.unshift(e);c.log=c.log.slice(0,30);};
function copyTagH(p){for(const c of copiesLive()){if(c.holds.some(h=>h.m===p.m&&h.s===p.s))return ` <span class="cptag">${ic('copy',10)} ${esc(USERS[c.u].n)}</span>`;}return '';}
const copyCats=()=>[...new Set(MARKETS.map(m=>m.cat))];
const cModeTxt=c=>c.mode==='prop'?`${_t("{0} % de sa mise{1}",[c.pct,c.cap?`${_t(", {0} max",[F.usd0(c.cap)])}`:''])}`:`${_t("{0} par pari",[F.usd(c.per)])}`;
const cCatsTxt=c=>!c.cats||!c.cats.length?_t("Toutes les catégories"):c.cats.map(x=>_t(x)).join(', ');
/* Montant copié pour une mise du joueur copié. */
function copyAmt(c,traderAmt){if(c.mode!=='prop')return c.per;let a=(traderAmt||0)*c.pct/100;if(c.cap)a=Math.min(a,c.cap);return Math.max(0,a);}

/* ---------- Moteur : exécution d'un pari copié ---------- */
/* Même chemin que tes propres paris : prix moyen du carnet, impact sur le marché, frais d'entrée. */
function copyExec(c,m,s,traderAmt){
 if(c.cats&&c.cats.length&&!c.cats.includes(m.cat))return {ok:false,why:'cat'};
 let amt=copyAmt(c,traderAmt);
 if(c.mode==='prop')amt=Math.min(amt,cFree(c));                  // proportionnel : on copie ce que le budget permet encore
 if(amt<COPY.MIN_PER||cFree(c)<amt-1e-9)return {ok:false,why:'budget'};
 if(S.me.balance<amt)return {ok:false,why:'balance'};
 const q=quoteBuy(m,s,amt,myRank().t>=5);
 if(!q.full||q.sh<=0)return {ok:false,why:'liq'};
 S.me.balance-=amt;
 const p=S.me.positions.find(x=>x.m===m.id&&x.s===s);
 if(p){p.avg=(p.avg*p.sh+q.avg*q.sh)/(p.sh+q.sh);p.sh+=q.sh;}else S.me.positions.push({m:m.id,s,sh:q.sh,avg:q.avg});
 S.me.played++;S.me.maxBet=Math.max(S.me.maxBet||0,amt);S.me.realized-=q.fee;
 const old=m.p;applyBuy(m,q);m.anchor=clamp(m.anchor+q.impact*(s==='oui'?1:-1)*.7,5,95);m.people++;addBet(m,{s:s==='oui'?1:0,a:Math.min(1,amt/300),me:1});updateMarket(m,old);
 const h=c.holds.find(x=>x.m===m.id&&x.s===s);if(h){h.sh+=q.sh;h.cost+=q.a;}else c.holds.push({m:m.id,s,sh:q.sh,cost:q.a});
 const give=q.fee*COPY.SHARE;c.realized-=q.fee;c.n++;c.given=(c.given||0)+give;const U=USERS[c.u];if(U)U.earn=(U.earn||0)+give;
 return {ok:true,amt,q};
}
/* Le joueur copié place un pari : toutes les copies actives le reproduisent. */
function copyFire(u,m,s,traderAmt){
 if(!S.me.logged)return;let any=false;
 for(const c of copiesAll()){
  if(c.u!==u||c.status!=='active')continue;
  const U=USERS[u],side=s==='oui'?_t("Oui"):_t("Non"),r=copyExec(c,m,s,traderAmt);
  if(r.ok){any=true;logC(c,{k:'open',m:m.id,s,amt:r.amt});
   toast({tone:'blue',icon:'copy',title:`${_t("Copie de {0}",[U.n])}`,text:`${_t("{0} sur {1}, {2}",[F.usd(r.amt),side,m.short])}`,href:'#copie'});
   notif('copy',`${_t("Copie de {0} : {1} sur {2}, {3}.",[U.n,F.usd(r.amt),side,m.short])}`,'#copie');}
  else if(r.why==='budget'||r.why==='balance'){const k=r.why==='budget'?'dry':'dryB',t=r.why==='budget'?_t("Budget épuisé"):_t("Solde insuffisant");if(!c[k]){c[k]=1;logC(c,{k:'skip',m:m.id,s,why:r.why});notif('copy',`${_t("{0} sur la copie de {1} : ses nouveaux paris ne sont plus copiés.",[t,U.n])}`,'#copie');toast({tone:'amber',icon:'copy',title:F.kv(t,U.n),text:_t("Ses nouveaux paris ne sont plus copiés."),href:'#copie'});}}
  else if(r.why==='cat'){logC(c,{k:'skip',m:m.id,s,why:'cat'});}
  else{logC(c,{k:'skip',m:m.id,s,why:'liq'});}
 }
 if(any){updateHeader();checkBadges();copyGuard();save();copyRefresh();}
}
/* Vend (en tout ou partie) un lot copié ; renvoie le résultat net du lot. */
function copySell(c,h){
 const m=MK[h.m],U=USERS[c.u],p=S.me.positions.find(x=>x.m===h.m&&x.s===h.s),sh=Math.min(h.sh,p?p.sh:0);
 let pnl;
 if(sh>1e-6){
  const q=quoteSell(m,h.s,sh),sold=q.sh;
  if(sold<=1e-9)return 0;
  const cost=h.cost*(sold/h.sh);pnl=q.pro-cost;
  p.sh-=sold;S.me.balance+=q.pro;S.me.realized+=q.pro-sold*p.avg/100;
  if(p.sh<.05){S.me.positions=S.me.positions.filter(x=>x!==p);if(typeof dropGuard==='function')dropGuard(h.m,h.s);}
  S.me.history.unshift({k:'sell',m:m.id,q:m.q,s:h.s,win:pnl>=0,pnl,at:now(),via:'copy',of:U.n});
  const old=m.p;applySell(m,q);addBet(m,{s:h.s==='oui'?0:1,a:Math.min(1,q.pro/300),me:1});updateMarket(m,old);
  h.sh-=sold;h.cost-=cost;c.realized+=pnl;
  if(h.sh<.05)c.holds=c.holds.filter(x=>x!==h);
 }else{ // déjà vendu à la main : on le sort de la copie au prix du marché
  const pr=h.s==='oui'?m.p:100-m.p;pnl=h.sh*pr/100-h.cost;c.realized+=pnl;c.holds=c.holds.filter(x=>x!==h);
 }
 return pnl;
}
/* Le joueur copié vend : les copies actives qui détiennent ce lot le vendent aussi. */
function traderExit(u){
 const cs=copiesAll().filter(c=>c.u===u&&c.status==='active'&&c.holds.length);if(!cs.length)return;
 const c0=pick(cs),h0=pick(c0.holds),m=MK[h0.m],U=USERS[u],side=h0.s==='oui'?_t("Oui"):_t("Non");
 addMsg('m:'+m.id,mkMsg({k:'evt',text:`${_t("{0} a vendu ses parts {1}",[U.n,side])}`}));
 let any=false;
 for(const c of cs){const h=c.holds.find(x=>x.m===h0.m&&x.s===h0.s);if(!h)continue;const pnl=copySell(c,h);any=true;logC(c,{k:'exit',m:m.id,s:h0.s,pnl});
  toast({tone:pnl>=0?'green':'red',icon:'copy',title:`${_t("{0} a vendu, ta copie aussi",[U.n])}`,text:F.kv(m.short,F.signed(pnl)),href:'#copie'});
  notif('copy',`${_t("{0} a vendu ses parts {1} sur {2} : {3} sur ta copie.",[U.n,side,m.short,F.signed(pnl)])}`,'#copie');}
 if(any){updateHeader();copyGuard();save();copyRefresh();}
}
/* Arrêt de perte : si la perte de la copie atteint sa limite, elle s'arrête et vend ses positions. */
function copyGuard(){let hit=false;for(const c of copiesAll()){if(c.status==='stopped'||!c.stop)continue;if(c.realized+cUnreal(c)<=-c.budget*c.stop/100){copyStop(c,'stop',true);hit=true;}}return hit;}
function copyStop(c,why,close){
 if(c.status==='stopped')return;
 if(close)for(const h of c.holds.slice())copySell(c,h);
 c.endPnl=c.realized+cUnreal(c);c.kept=c.holds.length;c.holds=[];c.status='stopped';c.why=why;c.end=now();
 const U=USERS[c.u];
 if(why==='stop'){notif('copy',`${_t("Arrêt de perte atteint sur la copie de {0} : positions vendues, {1}.",[U.n,F.signed(c.endPnl)])}`,'#copie');toast({tone:'red',icon:'copy',title:`${_t("Arrêt de perte : {0}",[U.n])}`,text:`${_t("Copie arrêtée et positions vendues, {0}.",[F.signed(c.endPnl)])}`,href:'#copie',dur:6000});}
 updateHeader();save();copyRefresh();
}

/* ---------- Rémunération quand c'est toi qu'on copie ---------- */
/* À chacun de tes paris, tes copieurs le reproduisent avec leurs propres réglages ; tu touches une part de leurs frais. */
function copierFees(amt,feeRate){
 const n=S.me.copiers||0;if(!n||!meCopyOk()||!(amt>0)||!(feeRate>0))return 0;
 let tot=0;for(let i=0;i<n;i++){const st=Math.min(amt,pick([20,25,50,75,100,150,200,300,500]));tot+=st*feeRate*COPY.SHARE;}
 if(tot<.005)return 0;
 S.me.balance+=tot;S.me.copyEarn=(S.me.copyEarn||0)+tot;
 toast({tone:'green',icon:'copy',title:`${_t("Tes {0} copieurs t’ont rapporté {1}",[F.int(n),F.signed(tot)])}`,text:`${_t("{0} % des frais de leurs paris copiés, crédités sur ton solde.",[sharePct()])}`,href:'#copie',dur:3600});
 notif('copy',`${_t("Revenus de copie : {0} grâce à tes {1} copieurs.",[F.signed(tot),F.int(n)])}`,'#copie');
 return tot;
}

/* ---------- Joueurs simulés : leurs nouveaux paris et leurs ventes ---------- */
function copyDriver(){
 const act=copiesAll().filter(c=>c.status==='active');if(!act.length||R()<.25)return;
 const c=pick(act);
 if(c.holds.length&&R()<.3){traderExit(c.u);return;}
 const pool=c.cats&&c.cats.length?MARKETS.filter(m=>c.cats.includes(m.cat)):MARKETS;
 const m=pool.length&&R()<.7?pick(pool):weighted();botBetCard(R()<.5?'general':'m:'+m.id,m,c.u);
}
/* Des joueurs finissent par copier ton profil s'il est public, copiable et que tes résultats le méritent. */
function botCopier(){
 if(!meCopyOk())return;const st=stats();if(st.settled<COPY.MIN_BETS)return;

<script>
'use strict';
/* =====================================================================================
 *  Ordres à cours limité, stop loss et take profit
 *  ------------------------------------------------------------------------------------
 *  - Ordre limite d'achat : le joueur fixe un prix maximum en ¢ et un montant. Ce qui peut être
 *    exécuté sous ce prix l'est tout de suite ; le reste attend dans le carnet et s'exécute quand
 *    le marché revient (exécutions partielles possibles). Le montant est réservé sur le solde.
 *  - Ordre limite de vente : prix minimum et nombre de parts.
 *  - Protection d'une position : stop loss (vente au marché si le prix tombe sous un seuil) et
 *    take profit (vente au marché si le prix atteint un objectif).
 *  Les ordres sont vérifiés à chaque mouvement de prix (updateMarket) et toutes les 2 secondes.
 * ===================================================================================== */
const ORD={DUST:.5,MINSH:.05};
const ordersAll=()=>S.me.orders||(S.me.orders=[]);
const ordersOpen=m=>ordersAll().filter(o=>o.status==='open'&&(!m||o.m===m));
const ordersDone=()=>ordersAll().filter(o=>o.status!=='open');
const guardsAll=()=>S.me.guards||(S.me.guards=[]);
const guardOf=(m,s)=>guardsAll().find(g=>g.m===m&&g.s===s);
const reservedCash=()=>ordersOpen().filter(o=>o.k==='buy').reduce((a,o)=>a+o.cash,0);
const newId=p=>p+now().toString(36)+Math.floor(R()*46656).toString(36);
const sideTxt=s=>s==='oui'?_t("Oui"):_t("Non");
const lpOf=st=>clamp(Math.round(numOf(st.lp)||0),1,99);
const curPx=(m,s)=>s==='oui'?m.p:100-m.p;

/* ---------- Calcul du ticket en mode limite ---------- */
function calcLimit(st){
 const m=MK[st.m],r=myRank(),disc=r.t>=5,lp=lpOf(st),v=Math.max(0,F.parse(st.amt));
 if(st.mode==='sell'){const p=posOf(st.m,st.side),sh=Math.min(v,p.sh),q=quoteSellCap(m,st.side,sh,lp/100),restPro=q.rest*lp/100,pro=q.pro+restPro;
  return {limit:true,sell:true,lp,q,sh,nowSh:q.sh,nowPro:q.pro,rest:q.rest,restPro,pro,pnl:pro-sh*p.avg/100,bid:bestBid(m,st.side),ok:sh>ORD.MINSH&&lp>=1&&lp<=99&&!!st.lp};}
 const q=quoteBuyCap(m,st.side,v,disc,lp/100),th=q.theta,restSh=q.rest>0?q.rest/((lp/100)*(1+th*(1-lp/100))):0,sh=q.sh+restSh,fee=q.fee+(q.rest-restSh*lp/100);
 return {limit:true,lp,q,amt:v,nowSh:q.sh,nowCost:q.total,rest:q.rest,restSh,sh,fee:Math.max(0,fee),gain:sh-v,ask:bestAsk(m,st.side),insuf:v>S.me.balance+1e-9,ok:v>=1&&v<=S.me.balance+1e-9&&lp>=1&&lp<=99&&!!st.lp};
}
/* Prix limite proposé par défaut : un peu sous le prix pour un achat, un peu au-dessus pour une vente. */
function lpDefault(st){const m=MK[st.m],px=curPx(m,st.side);return String(clamp(Math.round(st.mode==='sell'?px+2:px-2),1,99));}
function otypeH(ctx,st){return `<div class="seg otype" role="tablist" aria-label="${_t("Type d’ordre")}"><button class="${st.otype!=='limit'?'on':''}" data-a="otype" data-v="market" data-ctx="${ctx}">${_t("Au marché")}</button><button class="${st.otype==='limit'?'on':''}" data-a="otype" data-v="limit" data-ctx="${ctx}">${_t("Ordre limite")}</button></div>`;}
function lpFieldH(ctx,st){const m=MK[st.m],px=curPx(m,st.side),sell=st.mode==='sell';if(st.lp===undefined||st.lp==='')st.lp=lpDefault(st);
 const chips=(sell?[2,5,10]:[-2,-5,-10]).map(d=>`<button type="button" class="btn b-ghost sm" data-a="lpset" data-v="${clamp(Math.round(px+d),1,99)}" data-ctx="${ctx}">${bidi((d>0?'+':'−')+plain(F.c(Math.abs(d))))}</button>`).join('');
 return `<div class="amt-h"><b>${sell?_t("Prix de vente minimum"):_t("Prix d’achat maximum")}</b><span>${_t("Prix actuel")} <b class="num" data-${st.side==='oui'?'mc':'mcn'}="${m.id}">${F.c(px)}</b></span></div>
 <label class="amt lpw"><button type="button" class="stp" data-a="lpstep" data-v="-1" data-ctx="${ctx}" aria-label="${_t("Baisser le prix limite")}">${ic('minus',16)}</button><input data-tlp="${ctx}" inputmode="numeric" value="${esc(st.lp)}" aria-label="${_t("Prix limite en cents")}"><span>¢</span><button type="button" class="stp" data-a="lpstep" data-v="1" data-ctx="${ctx}" aria-label="${_t("Monter le prix limite")}">${ic('plus',16)}</button></label>
 <div class="presets">${chips}<button type="button" class="btn b-ghost sm" data-a="lpset" data-v="${Math.round(px)}" data-ctx="${ctx}">${_t("Prix actuel")}</button></div>`;}
function limitCalcH(ctx,c){const st=tState(ctx),m=MK[st.m],Side=sideTxt(st.side);
 if(c.sell){const p=posOf(st.m,st.side);
  return `<div class="calc"><div class="line"><span>${_t("Prix minimum")}</span><b>${F.c(c.lp)}</b></div><div class="line"><span>${_t("Vendu tout de suite")}</span><b>${c.nowSh>ORD.MINSH?`${_t("{0} parts, {1}",[F.d1(c.nowSh),F.usd(c.nowPro)])}`:_t("Rien pour l’instant")}</b></div><div class="line"><span>${_t("En attente dans le carnet")}</span><b>${c.rest>ORD.MINSH?`${_t("{0} parts à {1}",[F.d1(c.rest),F.c(c.lp)])}`:_t("Rien")}</b></div><div class="line"><span>${_t("Ton prix moyen d’achat")}</span><b>${F.c1(p.avg)}</b></div><div class="line gain"><span>${_t("Si tout est vendu")}</span><b class="${plc(c.pnl)}">${F.usd(c.pro)} (${F.signed(c.pnl)})</b></div></div>
  ${c.lp<=c.bid&&c.ok?`<p class="note warn">${_t("Ton prix minimum ({0}) est sous la meilleure demande ({1}) : la vente est immédiate, comme un ordre au marché.",[F.c(c.lp),F.c1(c.bid)])}</p>`:''}
  <button class="btn b-ink lg full" data-a="limit-place" data-ctx="${ctx}"${c.ok?'':' disabled'}>${_t("Placer l’ordre de vente")}</button>
  <p class="note">${_t("L’ordre reste dans le carnet jusqu’à son exécution ou son annulation. Vendre est gratuit.")}</p>`;}
 return `<div class="calc"><div class="line"><span>${_t("Prix maximum")}</span><b>${F.c(c.lp)}</b></div><div class="line"><span>${_t("Exécuté tout de suite")}</span><b>${c.nowSh>ORD.MINSH?`${_t("{0} parts pour {1}",[F.d1(c.nowSh),F.usd(c.nowCost)])}`:_t("Rien pour l’instant")}</b></div><div class="line"><span>${_t("En attente dans le carnet")}</span><b>${c.rest>=ORD.DUST?_t('{0} à {1}',[F.usd(c.rest),F.c(c.lp)]):_t("Rien")}</b></div><div class="line"><span>${_t("Parts si tout est exécuté")}</span><b>${F.d2(Math.max(0,c.sh))}</b></div><div class="line"><span>${_t("Frais estimés")}</span><b>${F.usd(c.fee)}</b></div><div class="line gain"><span>${_t("Gain si {0}, tout exécuté",[Side])}</span><b>${F.signed(Math.max(0,c.gain))}</b></div></div>
 ${c.lp>=c.ask&&c.ok&&c.rest<ORD.DUST?`<p class="note warn">${_t("Ton prix maximum ({0}) est au-dessus de la meilleure offre ({1}) : l’ordre s’exécute entièrement tout de suite.",[F.c(c.lp),F.c1(c.ask)])}</p>`:''}
 ${c.insuf?`<a class="btn b-ink lg full" href="#depot" data-a="close">${_t("Solde insuffisant : déposer des fonds")}</a>`:`<button class="btn ${st.side==='oui'?'b-oui':'b-non'} lg full" data-a="limit-place" data-ctx="${ctx}"${c.ok?'':' disabled'}>${_t("Placer l’ordre limite {0}",[Side])}</button>`}
 <p class="note">${_t("Le montant est réservé sur ton solde tant que l’ordre attend. Tu peux l’annuler à tout moment, sans frais. Les frais ne sont prélevés que sur la partie exécutée.")}</p>`;}

/* ---------- Exécution ---------- */
function fillBuy(o,m){
 const q=quoteBuyCap(m,o.s,o.cash,myRank().t>=5,o.lp/100);if(q.sh<=1e-9)return null;
 const p=S.me.positions.find(x=>x.m===m.id&&x.s===o.s);
 if(p){p.avg=(p.avg*p.sh+q.avg*q.sh)/(p.sh+q.sh);p.sh+=q.sh;}else S.me.positions.push({m:m.id,s:o.s,sh:q.sh,avg:q.avg});
 if(!o.sh){S.me.played++;S.me.maxBet=Math.max(S.me.maxBet||0,o.init);}
 S.me.realized-=q.fee;
 const old=m.p;applyBuy(m,q);m.anchor=clamp(m.anchor+q.impact*(o.s==='oui'?1:-1)*.7,5,95);m.people++;addBet(m,{s:o.s==='oui'?1:0,a:Math.min(1,q.total/300),me:1});
 o.cash=q.rest;o.sh+=q.sh;o.spent+=q.total;o.fee=(o.fee||0)+q.fee;o.last=now();
 if(o.cash<ORD.DUST){S.me.balance+=o.cash;o.cash=0;o.status='filled';o.end=now();}
 updateMarket(m,old);return q;
}
function fillSell(o,m){
 const p=posOf(m.id,o.s),sh=Math.min(o.sh,p.sh);
 if(sh<=ORD.MINSH){o.status='cancelled';o.why='noshares';o.end=now();return null;}
 const q=quoteSellCap(m,o.s,sh,o.lp/100);if(q.sh<=1e-9)return null;
 const pnl=q.pro-q.sh*p.avg/100;p.sh-=q.sh;S.me.balance+=q.pro;S.me.realized+=pnl;
 if(p.sh<ORD.MINSH){S.me.positions=S.me.positions.filter(x=>x!==p);dropGuard(m.id,o.s);}
 S.me.history.unshift({k:'sell',m:m.id,q:m.q,s:o.s,win:pnl>=0,pnl,at:now(),via:'limit'});
 const old=m.p;applySell(m,q);addBet(m,{s:o.s==='oui'?0:1,a:Math.min(1,q.pro/300),me:1});
 o.sh-=q.sh;o.pro=(o.pro||0)+q.pro;o.pnl=(o.pnl||0)+pnl;o.last=now();
 if(o.sh<ORD.MINSH){o.sh=0;o.status='filled';o.end=now();}
 updateMarket(m,old);q.pnl=pnl;return q;
}
let ORD_BUSY=false;
function ordersCheck(m){
 if(ORD_BUSY||!S.me.logged)return;const L=ordersOpen(m.id),G=guardsAll().filter(g=>g.m===m.id);if(!L.length&&!G.length)return;
 ORD_BUSY=true;let touched=false;
 try{
  for(const o of L){
   const q=o.k==='buy'?fillBuy(o,m):fillSell(o,m);if(!q&&o.status==='open')continue;touched=true;
   const done=o.status!=='open';
   if(o.k==='buy'&&q)toast({tone:'blue',icon:'check',title:done?_t("Ordre limite exécuté"):_t("Ordre limite exécuté en partie"),text:`${_t("{0} parts {1} à {2} sur {3}",[F.d1(q.sh),sideTxt(o.s),F.c1(q.avg),m.short])}`,href:'#marche-'+m.id});
   else if(o.k==='sell'&&q)toast({tone:q.pnl>=0?'green':'red',icon:'check',title:done?_t("Vente limite exécutée"):_t("Vente limite exécutée en partie"),text:`${_t("{0} parts à {1} sur {2}, {3}",[F.d1(q.sh),F.c1(q.avg),m.short,F.signed(q.pnl)])}`,href:'#marche-'+m.id});
   else if(o.status==='cancelled')toast({tone:'amber',icon:'info',title:_t("Ordre de vente annulé"),text:`${_t("Tu n’as plus de parts {0} sur {1}.",[sideTxt(o.s),m.short])}`});
   if(q)notif('check',`${_t("{0} {1} : {2} parts {3} à {4}, {5}.",[o.k==='buy'?_t("Ordre limite"):_t("Vente limite"),done?_t("exécuté"):_t("exécuté en partie"),F.d1(q.sh),sideTxt(o.s),F.c1(q.avg),m.short])}`,'#marche-'+m.id);
  }
  for(const g of G){
   const p=posOf(m.id,g.s);if(p.sh<=ORD.MINSH){dropGuard(m.id,g.s);touched=true;continue;}
   const bid=bestBid(m,g.s),hitStop=g.stop&&bid<=g.stop,hitTp=g.tp&&bid>=g.tp;if(!hitStop&&!hitTp)continue;
   const q=quoteSell(m,g.s,p.sh);if(q.sh<=1e-9)continue;
   const pnl=q.pro-q.sh*p.avg/100;p.sh-=q.sh;S.me.balance+=q.pro;S.me.realized+=pnl;touched=true;
   if(p.sh<ORD.MINSH){S.me.positions=S.me.positions.filter(x=>x!==p);dropGuard(m.id,g.s);}
   S.me.history.unshift({k:'sell',m:m.id,q:m.q,s:g.s,win:pnl>=0,pnl,at:now(),via:hitStop?'stop':'tp'});
   const old=m.p;applySell(m,q);addBet(m,{s:g.s==='oui'?0:1,a:Math.min(1,q.pro/300),me:1});updateMarket(m,old);
   const ttl=hitStop?_t("Stop loss déclenché"):_t("Take profit atteint");
   toast({tone:pnl>=0?'green':'red',icon:'shield',title:ttl,text:`${_t("{0} parts {1} vendues à {2} sur {3} : {4}",[F.d1(q.sh),sideTxt(g.s),F.c1(q.avg),m.short,F.signed(pnl)])}`,href:'#profil',dur:6000});
   notif('shield',`${_t("{0} sur {1} : {2} parts {3} vendues à {4}, {5}.",[ttl,m.short,F.d1(q.sh),sideTxt(g.s),F.c1(q.avg),F.signed(pnl)])}`,'#profil');
  }
 }finally{ORD_BUSY=false;}
 if(touched){updateHeader();checkBadges();save();ordersRefresh();}
}
function ordersTick(){if(!S.me.logged)return;const ids=new Set([...ordersOpen().map(o=>o.m),...guardsAll().map(g=>g.m)]);for(const id of ids){const m=MK[id];if(m)ordersCheck(m);}}

/* ---------- Placement et annulation ---------- */
function placeLimit(ctx,ev){
 const st=tState(ctx),m=MK[st.m],c=calcLimit(st);if(!c.ok||!m)return;
 if(typeof rgBlocked==='function'&&rgBlocked('bet'))return;
 const before=myRank();let o;

 const pnlAt=x=>x?p.sh*(x-p.avg)/100:0;let err='';
 if(stop&&stop>=px)err=_t("Le stop loss doit être sous le prix actuel.");else if(tp&&tp<=px)err=_t("Le take profit doit être au-dessus du prix actuel.");else if(!stop&&!tp)err=_t("Indique au moins un seuil.");
 return {m,p,px,stop,tp,pnlStop:pnlAt(stop),pnlTp:pnlAt(tp),err,ok:!err,none:!stop&&!tp};}

const guardRes=(c,v)=>c.p.avg>0?(v-c.p.avg)/c.p.avg*100:0;
function guardHint(c,k){const v=c[k];if(!v)return k==='stop'?_t('Limite ta perte si le marché se retourne.'):_t('Encaisse automatiquement quand ton objectif est atteint.');
 return _t('Vente de toutes les parts au marché à {0} : {1} sur ta position, résultat estimé {2}.',[F.c(v),fmtPct(guardRes(c,v)),F.signed(k==='stop'?c.pnlStop:c.pnlTp)])+(v>=99?' '+_t('{0} est le plafond : une part ne peut pas valoir plus.',[F.c(99)]):'');}

 return `<div class="md cpm"><div class="md-h"><div><p>${_t("Protéger ma position {0}",[sideTxt(d.s)])}</p><h3>${esc(m.short)}</h3></div><button class="x" data-a="close" aria-label="${_t("Fermer")}">${ic('x')}</button></div>
 <div class="cp-kpis"><div><small>${_t("Parts")}</small><b class="num">${F.d1(p.sh)}</b></div><div><small>${_t("Prix moyen")}</small><b class="num">${F.c1(p.avg)}</b></div><div><small>${_t("Prix actuel")}</small><b class="num">${F.c(c.px)}</b></div></div>

{try{const q=new URLSearchParams(location.search).get('r');if(q&&REF_RE.test(q.trim())){LS.s('wimoro-ref',q.trim().toUpperCase());history.replaceState(null,'',location.pathname+location.hash);}}catch(e){}}

function wrapLines(ctx,text,maxW,maxLines){const words=String(text).split(/\s+/),lines=[];let cur='';for(const w of words){const tst=cur?cur+' '+w:w;if(ctx.measureText(tst).width>maxW&&cur){lines.push(cur);cur=w;}else cur=tst;}if(cur)lines.push(cur);if(lines.length>maxLines){const L=lines.slice(0,maxLines);let last=L[maxLines-1];while(ctx.measureText(last+'…').width>maxW&&last.length>3)last=last.slice(0,-1).trim();L[maxLines-1]=last+'…';return L;}return lines;}

 const lh=Math.round(qf*1.2),big=lines.length<=3,vf=big?72:56,G1=44,G2=96,blockH=lines.length*lh+G1+90+G2+36+vf+20,top=250,bot=H-290;
 ctx.font=font(700,qf);ctx.fillStyle='#fff';let y=top+Math.max(0,Math.round((bot-top-blockH)/2))+qf;for(const l of lines){ctx.fillText(l,X,y);y+=lh;}

<script>
'use strict';
/* =====================================================================================
 *  Jeu responsable
 *  ------------------------------------------------------------------------------------
 *  - Limites de dépôt (jour, semaine, mois) fixées par le joueur : une baisse s'applique tout de
 *    suite, une hausse ou une suppression après RG.COOL heures de réflexion.
 *  - Pause : paris et dépôts bloqués pendant 24 h à 30 jours ; retraits et consultation possibles.
 *  - Auto-exclusion : 6 mois, 1 an, 3 ans ou définitive ; le compte est fermé et la connexion refusée.
 *  - Export de l'historique en Excel (.xlsx) ou PDF, générés ici même, sans bibliothèque.
 * ===================================================================================== */
const RG={COOL:48,PAUSES:[[24,_t('24 h')],[72,_t('3 jours')],[168,_t('7 jours')],[720,_t('30 jours')]],EXCL:[[6,_t('6 mois')],[12,_t('1 an')],[36,_t('3 ans')],[0,_t('Définitive')]],WIN:{day:86400e3,week:7*86400e3,month:30*86400e3}};
const rg=()=>S.me.rg||(S.me.rg={lim:{day:0,week:0,month:0},pend:{},pause:0,excl:0});
const HOUR=3600e3;
const fmtDT=ts=>new Date(ts).toLocaleString(LOC,{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
const fmtD=ts=>new Date(ts).toLocaleDateString(LOC,{day:'numeric',month:'long',year:'numeric'});
const rgPaused=()=>rg().pause>now();
const rgExcluded=()=>{const e=rg().excl;return e===-1||e>now();};
const winTxt=k=>({day:_t('par jour'),week:_t('par semaine'),month:_t('par mois')})[k];

/* ---------- Limites de dépôt ---------- */
function depSum(win){const t0=now()-win;return (S.me.deps||[]).filter(d=>!d.label&&d.at>=t0).reduce((a,d)=>a+(d.usd||0),0);}
/* Ce qu'il reste possible de déposer en respectant toutes les limites actives. */
function rgDepRoom(){rgApplyPending();let room=Infinity,bind=null;for(const k of ['day','week','month']){const l=rg().lim[k];if(!l)continue;const r=Math.max(0,l-depSum(RG.WIN[k]));if(r<room){room=r;bind=k;}}return {room,bind};}
function rgApplyPending(){const g=rg();let ch=false;for(const k of Object.keys(g.pend||{})){const p=g.pend[k];if(p&&p.at<=now()){g.lim[k]=p.v;delete g.pend[k];ch=true;notif('shield',`${_t("Ta limite de dépôt {0} est maintenant {1}.",[winTxt(k),p.v?F.usd0(p.v):_t("retirée")])}`,'#responsable');}}if(ch)save();}
function rgSetLimit(k,v){const g=rg(),cur=g.lim[k]||0;v=Math.max(0,Math.round(v));
 if(v===cur){delete g.pend[k];save();return 'same';}
 if(cur&&(v===0||v>cur)){g.pend[k]={v,at:now()+RG.COOL*HOUR};save();return 'pending';}   // hausse ou suppression : délai de réflexion
 g.lim[k]=v;delete g.pend[k];save();return 'now';}
/* Vérifie un dépôt (montant en dollars) ; explique le refus. */
function rgDepOk(usd){if(rgExcluded())return false;if(rgPaused()){toast({tone:'amber',icon:'shield',title:_t("Dépôts en pause"),text:`${_t("Tu as demandé une pause jusqu’au {0}.",[fmtDT(rg().pause)])}`,href:'#responsable'});return false;}
 const {room,bind}=rgDepRoom();if(usd>room+1e-9){toast({tone:'amber',icon:'shield',title:_t("Limite de dépôt atteinte"),text:room>0?`${_t("Il te reste {0} à déposer {1}.",[F.usd(room),winTxt(bind)])}`:`${_t("Tu as atteint ta limite {0}.",[winTxt(bind)])}`,href:'#responsable',dur:5000});return false;}return true;}
function rgDepNoteH(){const {room,bind}=rgDepRoom();if(room===Infinity)return '';return `<div class="limit${room<=0?' over':''}" data-rgroom><span>${room>0?`${_t("Limite de dépôt : il te reste <b>{0}</b> {1}.",[F.usd(room),winTxt(bind)])}`:`${_t("Limite de dépôt {0} atteinte.",[winTxt(bind)])}`} <a class="link" href="#responsable">${_t("Mes limites")}</a></span></div>`;}

/* ---------- Pause et auto-exclusion ---------- */
function rgBlocked(kind){if(rgExcluded())return true;if(!rgPaused())return false;toast({tone:'amber',icon:'shield',title:_t("Tu es en pause"),text:`${_t("Les paris {0}sont bloqués jusqu’au {1}.",[kind==='dep'?_t("et les dépôts "):'',fmtDT(rg().pause)])}`,href:'#responsable'});return true;}
function rgPauseStart(h){rg().pause=now()+h*HOUR;for(const c of (S.me.copies||[]))if(c.status==='active'){c.status='paused';c.byPause=1;}flushSave();closeModal();
 toast({icon:'shield',title:_t("Pause activée"),text:`${_t("Paris et dépôts bloqués jusqu’au {0}. Tes copies sont en pause.",[fmtDT(rg().pause)])}`,dur:5000});notif('shield',`${_t("Pause activée jusqu’au {0}.",[fmtDT(rg().pause)])}`,'#responsable');rgSync();if(S.ui.route==='responsable')render(false);}
function rgPauseEnd(){const g=rg();if(!g.pause)return;g.pause=0;for(const c of (S.me.copies||[]))if(c.byPause){c.status='active';delete c.byPause;}save();notif('shield',_t('Ta pause est terminée : tu peux de nouveau parier et déposer.'),'#responsable');rgSync();}
function rgExcludeStart(months){const g=rg();g.excl=months?now()+months*30*86400e3:-1;g.pause=0;for(const c of (S.me.copies||[]))if(c.status!=='stopped'){c.status='stopped';c.why='excl';c.end=now();}
 const rec=accountOfMe();if(rec){rec.excl=g.excl;AUTH.set(rec.key,rec);}flushSave();closeModal();
 const msg=months?`${_t("Ton compte est fermé jusqu’au {0}.",[fmtD(g.excl)])}`:_t("Ton compte est fermé définitivement.");
 leaveAccount();LS.r(SESK);S.auth={key:'',demo:false};KEY='wimoro-guest';S.me=guestMe();S.ui.authNote=`${_t("Auto-exclusion enregistrée. {0}",[msg])}`;updateHeader();rgSync();if(location.hash!=='#connexion')location.hash='#connexion';else render(true);
 toast({icon:'shield',title:_t("Auto-exclusion enregistrée"),text:msg,dur:7000});}
/* À la connexion ou au démarrage : un compte auto-exclu ne peut pas entrer. */
function rgLoginBlocked(){if(!rgExcluded())return false;const e=rg().excl;S.me.logged=false;flushSave();LS.r(SESK);S.auth={key:'',demo:false};KEY='wimoro-guest';S.me=guestMe();
 S.ui.authNote=e===-1?_t("Ce compte est fermé définitivement à la demande de son titulaire (auto-exclusion)."):`${_t("Ce compte est en auto-exclusion jusqu’au {0}. La connexion est impossible avant cette date.",[fmtD(e)])}`;updateHeader();if(location.hash!=='#connexion')location.hash='#connexion';else render(true);return true;}
function rgBoot(){if(S.me.logged&&rgExcluded())rgLoginBlocked();}
function rgTick(){if(!S.me.logged)return;const g=rg();rgApplyPending();if(g.pause&&g.pause<=now())rgPauseEnd();}
/* Bandeau sous l'en-tête pendant une pause. */
function rgSync(){let bar=$('#rgbar');const on=S.me.logged&&rgPaused();if(!on){if(bar)bar.remove();return;}
 const html=`<div class="rgbar-in">${ic('shield',16)}<span>${_t("Pause en cours : paris et dépôts bloqués jusqu’au <b>{0}</b>.",[fmtDT(rg().pause)])}</span><a class="link" href="#responsable">${_t("Détails")}</a></div>`;
 if(!bar){bar=document.createElement('div');bar.id='rgbar';bar.className='rgbar';const v=$('#view');v.parentNode.insertBefore(bar,v);}bar.innerHTML=html;fixText(bar);}

/* ---------- Page « Jeu responsable » ---------- */
function rgLimitRowH(k){const g=rg(),cur=g.lim[k]||0,p=g.pend[k];
 return `<div class="rg-lim"><div class="rg-lim-h"><b>${({day:_t("Par jour"),week:_t("Par semaine"),month:_t("Par mois")})[k]}</b><span class="sub">${cur?`${_t("Limite actuelle : {0}, déjà déposé : {1}",[F.usd0(cur),F.usd0(depSum(RG.WIN[k]))])}`:_t("Aucune limite")}</span></div><form class="rg-lim-f" data-form="rglim" data-k="${k}"><label class="amt"><input name="v" inputmode="numeric" value="${cur?F.inp(cur):''}" placeholder="${_t("Aucune")}" aria-label="${_t("Limite {0}",[winTxt(k)])}"><span>USDC</span></label><button class="btn b-ink" type="submit">${_t("Appliquer")}</button></form>${p?`<p class="sub rg-pend">${_t("{0} {1} le {2} (délai de réflexion de {3} h).",[ic('info',13),p.v?`${_t("Passage à {0}",[F.usd0(p.v)])}`:_t("Suppression de la limite"),fmtDT(p.at),RG.COOL])} <button class="link" type="button" data-a="rg-pend-cancel" data-k="${k}">${_t("Annuler")}</button></p>`:''}</div>`;}
function vRG(){const g=rg(),paused=rgPaused();
 return `<div class="wrap"><nav class="crumbs"><a href="#profil">${_t("Ton profil")}</a><span>/</span><span>${_t("Jeu responsable")}</span></nav><div class="pagehead" style="margin-top:10px"><div><h1 class="ptitle">${_t("Jeu responsable")}</h1><p class="plead">${_t("Tu gardes la main : fixe tes limites de dépôt, fais une pause ou ferme ton compte pour la durée que tu choisis. Ces réglages ne peuvent pas être contournés, même par le support.")}</p></div></div>

const CRC_T=(()=>{const tb=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;tb[n]=c>>>0;}return tb;})();

  const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(n),...u32(n),...u16(name.length),...u16(0)]);parts.push(lh,name,data);
  cd.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(n),...u32(n),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);off+=lh.length+name.length+n;}
 let cdLen=0;for(const p of cd)cdLen+=p.length;const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdLen),...u32(off),...u16(0)]);
 const out=new Uint8Array(off+cdLen+end.length);let p=0;for(const x of [...parts,...cd,end]){out.set(x,p);p+=x.length;}return out;}

function pdfLayout(){const d=exportData(),W=595.28,Hh=841.89,M=40,pages=[];let pg=[],y=M;const line=(x,text,o={})=>pg.push(Object.assign({x,y,text:plain(String(text)),size:10,bold:false,align:'left'},o));
 const newPage=()=>{pages.push(pg);pg=[];y=M;};const need=h=>{if(y+h>Hh-M)newPage();};
 line(M,'Wimoro',{size:20,bold:true});line(W-M,_t('Relevé de compte'),{size:11,align:'right'});y+=30;line(M,_t('{0} · {1} · édité le {2}',[d.me.n,d.me.rank,fmtDT(now())]),{size:10});y+=18;
 line(M,_t('Solde : {0}   Résultat réalisé : {1}   Positions : {2}   Paris joués : {3}   Précision : {4} %',[F.usd(d.me.bal),F.signed(d.me.realized),F.usd(d.me.value),F.int(d.me.played),d.me.acc]),{size:10});y+=26;
 /* Largeurs calculées sur le texte réel : chaque colonne prend la place de sa plus longue valeur, la colonne élastique
    (le marché) prend le reste et se tronque ; un en-tête plus large que sa colonne passe sur deux lignes. */
 const SZ=9,GAP=12,tw=(s,b)=>pdfTextW(s,SZ,b),cellS=v=>typeof v==='number'?F.d2(v):plain(String(v==null?'':v));
 const fit=(s,w)=>{if(tw(s)<=w)return s;let n=s.length;while(n>1&&tw(s.slice(0,n)+'…')>w)n--;return s.slice(0,n)+'…';};
 const split=c=>{const p=c.split(' ');if(p.length<2)return [c];let best=[c],bw=tw(c,true);for(let i=1;i<p.length;i++){const l=[p.slice(0,i).join(' '),p.slice(i).join(' ')],m=Math.max(tw(l[0],true),tw(l[1],true));if(m<bw){bw=m;best=l;}}return best;};
 const table=(key,cols,rows,aligns,flex)=>{need(46);line(M,EXPORT_TITLES[key],{size:13,bold:true});y+=18;
  const R=rows.map(r=>r.map(cellS)),n=cols.length,cw=cols.map((c,i)=>R.reduce((m,r)=>Math.max(m,tw(r[i])),0));
  const hl=cols.map((c,i)=>i===flex||tw(c,true)<=cw[i]?[c]:split(c));hl.forEach((l,i)=>{if(i!==flex)cw[i]=Math.max(cw[i],...l.map(x=>tw(x,true)));});
  const used=cw.reduce((a,w,i)=>a+(i===flex?0:w),0)+GAP*(n-1);cw[flex]=Math.max(60,W-2*M-used);
  const xl=[];let x=M;for(let i=0;i<n;i++){xl.push(x);x+=cw[i]+GAP;}
  const at=i=>aligns[i]==='right'?xl[i]+cw[i]:xl[i],hh=Math.max(...hl.map(l=>l.length));
  const hdr=()=>{hl.forEach((l,i)=>l.forEach((t,k)=>pg.push({x:at(i),y:y+(hh-l.length+k)*11,text:fit(t,cw[i]),size:SZ,bold:true,align:aligns[i]})));y+=hh*11+4;};hdr();
  if(!R.length){line(M,_t('Aucune ligne.'),{size:SZ});y+=16;}
  for(const r of R){if(y+14>Hh-M){newPage();hdr();}r.forEach((v,i)=>line(at(i),fit(v,cw[i]),{size:SZ,align:aligns[i]}));y+=13;}y+=14;};
 table('hist',EXPORT_COLS.hist,d.hist,['left','left','left','left','right'],2);
 table('pos',EXPORT_COLS.pos,d.pos,['left','left','right','right','right','right'],0);
 table('ords',EXPORT_COLS.ords,d.ords,['left','left','left','left','right','right','right'],1);
 table('flows',EXPORT_COLS.flows,d.flows,['left','left','left','right'],2);
 pages.push(pg);return {pages,W,H:Hh};}

<script>
'use strict';
/* =====================================================================================
 *  Duels 1 contre 1 entre amis
 *  ------------------------------------------------------------------------------------
 *  - Uniquement sur les marchés officiels de Wimoro : un marché classique (réglé à sa
 *    clôture) ou une manche éclair (réglée en 45 secondes, prix relevés comme preuve).
 *  - Le défieur choisit son camp et sa mise ; l'ami accepte en prenant le camp inverse.
 *    Les cotes viennent du marché au moment de l'acceptation : si Oui vaut 70 ¢, celui
 *    qui dit Oui engage 70 % de la cagnotte, l'autre 30 %, le gagnant prend tout.
 *    Concrètement : deux ordres qui se croisent sur le vrai carnet, au prix du marché.
 *  - Les deux mises sont bloquées sous séquestre Wimoro dès l'acceptation ; personne ne
 *    décide du résultat : la plateforme règle le duel avec la résolution du marché et
 *    affiche la preuve (prix relevé, résultat officiel) sur la carte.
 *  - Variante « duel de stack » : même buy-in, 1 000 jetons virtuels chacun, une semaine
 *    sur tous les marchés, le plus gros stack remporte la cagnotte.
 *  - Lien d'invitation : il contient le duel (marché, camp, mise, défieur) ; l'ami qui
 *    l'ouvre voit la règle et la source de résolution, puis accepte.
 *  Démo : les amis répondent en quelques secondes et des défis arrivent de temps en temps.
 * ===================================================================================== */
const DUEL={MIN:5,MAX:5000,EXPIRE:48*3600e3,STACK_DAYS:7,STACK_CHIPS:1000,STACK_FEE:.04};
const duelsAll=()=>S.me.duels||(S.me.duels=[]);
const duelOf=id=>duelsAll().find(d=>d.id===id);
const duelActive=()=>duelsAll().filter(d=>d.status==='active');
const duelOpenMine=()=>duelsAll().filter(d=>d.status==='open'&&d.by==='me');
const duelIncoming=()=>duelsAll().filter(d=>d.status==='open'&&d.by!=='me');
const duelDone=()=>duelsAll().filter(d=>['won','lost','void','expired','declined'].includes(d.status)).sort((a,b)=>(b.settleAt||b.at)-(a.settleAt||a.at));
const duelCode=()=>'D'+(Date.now().toString(36)+Math.floor(R()*1296).toString(36)).toUpperCase().slice(-6);
/* marché d'un duel : marché classique (MK) ou manche éclair (« flash:btc ») */
const duelIsFlash=d=>typeof d.m==='string'&&d.m.startsWith('flash:');
const duelGame=d=>duelIsFlash(d)?GM[d.m.slice(6)]:null;
function duelQ(d){const g=duelGame(d);if(g)return g.q;const m=MK[d.m];return m?m.q:d.q||'';}
function duelShort(d){const g=duelGame(d);if(g)return `${_t("Éclair {0}, manche {1}",[g.name,F.int(d.round)])}`;const m=MK[d.m];return m?m.short:d.q||'';}
function duelSideTxt(d,s){const g=duelGame(d);if(g)return s==='oui'?g.a:g.b;return s==='oui'?_t("Oui"):_t("Non");}
function duelSource(d){const g=duelGame(d);if(g)return g.kind==='dir'?`${_t("Prix {0} relevé par Wimoro au début et à la fin de la manche (flux Coinbase)",[g.name])}`:g.kind==='vol'?_t("Prix du Bitcoin relevé par Wimoro (flux Coinbase)"):_t("Score officiel relevé en direct par Wimoro");const m=MK[d.m];return m?m.rules:'';}
/* prix actuel (¢) du camp `s` */
function duelPrice(d,s){const g=duelGame(d);if(g){const pr=flashPrices(G(g.id));return s==='oui'?pr.o:pr.n;}const m=MK[d.m];return Math.round(s==='oui'?m.p:100-m.p);}
const duelOpp=s=>s==='oui'?'non':'oui';
const duelRate=()=>wmRate('Crypto',myRank().t>=5);
/* frais réels d'un camp pour une mise donnée : ceux du carnet (marché) ou de la cagnotte (éclair) */
function duelFee(d,side,amt){if(amt<=0)return 0;const disc=myRank().t>=5;const g=duelGame(d);if(g)return flashFee(g.cat,G(g.id),side,amt,disc);const m=MK[d.m];if(!m)return 0;const q=quoteBuy(m,side,amt,disc);return q.fee||0;}
/* mise du camp adverse pour une cagnotte donnée : cagnotte × prix adverse */
function duelSplit(stake,price){const pot=stake*100/price;return {pot,other:pot*(100-price)/100};}
const duelUserN=u=>u==='me'?S.me.n:(USERS[u]?USERS[u].n:u);
/* avatar d'un participant, y compris un défieur venu d'un lien (inconnu ici) */
const duelAvH=(u,size)=>(u==='me'||USERS[u])?avH(u,size,'span'):`<span class="av t2" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.4)}px">${esc(String(u)[0]||'?')}</span>`;
const duelMySide=d=>d.by==='me'?d.side:duelOpp(d.side);
const duelOppOf=d=>d.by==='me'?d.opp:d.by;

/* ---------- Création ---------- */
function duelCreate(m,side,stake,opp){if(!S.me.logged)return null;if(typeof rgBlocked==='function'&&rgBlocked('bet'))return null;
 const fee=duelFee({m},side,stake);if(stake+fee>S.me.balance+1e-9){toast({tone:'amber',icon:'wallet',title:_t("Solde insuffisant"),text:_t("Dépose des fonds pour continuer."),href:'#depot'});return null;}
 const isF=m.startsWith('flash:');let round=0;if(isF){const ph=flashPhase();round=S.flash.round+(ph.openLeft<10000?1:0);}
 const d={id:'d'+now().toString(36)+Math.floor(R()*999),code:duelCode(),kind:'market',m,round,side,by:'me',opp:opp||null,stake,fee,status:'open',at:now(),expiresAt:isF?now()+120000:now()+DUEL.EXPIRE,price0:duelPrice({m},side)};
 S.me.balance-=stake+fee;S.me.realized-=fee;duelsAll().unshift(d);S.me.duelsMade=(S.me.duelsMade||0)+1;save();updateHeader();
 notif('swords',opp?`${_t("Défi envoyé à {0} : {1}, tu dis {2}, {3}.",[duelUserN(opp),duelShort(d),duelSideTxt(d,side),F.usd0(stake)])}`:`${_t("Duel créé : {0}, tu dis {1}, {2}. Envoie le lien à un ami.",[duelShort(d),duelSideTxt(d,side),F.usd0(stake)])}`,'#duel-'+d.id);
 duelScheduleBot(d);return d;}
/* ---------- Acceptation : deux ordres croisés au prix du marché, mises sous séquestre ---------- */
function duelAccept(d,who){if(d.status!=='open')return false;const s=d.side,p=duelPrice(d,s);if(p<2||p>98)return false;const sp=duelSplit(d.stake,p),oppFee=duelFee(d,duelOpp(s),sp.other);
 if(who==='me'){if(typeof rgBlocked==='function'&&rgBlocked('bet'))return false;if(sp.other+oppFee>S.me.balance+1e-9){toast({tone:'amber',icon:'wallet',title:_t("Solde insuffisant"),text:`${_t("Il te faut {0} pour accepter ce duel.",[F.usd(sp.other+oppFee)])}`,href:'#depot'});return false;}S.me.balance-=sp.other+oppFee;S.me.realized-=oppFee;d.opp='me';}
 else d.opp=who;
 d.price=p;d.oppStake=sp.other;d.pot=sp.pot;d.oppFee=oppFee;d.status='active';d.acceptAt=now();
 const m=MK[d.m];if(m){const old=m.p;const q1=quoteBuy(m,s,d.stake,false),q2=quoteBuy(m,duelOpp(s),sp.other,false);if(q1.full)applyBuy(m,q1);if(q2.full)applyBuy(m,q2);m.vol+=d.stake+sp.other;m.people++;addBet(m,{s:s==='oui'?1:0,a:Math.min(1,d.stake/300),me:d.by==='me'?1:0});addBet(m,{s:s==='oui'?0:1,a:Math.min(1,sp.other/300),me:d.opp==='me'?1:0});updateMarket(m,old);}
 save();updateHeader();return true;}
function duelRefund(d,reason){if(d.by==='me'&&['open','active'].includes(d.status)){S.me.balance+=d.stake;}if(d.opp==='me'&&d.status==='active')S.me.balance+=d.oppStake||0;d.status=reason;d.settleAt=now();save();updateHeader();}
/* ---------- Règlement ---------- */
function duelSettle(d,winSide,proof){if(d.status!=='active')return;const mine=duelMySide(d),meIn=d.by==='me'||d.opp==='me';const won=winSide===mine;d.winSide=winSide;d.proof=proof;d.settleAt=now();d.status=won?'won':'lost';
 if(meIn){const before=myRank();const myStake=d.by==='me'?d.stake:d.oppStake;const pnl=won?d.pot-myStake:-myStake;S.me.settled++;S.me.realized+=pnl;S.me.duelPnl=(S.me.duelPnl||0)+pnl;if(won){S.me.balance+=d.pot;S.me.wins++;S.me.duelWins=(S.me.duelWins||0)+1;gainXP(20);}
  S.me.history.unshift({k:'duel',q:`${_t("Duel contre {0} : {1}",[duelUserN(duelOppOf(d)),duelShort(d)])}`,s:mine,win:won,pnl,at:now()});
  toast({tone:won?'green':'red',icon:'swords',force:true,title:won?`${_t("Duel gagné : +{0}",[F.usd(d.pot-myStake)])}`:`${_t("Duel perdu : −{0}",[F.usd(myStake)])}`,text:`${duelShort(d)}. ${proof.txt}`,href:'#duel-'+d.id});notif('swords',`${_t("{0} contre {1} : {2}.",[won?_t("Duel gagné"):_t("Duel perdu"),duelUserN(duelOppOf(d)),duelShort(d)])}`,'#duel-'+d.id);
  if(won&&!$('.flres'))confetti(30);checkRank(before);checkBadges();}
 save();if((S.ui.route||'').startsWith('duel'))render(false);}
/* manches éclair : règlement avec les prix relevés */
const resolveFlash0=resolveFlash;
resolveFlash=function(){const round=S.flash.round,starts={},ends={};for(const g of GAMES){const gm=G(g.id);starts[g.id]=gm.start;ends[g.id]=g.kind==='dir'?gm.price:gm.start;}resolveFlash0();
 for(const d of duelsAll()){if(!duelIsFlash(d)||d.round!==round)continue;const g=duelGame(d),gm=G(g.id),r=gm.result;if(!r)continue;
  if(d.status==='open'){duelRefund(d,'expired');continue;}
  if(d.status!=='active')continue;
  if(r.out===2){duelRefund(d,'void');notif('swords',`${_t("Duel annulé : break even sur {0}, les deux mises sont rendues.",[g.name])}`,'#duel-'+d.id);continue;}
  const start=starts[g.id],end=ends[g.id],hist=gm.hist&&gm.hist[0];
  const proof=g.kind==='event'?{txt:r.out===1?g.rs(true):g.rs(false),src:duelSource(d),at:now()}:{txt:`${_t("Départ {0}, arrivée {1} ({2}).",[g.fp(start),g.fp(end),pctFx(hist?hist.ch:0)])}`,src:duelSource(d),at:now(),start,end};
  duelSettle(d,r.out===1?'oui':'non',proof);}
 duelStackTick();};
/* marchés classiques : réglés à la clôture (hors démo) ; passage des délais */
function duelTick(){if(document.hidden)return;for(const d of duelsAll()){if(d.status==='open'&&d.expiresAt&&now()>d.expiresAt){duelRefund(d,'expired');if(d.by==='me')notif('swords',`${_t("Duel expiré sans réponse : {0}. Ta mise t’est rendue.",[duelShort(d)])}`,'#duels');}}}

/* ---------- Amis simulés ---------- */
function duelScheduleBot(d){const ep=S.epoch;const who=d.opp||pick(friendsOf().length?friendsOf():USER_IDS);const delay=duelIsFlash(d)?2500+R()*5000:6000+R()*14000;
 setTimeout(()=>{if(ep!==S.epoch||d.status!=='open')return;if(R()<.12&&!d.opp){duelRefund(d,'declined');notif('swords',`${_t("{0} a décliné ton duel sur {1}. Ta mise t’est rendue.",[duelUserN(who),duelShort(d)])}`,'#duels');if((S.ui.route||'').startsWith('duel'))render(false);return;}
  if(duelAccept(d,who)){toast({tone:'blue',icon:'swords',force:true,title:`${_t("{0} accepte ton duel",[duelUserN(who)])}`,text:`${_t("{0} : {1} dit {2} pour {3}. Cagnotte {4}.",[duelShort(d),duelUserN(who),duelSideTxt(d,duelOpp(d.side)),F.usd(d.oppStake),F.usd(d.pot)])}`,href:'#duel-'+d.id});notif('swords',`${_t("{0} a accepté ton duel : {1}, cagnotte {2}.",[duelUserN(who),duelShort(d),F.usd(d.pot)])}`,'#duel-'+d.id);if((S.ui.route||'').startsWith('duel'))render(false);}},delay);}
/* un ami te défie de temps en temps */
function duelBotChallenge(){if(!S.me.logged||!friendsOf().length||duelIncoming().length>=2||R()<.5)return;const who=pick(friendsOf()),m=pick(MARKETS.filter(x=>!x.creator)),side=R()<.5?'oui':'non',stake=pick([10,20,25,50,100]);
 const d={id:'d'+now().toString(36)+Math.floor(R()*999),code:duelCode(),kind:'market',m:m.id,round:0,side,by:who,opp:'me',stake,fee:0,status:'open',at:now(),expiresAt:now()+DUEL.EXPIRE,price0:Math.round(side==='oui'?m.p:100-m.p)};
 duelsAll().unshift(d);save();notif('swords',`${_t("{0} te défie : {1}, {0} dit {2} pour {3}.",[duelUserN(who),m.short,side==='oui'?_t("Oui"):_t("Non"),F.usd0(stake)])}`,'#duel-'+d.id);toast({tone:'blue',icon:'swords',title:`${_t("{0} te défie",[duelUserN(who)])}`,text:`${_t("{0} : {1} dit {2}, {3}. À toi de prendre l’autre camp.",[m.short,duelUserN(who),side==='oui'?_t("Oui"):_t("Non"),F.usd0(stake)])}`,href:'#duel-'+d.id});}

/* ---------- Duel de stack ---------- */
const stacksAll=()=>S.me.stacks||(S.me.stacks=[]);
function stackCreate(buyin,opp){if(!S.me.logged)return null;if(typeof rgBlocked==='function'&&rgBlocked('bet'))return null;if(buyin>S.me.balance){toast({tone:'amber',icon:'wallet',title:_t("Solde insuffisant"),text:_t("Dépose des fonds pour continuer."),href:'#depot'});return null;}
 const d={id:'s'+now().toString(36)+Math.floor(R()*999),kind:'stack',buyin,opp,status:'active',at:now(),endAt:now()+DUEL.STACK_DAYS*86400e3,ref:S.me.realized+portfolio().unreal,my:DUEL.STACK_CHIPS,theirs:DUEL.STACK_CHIPS,path:[DUEL.STACK_CHIPS],opath:[DUEL.STACK_CHIPS]};
 S.me.balance-=buyin;stacksAll().unshift(d);save();updateHeader();notif('swords',`${_t("Duel de stack lancé contre {0} : {1} chacun, {2} jetons, une semaine.",[duelUserN(opp),F.usd0(buyin),DUEL.STACK_CHIPS])}`,'#duels');return d;}
/* ton stack suit tes résultats réels depuis le départ (1 jeton = 1 $ de résultat) ; celui de l'adversaire est simulé */
function duelStackTick(){for(const d of stacksAll()){if(d.status!=='active')continue;const cur=S.me.realized+portfolio().unreal;d.my=Math.max(0,Math.round(DUEL.STACK_CHIPS+(cur-d.ref)));const rr=rng(hash(d.id+Math.floor(now()/60000)));d.theirs=Math.max(0,Math.round(d.theirs*(1+(rr()-.48)*.04)));
 if(now()-(d.lastPt||d.at)>3600e3){d.path.push(d.my);d.opath.push(d.theirs);d.lastPt=now();}
 if(now()>=d.endAt){const pot=d.buyin*2*(1-DUEL.STACK_FEE);const won=d.my>d.theirs,tie=d.my===d.theirs;d.status=tie?'void':won?'won':'lost';d.settleAt=now();if(tie)S.me.balance+=d.buyin;else if(won){S.me.balance+=pot;gainXP(30);}
  notif('swords',tie?_t("Duel de stack : égalité, buy-in rendu."):won?`${_t("Duel de stack gagné contre {0} : +{1}.",[duelUserN(d.opp),F.usd(pot-d.buyin)])}`:`${_t("Duel de stack perdu contre {0}.",[duelUserN(d.opp)])}`,'#duels');}}

 y+=210;ctx.font=font(500,30);ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillText(txt(d.pot?`${_t("Cagnotte {0} · cote du marché à l’acceptation : {1}",[plain(F.usd0(d.pot)),plain(F.c(d.price))])}`:`${_t("Cote actuelle : {0} pour {1}",[plain(F.c(d.price0||50)),duelSideTxt(d,d.side)])}`),X,y);

<script>
'use strict';
/* =====================================================================================
 *  Blitz : manches de 60 secondes enchaînées, deux modes sur le même moteur de prix
 *  ------------------------------------------------------------------------------------
 *  Blitz Royale (multijoueur) : buy-in, tout le monde dans la même salle, une manche
 *    de 60 s toutes les minutes sur le même événement en direct (bougie BTC/ETH…),
 *    choix Haut / Bas / Break even. Ceux qui ont faux sont éliminés ; après 10 manches
 *    les survivants se partagent la cagnotte. Personne ne survit : la cagnotte est
 *    reportée sur le Blitz suivant. Éliminé = spectateur, avec le chat. Un seul rachat,
 *    dans les limites de jeu responsable. La cagnotte = la somme des entrées : Wimoro
 *    n'est jamais exposé (commission 5 % sur la cagnotte distribuée).
 *    Rythme réel : un Blitz par heure, 24 h/24, prime time à 21 h (buy-in 25 $).
 *    Démo : un Blitz toutes les 10 minutes pour pouvoir jouer tout de suite.
 *  La Série (solo) : une mise, chaque bonne prédiction de 60 s multiplie le stack
 *    (manche éclair ordinaire jouée avec tout le stack, adossée au marché) ; entre
 *    deux manches : Encaisser ou Continuer. Break even = manche all-in à grosse cote.
 * ===================================================================================== */
const BZ={ROUNDS:10,ROUND_MS:60000,CHOICE_MS:30000,PAUSE_MS:10000,BUYIN:10,PRIME_BUYIN:25,REBUY:50,PRIME_H:21,RAKE:.05,LOBBY_MS:75000,PERIOD_MS:600000,GID:'btc',BOTS:[1900,3100],SHOW:14};
/* fenêtre de choix : les 30 premières secondes de la manche */
const bzOpen=r=>r.state==='live'&&!r.between&&now()<r.rStart+BZ.CHOICE_MS;
const bzGame=()=>GM[BZ.GID];
S.bz={royale:null,jackpot:0,history:[]};
const bzR=()=>S.bz.royale;
const bzAlive=r=>r.bots.filter(b=>b.alive).length+(r.me&&r.me.alive?1:0);
const bzPot=r=>r.pot;
const bzShare=r=>{const n=bzAlive(r);return n?r.pot*(1-BZ.RAKE)/n:0;};
const bzIsPrime=t=>new Date(t).getHours()===BZ.PRIME_H;
/* nouveau Blitz : salle d'attente ouverte, les joueurs arrivent peu à peu */
function bzNew(startAt){const prime=bzIsPrime(startAt);const r={id:'bz'+startAt.toString(36),state:'lobby',startAt,prime,buyin:prime?BZ.PRIME_BUYIN:BZ.BUYIN,carried:S.bz.jackpot,pot:S.bz.jackpot,bots:[],me:null,round:0,rStart:0,rEnd:0,p0:0,log:[],target:BZ.BOTS[0]+Math.floor(R()*(BZ.BOTS[1]-BZ.BOTS[0]))*(prime?2:1)};S.bz.jackpot=0;S.bz.royale=r;return r;}
function bzBotJoin(r,n){const ids=USER_IDS.filter(u=>!r.bots.some(b=>b.u===u));for(let i=0;i<n;i++){const u=ids.length?ids.splice(Math.floor(R()*ids.length),1)[0]:'bot'+(r.bots.length+1);r.bots.push({u,alive:true,rebuy:false,choice:null});r.pot+=r.buyin;}}
function bzJoin(){const r=bzR();if(!r||r.state!=='lobby'||!S.me.logged)return false;if(typeof rgBlocked==='function'&&rgBlocked('bet'))return false;if(r.me)return false;
 if(r.buyin>S.me.balance){toast({tone:'amber',icon:'wallet',title:_t("Solde insuffisant"),text:_t("Dépose des fonds pour continuer."),href:'#depot'});return false;}
 S.me.balance-=r.buyin;r.pot+=r.buyin;r.me={alive:true,rebuy:false,choice:null,paid:r.buyin};S.me.played++;S.me.bzPlayed=(S.me.bzPlayed||0)+1;updateHeader();save();gainXP(10);
 toast({tone:'blue',icon:'bolt',force:true,title:_t("Inscrit au Blitz Royale"),text:`${_t("Buy-in {0}. Départ dans {1} s, 10 manches de 60 secondes.",[F.usd0(r.buyin),Math.max(1,Math.round((r.startAt-now())/1000))])}`});return true;}
const bzCanRebuy=r=>!!(r&&r.state==='live'&&r.between&&r.round===1&&r.me&&!r.me.alive&&!r.me.rebuy&&r.me.outRound===1);
function bzRebuy(){const r=bzR();if(!bzCanRebuy(r))return false;if(typeof rgBlocked==='function'&&rgBlocked('bet'))return false;
 if(BZ.REBUY>S.me.balance){toast({tone:'amber',icon:'wallet',title:_t("Solde insuffisant"),text:_t("Dépose des fonds pour continuer."),href:'#depot'});return false;}
 S.me.balance-=BZ.REBUY;r.pot+=BZ.REBUY;r.me.alive=true;r.me.rebuy=true;r.me.choice=null;r.me.paid+=BZ.REBUY;updateHeader();save();bzRefresh();toast({tone:'blue',icon:'bolt',force:true,title:_t("Rachat accepté"),text:`${_t("{0} ajoutés à la cagnotte. Tu reviens en jeu à la manche {1}. C’était ton seul rachat.",[F.usd0(BZ.REBUY),r.round+1])}`});return true;}
function bzChoose(c){const r=bzR();if(!r||r.state!=='live'||!r.me||!r.me.alive||r.between)return;if(!bzOpen(r)){toast({tone:'amber',icon:'lock',title:_t("Choix fermés"),text:`${_t("Le choix se fait dans les {0} premières secondes de la manche.",[BZ.CHOICE_MS/1000])}`});return;}r.me.choice=c;bzRefresh();}
/* résultat d'une manche : prix de fin contre prix de départ, bande break even du jeu */
function bzOutcome(r){const d=bzGame(),g=G(d.id),m=Math.abs(g.price/r.p0-1);if(m<=d.be)return 2;return g.price>r.p0?1:0;}
function bzStartRound(r){const g=G(BZ.GID);r.round++;r.rStart=now();r.rEnd=r.rStart+BZ.ROUND_MS;r.p0=g.price;r.path=[g.price];r.closed=false;r.bots.forEach(b=>{if(b.alive)b.choice=null;});if(r.me)r.me.choice=null;r.pend=r.p0;}
function bzBotChoices(r){const g=G(BZ.GID),up=g.price>r.p0;for(const b of r.bots){if(!b.alive||b.choice!==null)continue;if(R()<.08)continue;const x=R();b.choice=x<.04?2:x<.5+(up?.08:-.08)?1:0;}}
function bzEndRound(r){const out=bzOutcome(r),g=G(BZ.GID);let gone=0;for(const b of r.bots){if(b.alive&&b.choice!==out){b.alive=false;gone++;}}
 const meWas=r.me&&r.me.alive;if(r.me&&r.me.alive&&r.me.choice!==out){r.me.alive=false;r.me.outRound=r.round;gone++;}
 r.log.unshift({round:r.round,out,p0:r.p0,p1:g.price,gone,alive:bzAlive(r)});
 const lab=out===2?_t("Break even"):out===1?_t("Haut"):_t("Bas");
 if(r.me){if(meWas&&!r.me.alive){toast({tone:'red',icon:'bolt',flash:true,title:`${_t("Éliminé à la manche {0}",[r.round])}`,text:`${_t("C’était {0}. {1}",[lab,r.round===1&&!r.me.rebuy?`${_t("Rachat possible à {0} avant la manche 2.",[F.usd0(BZ.REBUY)])}`:_t("Tu restes en spectateur.")])}`,href:'#blitz'});}
  else if(r.me.alive)toast({tone:'green',icon:'bolt',flash:true,title:`${_t("Manche {0} : tu survis",[r.round])}`,text:`${_t("{0}. {1} en vie, ta part : {2}.",[lab,F.int(bzAlive(r)),F.usd(bzShare(r))])}`,href:'#blitz'});}
 addMsg('blitz',mkMsg({k:'evt',text:`${_t("Manche {0} : {1}. {2} éliminé{3}, {4} encore en vie.",[r.round,lab,gone,gone>1?'s':'',bzAlive(r)])}`}));
 if(r.round>=BZ.ROUNDS||bzAlive(r)===0)bzFinish(r);else{r.between=now()+BZ.PAUSE_MS;}}
function bzFinish(r){r.state='done';r.endAt=now();const alive=bzAlive(r);
 if(alive===0){S.bz.jackpot=r.pot;r.result='carry';addMsg('blitz',mkMsg({k:'evt',text:`${_t("Personne n’a survécu : {0} reportés sur le prochain Blitz.",[F.usd0(r.pot)])}`}));}
 else{const each=r.pot*(1-BZ.RAKE)/alive;r.result='paid';r.each=each;if(r.me&&r.me.alive){const before=myRank();S.me.balance+=each;S.me.wins++;S.me.settled++;S.me.realized+=each-r.me.paid;S.me.bzWins=(S.me.bzWins||0)+1;S.me.history.unshift({k:'blitz',q:`${_t("Blitz Royale : survivant sur {0}",[F.int(r.bots.length+1)])}`,s:'oui',win:true,pnl:each-r.me.paid,at:now()});gainXP(80);toast({tone:'green',icon:'trophy',force:true,title:`${_t("Blitz gagné : +{0}",[F.usd(each-r.me.paid)])}`,text:`${_t("{0} survivant{1} se partagent {2}.",[alive,alive>1?'s':'',F.usd0(r.pot)])}`,href:'#blitz'});confetti(60);checkRank(before);checkBadges();}
  else if(r.me){S.me.settled++;S.me.realized-=r.me.paid;S.me.history.unshift({k:'blitz',q:`${_t("Blitz Royale : éliminé")}`,s:'non',win:false,pnl:-r.me.paid,at:now()});}
  addMsg('blitz',mkMsg({k:'evt',text:`${_t("Fin du Blitz : {0} survivant{1}, {2} chacun.",[alive,alive>1?'s':'',F.usd(each)])}`}));}
 S.bz.history.unshift({id:r.id,at:r.endAt,pot:r.pot,players:r.bots.length+(r.me?1:0),alive,each:r.each||0,me:r.me?(r.me.alive?'won':'lost'):null,prime:r.prime});S.bz.history=S.bz.history.slice(0,8);save();
 const next=bzNextSlot();setTimeout(()=>{if(S.bz.royale===r)bzNew(next);bzRefresh();},6000);}
/* créneaux : toutes les 10 min en démo (toutes les heures en réel), prime time à 21 h */
function bzNextSlot(){const t=now();return t+BZ.PERIOD_MS-(t%BZ.PERIOD_MS)+BZ.LOBBY_MS;}
function bzTick(){let r=bzR();if(!r){r=bzNew(now()+BZ.LOBBY_MS);}
 if(r.state==='lobby'){const want=Math.min(r.target,Math.round(r.target*(1-Math.max(0,r.startAt-now())/(BZ.LOBBY_MS+BZ.PERIOD_MS))));if(r.bots.length<want)bzBotJoin(r,Math.min(want-r.bots.length,6+Math.floor(R()*18)));
  if(now()>=r.startAt){const min=Math.round(r.target*.88);if(r.bots.length<min)bzBotJoin(r,min-r.bots.length);r.state='live';addMsg('blitz',mkMsg({k:'evt',text:`${_t("Le Blitz commence : {0} joueurs, cagnotte {1}.",[F.int(r.bots.length+(r.me?1:0)),F.usd0(r.pot)])}`}));bzStartRound(r);}}
 else if(r.state==='live'){if(r.between){if(now()>=r.between){r.between=0;bzStartRound(r);}}else{if(bzOpen(r)){if(R()<.2)bzBotChoices(r);}else if(!r.closed){r.closed=true;bzBotChoices(r);bzRefresh();}if(now()>=r.rEnd)bzEndRound(r);}}
 bzRefresh(true);}
/* le chemin de prix des manches (Blitz, Série) suit le tick éclair de 250 ms : même graphique que l'Éclair */
{const flashTick0=flashTick;flashTick=function(){flashTick0();const r=bzR();if(r&&r.state==='live'&&!r.between){(r.path||(r.path=[r.p0])).push(G(BZ.GID).price);if(r.path.length>BZ.ROUND_MS/250+8)r.path.shift();}const s=typeof serieCur==='function'?serieCur():null;if(s&&s.state==='running'){(s.path||(s.path=[s.p0])).push(G(s.gid).price);if(s.path.length>SERIE.ROUND_MS/250+8)s.path.shift();}};}
/* ---------- Graphique de la manche : même rendu que l'Éclair (courbe ou bougies, zone break even, départ) ---------- */
function roundChartSvg(d,p0,path,durMs){return flashChart(false,d,{path:path&&path.length?path:[p0],start:p0,dur:durMs});}

const SERIE={MAX:12,ROUND_MS:60000,CHOICE_MS:30000};
/* une manche dure 60 s ; le choix (ou l'encaissement) se fait dans les 30 premières secondes */
const serieOpen=s=>!!s&&s.state==='running'&&s.choice===null&&now()<s.rStart+SERIE.CHOICE_MS;
const serieCur=()=>S.me.serie||null;
const serieToday=()=>S.me.serieToday||(S.me.serieToday=[]);
function serieMults(gid){const d=GM[gid],g=G(gid),pr=flashPrices(g);return {oui:100/pr.o,non:100/pr.n,be:beMultFair(beProb(d.be,d.k,SERIE.ROUND_MS/250))};}
function serieRoundStart(s){const g=G(s.gid);s.step++;s.state='running';s.choice=null;s.mult=0;s.fee=0;s.rStart=now();s.rEnd=s.rStart+SERIE.ROUND_MS;s.p0=g.price;s.path=[g.price];}
function serieStart(gid,stake){if(!S.me.logged)return false;if(typeof rgBlocked==='function'&&rgBlocked('bet'))return false;if(serieCur()&&serieCur().state!=='lost'&&serieCur().state!=='cashed')return false;

 S.me.balance-=stake;S.me.played++;S.me.serie={gid,stake,stack:stake,step:0,state:'running',hist:[],at:now()};serieRoundStart(S.me.serie);updateHeader();save();gainXP(10);return true;}
/* choisir Haut / Bas / Break even : seulement pendant la fenêtre de choix de la manche en cours */

function serieEnd(){const s=serieCur();if(!s||s.state!=='running')return;const d=GM[s.gid],g=G(s.gid);
 if(s.choice===null){s.step--;if(s.step<=0){s.state='cashed';s.endAt=now();S.me.balance+=s.stake;S.me.settled++;toast({tone:'amber',icon:'wallet',force:true,title:_t("Série annulée"),text:_t("Aucun choix dans les 30 secondes : ta mise t’est rendue."),href:'#serie'});updateHeader();save();serieRefresh();return;}
  toast({tone:'amber',icon:'wallet',force:true,title:_t("Encaissement automatique"),text:`${_t("Aucun choix dans les {0} secondes : {1} encaissés.",[SERIE.CHOICE_MS/1000,F.usd(s.stack)])}`,href:'#serie'});serieCash(true);return;}
 const m=Math.abs(g.price/s.p0-1),out=m<=d.be?'be':g.price>s.p0?'oui':'non';const win=out===s.choice;
 s.hist.push({step:s.step,choice:s.choice,out,mult:s.mult,p0:s.p0,p1:g.price,win});
 if(win){s.stack=(s.stack-s.fee)*s.mult;toast({tone:'green',icon:'bolt',flash:true,title:`${_t("Manche {0} gagnée : stack {1}",[s.step,F.usd(s.stack)])}`,text:`${_t("{0} Encaisse ou continue dans les {1} secondes.",[out==='be'?_t("Break even !"):out==='oui'?_t("Haut."):_t("Bas."),SERIE.CHOICE_MS/1000])}`,href:'#serie'});if(s.step>=SERIE.MAX){serieCash(true);return;}serieRoundStart(s);}

 save();serieRefresh();}

<script>

/* =====================================================================================
 *  Clans
 *  ------------------------------------------------------------------------------------
 *  - Création dès le rang Argent, compte de plus de 14 jours, 50 $ de frais non remboursables.
 *    Nom, tag de 3-4 lettres affiché partout à côté du pseudo, emblème, langues, catégories,
 *    description. 50 membres maximum.

 *    30 jours → le clan passe à l'officier le plus actif. Quitter = 7 jours d'attente.
 *  - Classement mensuel : XP de clan = volume misé par les membres sur le mois, plafonné
 *    par membre et par jour ; coefficient de forme = ROI du clan sur le mois, borné entre
 *    ×0,5 et ×2 ; score = XP × coefficient. Seuls les 25 meilleurs contributeurs comptent.
 *    Il faut 15 jours d'ancienneté dans le mois pour compter et être récompensé. Les mises
 *    entre deux membres du même clan sur le même marché ne donnent pas d'XP.
 *  - Divisions : cinq divisions de 20 clans (Division 5 → Division 1), 3 montées et 3 descentes par mois,
 *    cagnotte par division financée par une part des frais générés par ses clans, répartie
 *    au prorata des points. Top 3 mondial : trophée, tag doré un mois, emblème en accueil.
 *  - Guerres de clans : le chef déclare, matchmaking dans la division, 48 h, buy-in par
 *    participant dans la cagnotte de guerre, score = points des 10 meilleurs de chaque camp.
 *  - Vie du clan : chat, fil d'actualité (opt-in), positions du clan, appel de clan,
 *    récap hebdo en image. Pas de trésor : toutes les cagnottes passent par le séquestre.
 *    Les limites de jeu responsable priment sur tout.
 * ===================================================================================== */

 'cl-join':a=>{if(!S.me.logged){needLogin(_t("Connecte-toi pour rejoindre un clan."));return;}if(clanJoin(CK[a.dataset.id]))render(false);},
 'cl-apply':a=>{if(!S.me.logged){needLogin(_t("Connecte-toi pour candidater."));return;}clanApply(CK[a.dataset.id]);render(false);},
 'cl-leave':()=>{openModal(`<div class="md"><div class="md-h"><div><h3>${_t("Quitter le clan ?")}</h3><p>${_t("Tu pourras en rejoindre un autre dans {0} jours. Ta contribution du mois reste au clan.",[CLAN.LEAVE_WAIT_D])}</p></div><button class="x" data-a="close" aria-label="${_t("Fermer")}">${ic('x')}</button></div><div class="hbtns"><button class="btn b-non" data-a="cl-leave-do">${_t("Quitter")}</button><button class="btn b-white" data-a="close">${_t("Rester")}</button></div></div>`);},
 'cl-leave-do':()=>{clanLeave();closeModal();location.hash='#clans';},
 'cl-share':()=>{const c=myClan();if(c)clanShare(c);},
 'cl-promote':a=>{const c=myClan();if(!c||clanRole()!=='chef'||c.officers.length>=CLAN.OFFICERS)return;c.officers.push(a.dataset.u);clanFeedPush(c,{u:'me',txt:`${_t("{0} est nommé officier.",[duelUserN(a.dataset.u)])}`});save();toast({icon:'check',title:`${_t("{0} est officier",[duelUserN(a.dataset.u)])}`});render(false);},
 'cl-kick':a=>{const c=myClan();if(!c||!isOfficer())return;const u=a.dataset.u;c.members=c.members.filter(m=>m.u!==u);c.officers=c.officers.filter(x=>x!==u);c.n=Math.max(0,c.n-1);if(USERS[u]&&USERS[u].clan===c.id)USERS[u].clan=null;clanFeedPush(c,{u:'me',txt:`${_t("{0} a été exclu du clan.",[duelUserN(u)])}`});save();toast({icon:'check',title:`${_t("{0} exclu",[duelUserN(u)])}`});render(false);},
 'cl-invite':()=>{const c=myClan();if(!c||!isOfficer())return;const fr=friendsOf().filter(u=>!clanMates(c).includes(u));if(!fr.length){toast({icon:'info',title:_t("Tous tes amis sont déjà dans le clan")});return;}const u=fr[0];c.members.push({u,since:now(),pts:0});USERS[u].clan=c.id;c.n++;clanFeedPush(c,{u:'me',txt:`${_t("{0} rejoint le clan sur invitation de {1}.",[duelUserN(u),S.me.n])}`});save();toast({tone:'green',icon:'userplus',title:`${_t("{0} a rejoint le clan",[duelUserN(u)])}`,text:_t("Invitation acceptée.")});render(false);},
 'cl-call-open':()=>clanCallModal(),
 'cl-call-do':()=>{const c=myClan();const sel=$('#clcm'),side=$('#ov .sd.on');if(!c||!sel)return;clanCall(c,sel.value,side?side.dataset.clcs:'oui');closeModal();toast({tone:'blue',icon:'target',force:true,title:_t("Appel de clan lancé"),text:_t("Les membres le voient en tête du fil et dans le chat.")});S.ui.cltab='activite';render(false);},
 'cl-war':()=>{const c=myClan();if(!c)return;clanWarDeclare(c);toast({tone:'blue',icon:'swords',force:true,title:`${_t("Guerre déclarée contre {0}",[CK[c.war.foe].name])}`,text:_t("48 h, buy-in par participant, score des 10 meilleurs.")});render(false);},
 'cl-war-open':a=>{S.ui.cltab='guerre';if(location.hash===a.getAttribute('href'))render(false);},
 'cl-war-join':()=>{const c=myClan();if(c)clanWarJoin(c);render(false);},
 'cl-feedopt':a=>{S.me.prefs=S.me.prefs||{};S.me.prefs.clanFeed=a.checked;save();}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-clcs]');if(!b)return;$$('#ov [data-clcs]').forEach(x=>x.classList.toggle('on',x===b));});

/* contribution : chaque mise compte (marchés classiques et éclair) */
const placeBet0=placeBet;placeBet=function(ctx,ev){const st=tState(ctx),c=calcT(st),before=S.me.balance;placeBet0(ctx,ev);if(S.me.balance<before-1e-6&&c&&c.amt)clanRecordBet(st.m,c.amt);};
const flashBet0=flashBet;flashBet=function(side,ev,gid){const before=S.me.balance;flashBet0(side,ev,gid);if(S.me.balance<before-1e-6){const x=clanCount(null,before-S.me.balance);clanRecordBet(null,before-S.me.balance);if(x&&x.add>0){CLAN_FL[S.flash.round+':'+(GM[gid||S.ui.fgame]||GAMES[0]).id]=x;if(typeof updateFlash==='function')updateFlash(true);}}};

 {i:3,name:_t("Crypto du soir"),tag:'CRSO',chief:'satoshi',cats:['Crypto'],ic:'bolt',col:'#F59A0B',desc:_t("Les paris crypto du soir, entre habitués."),mem:['satoshi','ines','tomtom','sofia'],n:44},
 {i:7,name:_t("Les Vestiaires"),tag:'VEST',chief:'karim',cats:['Football'],ic:'trophy',col:'#12A150',desc:_t("Foot européen et pronos du week-end."),mem:['karim','kdurand','mehdi'],n:36},
 {i:24,name:_t("Les Éclairs"),tag:'ECLR',chief:'ines',cats:['Crypto','Sport'],ic:'flame',col:'#2448FF',desc:_t("Un pari toutes les 45 secondes, toute la soirée."),mem:['orbital','nina'],n:47},
 {i:29,name:_t("Macro club"),tag:'MACR',chief:'kaizen',cats:['Économie'],ic:'chart',col:'#7350E3',desc:_t("Taux, inflation et banques centrales."),mem:['kaizen'],n:41}];
/* un joueur n'a qu'un clan : on le retire des autres listes de membres */
function clanMoveUser(u,c){CLANS.forEach(o=>{if(o!==c)o.members=o.members.filter(m=>m.u!==u);});if(USERS[u])USERS[u].clan=c.id;}
for(const P of CL_PUBLIC){const c=CLANS[P.i];if(!c)continue;c.name=P.name;c.tag=P.tag;c.chief=P.chief;c.cats=P.cats;c.ic=P.ic;c.col=P.col;c.desc=P.desc;c.access='open';c.minRank=0;c.lang=['fr'];c.n=P.n;c.members=P.mem.map((u,k)=>({u,since:now()-(40-k*5)*86400e3,pts:Math.round(400+rng(hash(P.tag+u))()*1600)}));c.officers=P.mem.slice(1,2);P.mem.forEach(u=>clanMoveUser(u,c));c.public=true;}
/* ---------- Persistance : seul S.me est sauvegardé, l'état vivant de mon clan y est recopié à chaque save ---------- */
const CL_LIVE=['members','officers','chief','chiefLastActive','wars','war','calls','feed','n'];
const save0=save;
save=function(){const c=myClan();if(c){const st={};for(const k of CL_LIVE)st[k]=c[k];S.me.clanLive={id:c.id,st,full:c.mine?c:null};}else if(S.me.clanLive)delete S.me.clanLive;save0();};
function clanRestore(){const L=S.me.clanLive;if(!L||!S.me.clan||S.me.clan.id!==L.id)return;let c=CK[L.id];if(!c&&L.full){c=L.full;CLANS.push(c);CK[c.id]=c;}if(!c)return;Object.assign(c,L.st);(c.members||[]).forEach(m=>clanMoveUser(m.u,c));const r=room('clan:'+c.id);r.name=c.name;r.kind='clan';}
/* ---------- Démo : User26 est officier des Renards de Fer ---------- */
function clanDemoDress(c){['lea','maxou','jules'].forEach(u=>clanMoveUser(u,c));c.members=[...new Set([...clanMates(c),'lea','maxou','jules'])].map(u=>c.members.find(m=>m.u===u)||{u,since:now()-30*86400e3,pts:1200});c.officers=['lea'];c.chief='satoshi';c.chiefLastActive=now()-3*86400e3;c.wars.unshift({foe:'c52',at:now()-5*86400e3,status:'won',a:4120,b:3870,pot:260});clanFeedPush(c,{u:'lea',tk:'lea vient de gagner 400 $ sur Bitcoin à 150 000 $.'});clanFeedPush(c,{u:'maxou',tk:'maxou a misé 200 $ sur Barça au Clásico.'});}
function clanSeed(){if(!S.me.logged)return;if(!S.me.createdAt)S.me.createdAt=S.me.n==='User26'?now()-62*86400e3:now();
 if(S.me.n==='User26'&&!S.me.clanSeeded){S.me.clanSeeded=true;const c=CK.c47;S.me.clan={id:c.id,role:'officier',since:now()-21*86400e3};S.me.clanXP=1840;S.me.clanVol={};clanDemoDress(c);save();}
 else clanRestore();}
